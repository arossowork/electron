project: home_thermostat
revision: A
description: Two-zone Wi-Fi thermostat, 2 x AAA -> TPS610994 boost 3.3 V + 4.7 mF buffer, ESP32-C3-MINI-1, CS1238 ratiometric NTC, 2 x DRV8837 + PE014F03 bistable relays switching 230 VAC.
# One design file holds both boards (hwflow builds one PCB per design). Groups prefixed rear_ go on the
# rear board, front_ on the front board; J4A (socket, rear) and J4B (header, front) carry the link.
# See notes/circuit.md "Board split" for the layout stage.
libraries: [lib]
# Stage 7 layout representation (notes/layout.md): hwflow writes ONE board outline, so the two boards are laid out
# side by side in one 130 x 40 mm panel. Rear board = x 0..62, front board = x 68..130 (local = panel x - 68),
# 6 mm routed gap between them (footprint PanelSlot_6x21.5 on Edge.Cuts, y 16.5-38; tabs at the top and bottom).
# hwflow places every footprint on F.Cu; the front board's second assembly side is modelled with *_Back footprints
# (pads on B.Cu, courtyard on B.CrtYd), J4B included (its pad pattern equals the J4A socket pattern, same XY).
# Every part has a fixed placement (taken from the annealing run, then adjusted by hand), so a rebuild is reproducible.
board:
  {width_mm: 130, height_mm: 40, layers: 4, clearance_mm: 0.15, track_mm: 0.25, decap_max_mm: 4.0,
   # R8 (requirements.yaml): reinforced insulation 230 V mains to SELV, IEC 60730-1 / 62368-1, PD2, OVC II
   drc_rules: [
     "(rule \"R8 mains-SELV clearance\" (constraint clearance (min 4.0mm)) (condition \"A.NetName == 'AC_*' && B.NetName != 'AC_*'\"))",
     "(rule \"R8 mains-SELV creepage\" (constraint creepage (min 6.0mm)) (condition \"A.NetName == 'AC_*' && B.NetName != 'AC_*'\"))"]}

nets:
  GND: {class: ground}
  VBAT: {class: power, current_a: 1.2, external_supply: true}      # 2 x AAA pack + (BT1, passive symbol pins); 1.10 A max input limit
  SW: {class: switching, current_a: 1.0, width_mm: 0.4}   # 0.4 mm like VBAT: same router pass, so the two nets negotiate the U2 escape
  +3V3: {class: power, current_a: 0.5}
  # switched by M2 (P-FET, gate IO2): CS1238, NTC dividers, battery-sense gate and both DRV8837 (VM, VCC, nSLEEP)
  AVDD_SW: {class: power, current_a: 0.2, external_supply: true}
  # width_mm 0.3: own router pass (after the 0.8 mm mains and 0.4 mm power passes, before the 0.25 mm signals), so the
  # coil tracks take the direct path to J4A over the SELV strip and never detour through the mains zone (R8)
  COIL1_A: {class: switching, current_a: 0.1}
  COIL1_B: {class: switching, current_a: 0.1}
  COIL2_A: {class: switching, current_a: 0.1}
  COIL2_B: {class: switching, current_a: 0.1}
  RLY1_IN1: {class: signal, width_mm: 0.15}   # escape of the U4 (WSON-8) pad 6 under the ESP32 module: 0.2 mm routes where 0.25 is boxed in
  PROBE1: {class: signal, sensitive: true}
  PROBE2: {class: signal, sensitive: true}
  AIN1P: {class: signal, sensitive: true}
  AIN2P: {class: signal, sensitive: true}
  VBAT_SENSE: {class: signal, sensitive: true}
  XTAL32_P: {class: signal, sensitive: true}
  XTAL32_N: {class: signal, sensitive: true}
  # 230 VAC relay contacts (mains class, R8, review-1 M5). hwflow has no class-pair clearance: a net clearance applies
  # to every other net, mains-to-mains included. AC_* therefore uses 2.5 mm (functional spacing between mains
  # conductors; the project KF301 footprint has 2.3 mm pads so the terminal pad gap is 2.7 mm). The 4.0 mm clearance /
  # 6.0 mm creepage to SELV copper cannot be a net class value without failing the 5 mm pitch terminal and varistor
  # pads (gap 2.7 and 3.7 mm). It is enforced by zoning: mains pads and tracks only inside the mains zone, SELV copper
  # >= 6 mm away by placement, a no-pour keepout over the zone (KO_MAINS), and a custom-rule DRC run (notes/layout.md).
  # AC_NC1/2 = relay NC contacts (pad 12), live in the reset state, not brought out.
  # Relay contact tracks are sized for the 2 A load (5 A relay rating, R15): 0.8 mm at 10 C rise.
  AC_COM1: {class: mains, current_a: 2, clearance_mm: 2.5}
  AC_OUT1: {class: mains, current_a: 2, clearance_mm: 2.5}
  AC_NC1: {class: mains, clearance_mm: 2.5, allow_single: true}
  AC_COM2: {class: mains, current_a: 2, clearance_mm: 2.5}
  AC_OUT2: {class: mains, current_a: 2, clearance_mm: 2.5}
  AC_NC2: {class: mains, clearance_mm: 2.5, allow_single: true}
  BAT_N: {class: power, current_a: 1.2}      # pack negative, before the reverse-polarity NMOS M3

components:
  # ---------------------------------------------------------------- front board (front face): 2 x AAA pack
  BT1:
    value: 2xAAA holder, wire leads
    mpn: Keystone 2469
    price_usd: 1.18          # same as the 2468 (review-2 M2 decision); no LCSC listing; 13.0 mm above board, body 53.0 x 24.6 mm
    datasheet: https://www.keyelco.com/userAssets/file/M65p28.pdf
    symbol: Device:Battery   # two cells in series in one holder; pin 1 = +, pin 2 = -
    # Wire-lead version (review-2 M2: the 2468 PCB drawing is not obtainable). Red lead = + -> pad 1 (square),
    # black lead = - -> pad 2. Fixed to the front face with adhesive; the footprint outline (F.CrtYd 53.0 x 24.6 mm)
    # reserves the holder area on the front side.
    footprint: thermostat:BatteryHolder_Keystone_2469_Wire
    pins: {"1": VBAT, "2": BAT_N}
    spice: false             # pack model is a testbench source (sim.sources)
    group: front_power
    placement: {x: 71.2, y: 29.65, rot: 0, fixed: true}   # front face, bottom; body (y 17.35-41.95) overhangs the bottom edge by 1.95 mm (R1: <= 2 mm)
  # reverse-polarity protection (review-1 M2): low-side NMOS ideal diode, gate on the pack + terminal through
  # R16/C21. Normal pack: body diode conducts first, VGS = Vpack turns the channel on. Reversed pack: VGS < 0 and
  # the body diode is reverse biased, so no current flows (simulated in reverse_dc). Part: AOS AO3416 (Rev 5.1):
  # RDS(on) 21 typ / 34 max mOhm at VGS 1.8 V, 18 / 26 at 2.5 V, VGS(th) 0.4 / 0.7 / 1.1 V, VDS 20 V, VGS +/-8 V,
  # G-S-D pins 1-2-3. Simulated with the max fit (NMOS_LOWVGS_MAX).
  # Gate hold (stage 4, round 4): with the gate tied straight to pack +, VGS = converter VIN, which falls to
  # 0.70 V during a TX burst at the 0 C cutoff and the 1.10 A input limit, below VGS(th) max 1.1 V: the body
  # diode (0.62 V at 1 A) would then carry the pack current and the boost would drop out (notes/circuit.md).
  # R16 100 k + C21 1 uF (tau 0.1 s) hold the gate at the pre-burst pack voltage through the 5 ms burst
  # (droop 5 %). In sleep only the R20/R18 bias current (0.25 uA at 2.5 V) flows. Reversed pack: Q1 below.
  M3:
    placement: {x: 72.9, y: 35.9, rot: 90, fixed: true}   # R8 3D: outside KO_STACK (x 77-120, y 25.8-40), above the J1/J3 screw heads
    value: AO3416
    mpn: AO3416
    lcsc: C43307
    price_usd: 0.109         # LCSC qty 5+ 0.1094, 57,450 in stock
    datasheet: https://aosmd.com/sites/default/files/res/datasheets/AO3416.pdf
    symbol: Device:Q_NMOS_GSD
    footprint: thermostat:SOT-23_Back
    pins: {"1": M3_G, "2": GND, "3": BAT_N}
    spice: {lib: models/nmos_lowvgs.lib, model: NMOS_LOWVGS_MAX, ports: ["3", "1", "2"], source: fit}   # datasheet max corner (34 mOhm at 1.8 V)
    group: front_power
  R16: {placement: {x: 83.15, y: 22.9, rot: 270, fixed: true}, value: 100k, mpn: 0603WAF1003T5E, lcsc: C25803, price_usd: 0.002, symbol: Device:R, footprint: thermostat:R_0603_1608Metric_Back,
        pins: {"1": VBAT, "2": M3_GH}, group: front_power}
  C21: {placement: {x: 79.0, y: 24.3, rot: 0, fixed: true}, value: 1u, mpn: CL10A105KB8NNNC, lcsc: C15849, price_usd: 0.004, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
        voltage_rating_v: 50, pins: {"1": M3_GH, "2": GND}, group: front_power}
  # R19 separates the hold capacitor from the gate (review-2 S1): Q1 then discharges only Ciss (1.3-1.65 nF)
  # instead of C21. 100 k (S1 fix, was 10 k): C21 feeds the clamped gate with <= 28 uA, which the R18 base current
  # from BAT_N (~0.9 uA) keeps Q1 saturated against; with 10 k (280 uA) Q1 went linear and let VBAT settle at
  # -0.40 V (0 C, VGS(th) min). No DC current flows through R19 in normal operation (gate leakage only).
  R19: {placement: {x: 79.0, y: 22.0, rot: 0, fixed: true}, value: 100k, mpn: 0603WAF1003T5E, lcsc: C25803, price_usd: 0.002, symbol: Device:R, footprint: thermostat:R_0603_1608Metric_Back,
        pins: {"1": M3_GH, "2": M3_G}, group: front_power}
  # Gate clamp (review-2 S1): C21 holds M3 on for about a second after the pack is pulled, so a pack put back
  # reversed in that window would find M3 on. Q1: E to VBAT, C to the gate, B (Q1_B) biased by R20 (from the held
  # gate M3_GH) / R18 (to BAT_N, = GND while M3 is on) at 0.327 x V(M3_GH), C23 from Q1_B to GND. A reversed pack
  # with M3 on discharges C4 through the pack; Q1 turns on when VBAT < 0.327 x Vgate - VBE (about +0.3 V) and
  # pulls the gate to VBAT before VIN goes negative (S1 fix, notes/circuit.md). Normal operation: VEB = 0.67 x
  # pack <= 2.4 V (VEBO 6 V min); TX burst at the 0 C cutoff: VBE = 0.327 x 2.4 - 0.72 = +0.06 V, Q1 off.
  # Leakage (ICEX/IBL 50 nA max each) counted in sleep_wc.
  Q1:
    placement: {x: 79.0, y: 18.5, rot: 270, fixed: true}
    value: MMBT3904
    mpn: MMBT3904
    lcsc: C20526           # CJ MMBT3904, LCSC basic part; price/stock not re-read this session (parts search offline)
    price_usd: 0.009
    symbol: Transistor_BJT:MMBT3904
    footprint: thermostat:SOT-23_Back
    pins: {"1": Q1_B, "2": VBAT, "3": M3_G}
    spice: {lib: models/mmbt3904.lib, model: MMBT3904, ports: ["3", "1", "2"], source: vendor}
    group: front_power
  R18: {placement: {x: 82.9, y: 16.8, rot: 0, fixed: true}, value: 3.3M, mpn: 0603WAF3304T5E, price_usd: 0.002, symbol: Device:R, footprint: thermostat:R_0603_1608Metric_Back,
        pins: {"1": Q1_B, "2": BAT_N}, group: front_power}
  # S1 fix (notes/circuit.md "S1 fix: Q1 base bias from the held gate"): R20 from the held gate M3_GH to Q1_B
  # with R18 3.3 M to BAT_N (= GND while M3 is on) biases the base at 0.327 x V(M3_GH). Q1 then pulls the gate
  # down when VBAT falls below about 0.327 x Vgate - VBE (+0.25..+0.35 V), before VIN goes negative, instead of at
  # VBAT = -0.6 V. Sleep cost: 10.1 M + 0.1 M from VBAT to GND, 0.25 uA at 2.5 V (+0.6 uW). Placed next to Q1 / R18
  # (front board B.Cu, front_power).
  R20: {placement: {x: 82.9, y: 19.0, rot: 0, fixed: true}, value: 6.8M, mpn: 0603WAF6804T5E, price_usd: 0.002, symbol: Device:R, footprint: thermostat:R_0603_1608Metric_Back,
        pins: {"1": M3_GH, "2": Q1_B}, group: front_power}
  # C23 base hold capacitor, Q1_B to GND (S1 fix: was across R18 to BAT_N). It holds the bias during the 10-15 us
  # reversal edge and supplies the base charge. Across R18 it latched M3 back on: when M3 started to conduct, the
  # falling BAT_N kicked the base down, Q1 let go and C21 drove the gate up (VIN -1.0 to -1.2 V, 2 A for ms).
  C23: {placement: {x: 75.2, y: 17.0, rot: 0, fixed: true}, value: 10n, mpn: CL10B103KB8NNNC, lcsc: C57112, price_usd: 0.002, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
        voltage_rating_v: 50, pins: {"1": Q1_B, "2": GND}, group: front_power}
  # BAT_N contact ESD (review-2 C2): 100 nF from pack - to GND, across M3 (checked in reverse_tran)
  C22: {placement: {x: 69.9, y: 35.9, rot: 90, fixed: true}, value: 100n, mpn: CC0603KRX7R9BB104, lcsc: C14663, price_usd: 0.003, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
        voltage_rating_v: 50, pins: {"1": BAT_N, "2": GND}, group: front_power}

  # ---------------------------------------------------------------- front board: boost 3.3 V (TPS61099 datasheet fig. 9-1)
  U2:
    placement: {x: 100.15, y: 24.4, rot: 90, fixed: true}
    value: TPS610994
    mpn: TPS610994YFFR
    price_usd: 1.21
    datasheet: https://www.ti.com/lit/gpn/tps61099
    symbol: thermostat:TPS610994YFF
    footprint: thermostat:DSBGA-6_Back
    pins: {"A1": VBAT, "A2": GND, "B1": SW, "B2": +3V3, "C1": VBAT, "C2": GND}   # EN to VIN (always on), FB to GND (fixed 3.3 V)
    # averaged model: input at the VIN pin (A1, the C4 node). The averaged cell includes the inductor (its average
    # current is the input current); an ideal L1 in series with the constant-power input forms an undamped LC with
    # C4 that oscillates on load steps (stage 4 finding, notes/models.md). IQ is inside EFFL (see model).
    spice: {lib: models/tps610994_avg.lib, subckt: TPS610994_AVG, ports: ["A1", "B2", "A2"], source: behavioral,
            params: {VOUT: 3.3, EFFV07: 0.80, EFFV10: 0.83, EFFV15: 0.89, EFFV25: 0.93, EFFL: 0.75, ILIMSS: 0.20, IQVIN: 0, IQVOUT: 0, VUVLO: 0.65}}
    # EFF(VIN) from SLVSD88M Fig 6-5 up to 0.93 at 2.5 V, down mode min(EFF, VOUT/VIN) (notes/models.md);
    # start-up limit 0.20 A below VOUT 2.5 V; average input limit = global .param tps_ilim (0.65 / 0.85 / 1.10 A)
    theta_ja: 134
    group: front_power
  L1:
    placement: {x: 91.9, y: 24.2, rot: 180, fixed: true}   # moved up 1 mm (R8 3D keep-out starts at y 25.8) and 1.85 mm left (M2)
    value: 2.2u
    mpn: LVH252A12-2R2M-N
    lcsc: C285849
    price_usd: 0.058
    symbol: Device:L
    footprint: thermostat:L_1008_2520Metric_Back
    pins: {"1": VBAT, "2": SW}
    group: front_power
  C4: {placement: {x: 100.85, y: 21.69, rot: 180, fixed: true}, value: 10u, mpn: CL10A106KP8NNNC, lcsc: C19702, price_usd: 0.008, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 10, pins: {"1": VBAT, "2": GND}, decouples: U2, group: front_power}
  C5: {placement: {x: 98.7, y: 27.9, rot: 90, fixed: true}, value: 10u, mpn: CL10A106KP8NNNC, lcsc: C19702, price_usd: 0.008, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 10, pins: {"1": +3V3, "2": GND}, decouples: U2, group: front_power}
  C1:
    value: 4.7m
    mpn: EEU-FS1A472
    lcsc: C407972          # LCSC stock 0 (qty-10 0.8492); in stock at DigiKey (EEU-FS1A472B, 1,500, $1.06 qty 10); price below is DigiKey
    price_usd: 1.06
    datasheet: https://www.lcsc.com/datasheet/C407972.pdf   # FS series; PDF not readable here; leakage 0.01CV or 3 uA (2 min, rated V) from distributor pages, see notes/datasheets/eeu-fs1a472.md
    symbol: Device:C_Polarized
    footprint: thermostat:CP_Radial_D12.5mm_P5.00mm_Flat   # 12.5 mm dia x 25 mm long lying flat on the front face, lead pitch 5 mm
    placement: {x: 77, y: 7, rot: 0, fixed: true}
    pins: {"1": +3V3, "2": GND}
    voltage_rating_v: 10
    derate: 0.8            # aluminium electrolytic, 80 % of rated voltage (3.3 / 10 = 33 %)
    tolerance: 0.2         # +/-20 %
    spice: {esr: 0.15}     # tan delta 0.19 at 120 Hz -> 0.054 ohm at 20 C; R3 budget <= 0.10 at 20 C, 0.15 at 0 C: 0.15 used (worst)
    group: front_power

  # ---------------------------------------------------------------- front board: ESP32-C3-MINI-1 (datasheet v2.2 ch. 7)
  U1:
    value: ESP32-C3-MINI-1-N4
    mpn: ESP32-C3-MINI-1-N4
    lcsc: C2838502
    price_usd: 2.70
    datasheet: https://documentation.espressif.com/esp32-c3-mini-1_datasheet_en.pdf
    symbol: thermostat:ESP32-C3-MINI-1
    footprint: thermostat:ESP32-C3-MINI-1
    placement: {x: 123.2, y: 8.3, rot: 0, fixed: true}   # top-right corner of the front board, antenna toward the top edge
    pins:
      "1": GND
      "2": GND
      "3": +3V3
      "5": AVDD_EN_N     # IO2 strap (must read 1): P-FET gate, 100 k pull-up
      "6": VBAT_SENSE    # IO3 ADC1_CH3
      "8": ESP_EN
      "11": GND
      "12": XTAL32_P     # IO0
      "13": XTAL32_N     # IO1
      "14": GND
      "16": RLY2_IN2     # IO10
      "18": ADC_DOUT     # IO4
      "19": RLY1_IN1     # IO5
      "20": RLY1_IN2     # IO6
      "21": RLY2_IN1     # IO7
      "22": LED_K        # IO8 strap: LED cathode, 100 k pull-up
      "23": BTN          # IO9 BOOT strap: button
      "26": USB_DN       # IO18
      "27": USB_DP       # IO19
      "30": ADC_SCLK     # IO20
      "31": UART_TX      # IO21 TXD0, boot log, test pad TP7
      "36": GND
      "37": GND
      "38": GND
      "39": GND
      "40": GND
      "41": GND
      "42": GND
      "43": GND
      "44": GND
      "45": GND
      "46": GND
      "47": GND
      "48": GND
      "49": GND
      "50": GND
      "51": GND
      "52": GND
      "53": GND
    nc: ["4", "7", "9", "10", "15", "17", "24", "25", "28", "29", "32","33", "34", "35"]
    spice: false        # loads are testbench current sources (sim.sources)
    group: front_mcu
  C7: {placement: {x: 117.3, y: 7.3, rot: 270, fixed: true}, value: 10u, mpn: CL10A106KP8NNNC, lcsc: C19702, price_usd: 0.008, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 10, pins: {"1": +3V3, "2": GND}, decouples: U1, group: front_mcu}
  C8: {placement: {x: 120.06, y: 8.6, rot: 180, fixed: true}, value: 100n, mpn: CC0603KRX7R9BB104, lcsc: C14663, price_usd: 0.003, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 50, pins: {"1": +3V3, "2": GND}, decouples: U1, group: front_mcu}
  # EN supervisor (review-1 M3): the boost charges 4.7 mF in tens of ms, so the R5/C6 RC alone released EN at
  # 1.5-2 V. U6 holds EN low until +3V3 > VIT- + 29 mV (2.886 / 2.959 / 3.003 V) and then for td 120 / 200 /
  # 350 ms (SBVS193D); R5/C6 add about 14 ms. Push-pull output drives the top of R5, so no pull-up current
  # flows while it holds reset. IQ 500 nA max is used in the sleep simulation (model default).
  U6:
    placement: {x: 95.15, y: 17.05, rot: 270, fixed: true}
    value: TPS3839K33
    mpn: TPS3839K33DBZR
    lcsc: C96333           # stock 120 at LCSC (qty 10 0.6457); DigiKey 3,227
    price_usd: 0.646
    datasheet: https://www.ti.com/lit/gpn/tps3839   # SBVS193D: VIT- 2.857/2.93/2.974 V, hys 29 mV, IDD 150 typ / 500 nA max, td 120/200/350 ms, push-pull
    symbol: Power_Supervisor:TPS3839DBZ
    footprint: thermostat:SOT-23_Back
    pins: {"1": GND, "2": EN_RST_N, "3": +3V3}
    spice: {lib: models/tps3839_beh.lib, subckt: TPS3839_BEH, ports: ["1", "2", "3"], source: behavioral}   # TI PSpice SBVM235 exists, not usable here
    group: front_mcu
  C20: {placement: {x: 95.65, y: 13.85, rot: 180, fixed: true}, value: 100n, mpn: CC0603KRX7R9BB104, lcsc: C14663, price_usd: 0.003, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
        voltage_rating_v: 50, pins: {"1": +3V3, "2": GND}, decouples: U6, group: front_mcu}
  R5: {placement: {x: 114.45, y: 18.8, rot: 90, fixed: true}, value: 10k, mpn: 0603WAF1002T5E, lcsc: C25804, price_usd: 0.002, symbol: Device:R, footprint: thermostat:R_0603_1608Metric_Back,
       pins: {"1": EN_RST_N, "2": ESP_EN}, group: front_mcu}
  C6: {placement: {x: 116.25, y: 22.4, rot: 90, fixed: true}, value: 1u, mpn: CL10A105KB8NNNC, lcsc: C15849, price_usd: 0.004, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 50, pins: {"1": ESP_EN, "2": GND}, group: front_mcu}
  Y1:
    placement: {x: 119.5, y: 15.3, rot: 0, fixed: true}
    value: 32.768k
    mpn: SC-32S 32.768kHz 12.5pF 20ppm
    lcsc: C97606
    price_usd: 0.20
    symbol: Device:Crystal
    footprint: thermostat:Crystal_SMD_3215_Back
    pins: {"1": XTAL32_P, "2": XTAL32_N}
    spice: false
    group: front_mcu
  C2: {placement: {x: 118.3, y: 21.05, rot: 90, fixed: true}, value: 18p, mpn: CL10C180JB8NNNC, lcsc: C1647, price_usd: 0.012, tolerance: 0.05, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 50, pins: {"1": XTAL32_P, "2": GND}, group: front_mcu}
  C3: {placement: {x: 120.8, y: 18.45, rot: 90, fixed: true}, value: 18p, mpn: CL10C180JB8NNNC, lcsc: C1647, price_usd: 0.012, tolerance: 0.05, symbol: Device:C, footprint: thermostat:C_0603_1608Metric_Back,
       voltage_rating_v: 50, pins: {"1": XTAL32_N, "2": GND}, group: front_mcu}

  # ---------------------------------------------------------------- front board: switched analog supply + CS1238
  M2:
    placement: {x: 96.25, y: 21.4, rot: 270, fixed: true}
    value: AO3401A
    mpn: AO3401A
    lcsc: C15127
    price_usd: 0.072         # LCSC C15127 qty 1-99 0.0716 (was 0.02, corrected in stage 4)
    symbol: Transistor_FET:AO3401A
