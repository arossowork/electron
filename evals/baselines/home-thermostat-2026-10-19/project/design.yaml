        - {name: r7_vcoil2_min, meas: "min v(vc2) from=1.8605 to=1.9005", min: 2.7, unit: V, req: R7}
        - {name: r7_pulse1_ms, meas: "trig v(vc1) val=2.7 td=1.75 rise=1 targ v(vc1) val=2.7 td=1.75 fall=1", scale: 1000, min: 40, unit: ms, req: R7}
        - {name: r7_pulse2_ms, meas: "trig v(vc2) val=2.7 td=1.75 rise=1 targ v(vc2) val=2.7 td=1.75 fall=1", scale: 1000, min: 40, unit: ms, req: R7}
        - {name: r7_vrail_min, meas: "min v(+3V3) from=1.78 to=1.95", min: 3.0, unit: V, req: R7}
        - {name: r9_droop_set_mv, meas: "pp v(+3V3) from=1.79 to=1.91", scale: 1000, max: 100, unit: mV, req: R9}
        - {name: r7_hold_ua, meas: "max v(hold) from=1.70 to=1.78", scale: 1e6, max: 0.1, unit: uA, req: R7}
        - {name: r17_vbat_err_mv, meas: "find v(vbat_err) at=0.28", scale: 1000, min: -60, max: 60, unit: mV, req: R17}
        - {name: r17_tap_minus_vdd, meas: "max v(tapd) from=0.001 to=4.25", max: 0, unit: V, req: R17}
        # AVDD_SW turn-on (IO2 100 ns edge, slow M2 gate) precedes every relay pulse: logic rail droop (S2)
        - {name: r9_avdd_on_droop_mv, meas: "pp v(+3V3) from=0.0049 to=0.0065", scale: 1000, max: 100, unit: mV, req: R9}
    - name: tx_ilim
      # R3: the cutoff Wi-Fi wake (temperature-aware Voc) at each TPS610994 average input limit corner,
      # 0.65 (min, default) / 0.85 (typ) / 1.10 A (max). The 1.10 A pass also sets C1 to its worst effective
      # value, 4.7 mF x 0.8 (tolerance) x 0.95 (0 C) = 3.57 mF (R3 acceptance). Control reruns overwrite
      # the _085 and _110 values (hwflow keeps the last echoed value).
      cmd: tran 50u 1.45 0 0.5m
      temps: [0, 50]
      measures:
        - {name: r3_vin_tx_065, meas: "min v(VBAT) from=1.394 to=1.402", min: 0.7, unit: V, req: R3}
        - {name: r3_vrail_065, meas: "min v(+3V3) from=0.4 to=1.45", min: 3.0, unit: V, req: R3}
        - {name: r3_vin_tx_085, meas: "min v(VBAT) from=1.394 to=1.402", min: 0.7, unit: V, req: R3}
        - {name: r3_vrail_085, meas: "min v(+3V3) from=0.4 to=1.45", min: 3.0, unit: V, req: R3}
        - {name: r3_vin_tx_110, meas: "min v(VBAT) from=1.394 to=1.402", min: 0.7, unit: V, req: R3}
        - {name: r3_vrail_110, meas: "min v(+3V3) from=0.4 to=1.45", min: 3.0, unit: V, req: R3}
      control:
        - "alterparam tps_ilim=0.85"
        - "reset"
        - "tran 50u 1.45 0 0.5m"
        - "meas tran r3_vin_tx_085 min v(VBAT) from=1.394 to=1.402"
        - "meas tran r3_vrail_085 min v(+3V3) from=0.4 to=1.45"
        - "echo HWF r3_vin_tx_085 $&r3_vin_tx_085"
        - "echo HWF r3_vrail_085 $&r3_vrail_085"
        - "alterparam tps_ilim=1.10"
        - "reset"
        - "alter @cc1[capacitance] = 3.57e-3"
        - "tran 50u 1.45 0 0.5m"
        - "meas tran r3_vin_tx_110 min v(VBAT) from=1.394 to=1.402"
        - "meas tran r3_vrail_110 min v(+3V3) from=0.4 to=1.45"
        - "echo HWF r3_vin_tx_110 $&r3_vin_tx_110"
        - "echo HWF r3_vrail_110 $&r3_vrail_110"
    - name: powerup
      # Pack insertion into a dead board (ins_t = 1 ms: the operating point has no pack, every capacitor at
      # 0 V). EN must stay low until +3V3 >= 3.0 V (ESP32-C3 minimum). The list run (pack in from t < 0) only
      # sets up the plot: its "meas" strings are placeholders (find at 0.7 s, so they do not error) and every
      # value is overwritten by the control passes below, which hold the real measurements. If a control
      # measurement fails, its echo is empty and the row fails.
      #   pass 1: U6 typical (VIT- 2.93 V, td 200 ms), temperature-aware cutoff pack
      #   pass 2: U6 min corner (VIT- 2.857 V -> release 2.886 V, td 120 ms), plain 2.20 V pack (slowest rise)
      #   pass 3: U6 max corner (VIT- 2.974 V -> release 3.003 V, td 350 ms), fresh 3.60 V lithium pack
      cmd: tran 50u 0.8 0 0.5m
      temps: [0, 50]
      monte_carlo: true
      measures:
        - {name: pu_v3v3_at_en_typ, meas: "find v(+3V3) at=0.7", min: 3.0, unit: V, req: R3}
        - {name: pu_t_en_typ_ms, meas: "find v(+3V3) at=0.7", scale: 1000, unit: ms}
        - {name: pu_v3v3_at_en_min, meas: "find v(+3V3) at=0.7", min: 3.0, unit: V, req: R3}
        - {name: pu_t_en_min_ms, meas: "find v(+3V3) at=0.7", scale: 1000, min: 120, unit: ms}
        - {name: pu_v3v3_at_en_max, meas: "find v(+3V3) at=0.7", min: 3.0, unit: V, req: R3}
        - {name: pu_t_en_max_ms, meas: "find v(+3V3) at=0.7", scale: 1000, unit: ms}
        - {name: pu_vmax_lithium, meas: "find v(+3V3) at=0.7", max: 3.6, unit: V, req: R3}
      control:
        - "alterparam ins_t=1m"
        - "reset"
        - "tran 50u 0.8 0 0.5m"
        - "meas tran pu_v3v3_at_en_typ find v(+3V3) when v(en_ok)=0.5 rise=1"
        - "meas tran pu_t_en_typ_ms when v(en_ok)=0.5 rise=1"
        - "echo HWF pu_v3v3_at_en_typ $&pu_v3v3_at_en_typ"
        - "echo HWF pu_t_en_typ_ms $&pu_t_en_typ_ms"
        - "alterparam ins_t=1m"
        - "alterparam tps3839_vit=2.857"
        - "alterparam tps3839_td=120m"
        - "reset"
        - "alter @vcoldon[dc] = 0"
        - "tran 50u 0.8 0 0.5m"
        - "meas tran pu_v3v3_at_en_min find v(+3V3) when v(en_ok)=0.5 rise=1"
        - "meas tran pu_t_en_min_ms when v(en_ok)=0.5 rise=1"
        - "echo HWF pu_v3v3_at_en_min $&pu_v3v3_at_en_min"
        - "echo HWF pu_t_en_min_ms $&pu_t_en_min_ms"
        - "alterparam ins_t=1m"
        - "alterparam tps3839_vit=2.974"
        - "alterparam tps3839_td=350m"
        - "reset"
        - "alter @vcoldon[dc] = 0"
        - "alter @vpu[dc] = -1.4"
        - "tran 50u 0.8 0 0.5m"
        - "meas tran pu_v3v3_at_en_max find v(+3V3) when v(en_ok)=0.5 rise=1"
        - "meas tran pu_t_en_max_ms when v(en_ok)=0.5 rise=1"
        - "meas tran pu_vmax_lithium max v(+3V3)"
        - "echo HWF pu_v3v3_at_en_max $&pu_v3v3_at_en_max"
        - "echo HWF pu_t_en_max_ms $&pu_t_en_max_ms"
        - "echo HWF pu_vmax_lithium $&pu_vmax_lithium"
    - name: reverse_ins
      # reversed pack (review-1 M2) inserted into a dead board at 1 ms (revsign = -1: the terminal is driven
      # toward -Voc for the whole run; Voc = 2.20 V + cold offset, and 3.60 V lithium in the control pass).
      # Replaces the DC sweep "reverse_dc": with the global .nodeset (rail powered) the DC solver could land on
      # a false powered solution in 2 of 50 MC runs (-22 uA, rail 3.4 V). The transient starts from the dead
      # board, as a real insertion does. Placeholders in the list run are overwritten by the control pass.
      cmd: tran 50u 0.3 0 0.5m
      measures:
        - {name: rev_i_pack_ua, meas: "avg i(VCELL) from=0.25 to=0.3", scale: 1e6, min: -10, max: 10, unit: uA}
        - {name: rev_vin_min, meas: "min v(VBAT) from=0 to=0.3", min: -0.3, unit: V}
        - {name: rev_rail_max, meas: "max v(+3V3) from=0 to=0.3", max: 0.1, unit: V}
        - {name: rev_i_pack_ua_li, meas: "avg i(VCELL) from=0.25 to=0.3", scale: 1e6, min: -10, max: 10, unit: uA}
        - {name: rev_vin_min_li, meas: "min v(VBAT) from=0 to=0.3", min: -0.3, unit: V}
      control:
        - "alterparam ins_t=1m"
        - "alterparam revsign=-1"
        - "alterparam deadop=1"
        - "reset"
        - "tran 50u 0.3 0 0.5m"
        - "meas tran rev_i_pack_ua avg i(VCELL) from=0.25 to=0.3"
        - "meas tran rev_vin_min min v(VBAT) from=0 to=0.3"
        - "meas tran rev_rail_max max v(+3V3) from=0 to=0.3"
        - "echo HWF rev_i_pack_ua $&rev_i_pack_ua"
        - "echo HWF rev_vin_min $&rev_vin_min"
        - "echo HWF rev_rail_max $&rev_rail_max"
        - "alter @vpu[dc] = -1.4"
        - "tran 50u 0.3 0 0.5m"
        - "meas tran rev_i_pack_ua_li avg i(VCELL) from=0.25 to=0.3"
        - "meas tran rev_vin_min_li min v(VBAT) from=0 to=0.3"
        - "echo HWF rev_i_pack_ua_li $&rev_i_pack_ua_li"
        - "echo HWF rev_vin_min_li $&rev_vin_min_li"
    - name: ntc_tran
      cmd: tran 20u 0.3 0 0.2m
      temps: [0, 50]
      measures:
        # calibrated worst combination (gain +/-0.5 % and drift, Rcal +/-0.1 %); 5 C point after the cal phase
        - {name: r4_ch1_5c, meas: "find v(err1) at=0.075", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r4_ch1_20c, meas: "find v(err1) at=0.155", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r4_ch1_35c, meas: "find v(err1) at=0.215", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r4_ch2_5c, meas: "find v(err2) at=0.075", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r4_ch2_20c, meas: "find v(err2) at=0.155", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r4_ch2_35c, meas: "find v(err2) at=0.215", min: -0.5, max: 0.5, unit: C, req: R4}
        - {name: r5_ch1_35c_cable, meas: "find v(err1) at=0.28", min: -0.5, max: 0.5, unit: C, req: "R4,R5"}
        - {name: r5_cable_err_c, expr: "abs(r5_ch1_35c_cable - r4_ch1_35c)", max: 0.02, unit: C, req: R5}
        # information (no limit): the same chain WITHOUT the bring-up calibration, worst gain sign
        - {name: r4u_ch1_5c, meas: "find v(uerr1) at=0.075", unit: C}
        - {name: r4u_ch1_20c, meas: "find v(uerr1) at=0.155", unit: C}
        - {name: r4u_ch1_35c, meas: "find v(uerr1) at=0.215", unit: C}
        - {name: r4u_ch2_5c, meas: "find v(uerr2) at=0.075", unit: C}
        - {name: r4u_ch2_20c, meas: "find v(uerr2) at=0.155", unit: C}
        - {name: r4u_ch2_35c, meas: "find v(uerr2) at=0.215", unit: C}
        # calibration holds (information): ideal ratio at 10.01 k / 9.99 k, expected 0.1755 / 0.1753
        - {name: r4_cal_hold_a, meas: "find v(h1a) at=0.29", unit: ""}
        - {name: r4_cal_hold_b, meas: "find v(h1b) at=0.29", unit: ""}
    - name: hum_47hz
      cmd: ac lin 1 47.5 47.5
      measures:
        - {name: r5_hum_atten_47_db, expr: "vdb(PROBE1) - vdb(havg)", min: 20, unit: dB, req: R5}
        - {name: r5_hum_atten_47_db_w198, expr: "vdb(PROBE1) - vdb(havga)", min: 20, unit: dB, req: R5}
        - {name: r5_hum_atten_47_db_w202, expr: "vdb(PROBE1) - vdb(havgb)", min: 20, unit: dB, req: R5}
    - name: hum_53hz
      cmd: ac lin 1 52.5 52.5
      measures:
        - {name: r5_hum_atten_53_db, expr: "vdb(PROBE1) - vdb(havg)", min: 20, unit: dB, req: R5}
        - {name: r5_hum_atten_53_db_w198, expr: "vdb(PROBE1) - vdb(havga)", min: 20, unit: dB, req: R5}
        - {name: r5_hum_atten_53_db_w202, expr: "vdb(PROBE1) - vdb(havgb)", min: 20, unit: dB, req: R5}
