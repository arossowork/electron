sim:
  options: [rshunt=1e12]
  # Global testbench (round 4, 2 x AAA), one time schedule shared by every transient (t in s):
  #   0.000-0.300  measurement wake at the cutoff: MCU 22 mA, AVDD_SW on (IO2 low) 5-290 ms, NTC steps, VBAT read
  #   0.400-1.400  Wi-Fi wake at the temperature-aware cutoff (R3): 150 mA, TX 350 mA in the last 5 ms
  #   1.450-1.470  Voc steps to the plain 2.20 V cutoff at every temperature (R7/R16 pack model)
  #   1.480-1.660  low-battery safe state: K1 then K2 reset pulses, 41 ms + 1 ms brake, MCU awake 22 mA (R16, R9)
  #   1.780-1.920  K1 and K2 set pulses at the same 2.20 V cutoff, MCU awake 22 mA (R7, R9)
  #   1.950-2.000  Voc ramps to 3.60 V (fresh L92 lithium pair, down mode); 2.050-3.050 Wi-Fi wake + TX (R3)
  #   3.100-3.150  Voc ramps to 3.20 V (fresh E92 alkaline pair); 3.200-4.200 Wi-Fi wake + TX (R3)
  # DC values are the sleep state (all GPIO idle, no MCU load). powerup starts from 0 V (uic); reverse_dc
  # sweeps a reversed pack; tx_ilim repeats the cutoff Wi-Fi wake at the 0.65 / 0.85 / 1.10 A input limits.
  sources:
    # Pack model (requirements R3/R7/R16): 2 cells in series between BT1.2 (pack -, BAT_N) and BT1.1 (pack +).
    #   VCELL  pack open-circuit voltage schedule (DC value = sweep variable of sleep_dc / reverse_dc)
    #   VPU    offset for the powerup passes (alter)
    #   BCOLD  temperature-aware cutoff while cutsel = 1: Voc = max(2.20, 0.72 + 1.10 x (2 Rcell(T) + 0.07)),
    #          rounded up to 10 mV = 2.56 V at 0 C, 2.20 V at >= 8 C (architecture 3.3 + 20 mV margin, review-2 S3;
    #          firmware picks the row from the ESP32-C3 internal sensor minus 3 C, notes/circuit.md rule 9)
    #   BRCELL pack resistance 2 x Rcell(T) + 0.04 ohm. Rcell = 0.40 x max(1, 2^((25 - T)/25)): 0.40 ohm at
    #          25-50 C, 0.80 ohm at 0 C. The requirement's 0.07 ohm covers contacts, wiring AND the reverse FET;
    #          M3 is simulated (AO3416 max fit, 0.03 ohm at VGS 2 V), so the source carries the other 0.04 ohm.
    - {line: "VCELL cell_oc $(BT1.2) DC 3.6 PWL(0 2.20 1.95 2.20 2.00 3.60 3.10 3.60 3.15 3.20 4.4 3.20)"}
    - {line: "VPU cell_oc cell_x DC 0"}
    - {line: "VCUT cutsel 0 DC 0 PWL(0 1 1.45 1 1.47 0 4.4 0)"}
    - {line: "VCOLDON coldon 0 DC 1"}
    - {line: "BCOLD cell_y cell_x V = V(cutsel)*V(coldon)*max(0, ceil(100*(0.72 + 1.10*(0.8*max(1, pow(2, (25 - temper)/25)) + 0.07)))/100 - 2.20)"}
    #   ins    pack insertion: 1 = pack in. Global .param ins_t (default -1 s: in from before t = 0). powerup sets
    #          ins_t = 1 ms, so the DC operating point is a dead board and the pack is inserted at 1 ms.
    #   remv   review-2 S1: the pack is pulled out at 4.30 s (after the alkaline Wi-Fi wake, Voc 3.20 V) and put
    #          back REVERSED at 4.80 s (sgn = -1: terminal driven toward -Voc). Only reverse_tran runs past 4.25 s.
    - {line: ".param ins_t=-1 revsign=1"}
    - {line: "VREM remv 0 DC 1 PWL(0 1 4.30 1 4.30001 0 4.80 0 4.80001 1)"}
    - {line: "VSGN sgn 0 DC 1 PWL(0 1 4.80 1 4.80001 -1)"}
    - {line: "BINS ins 0 V = V(remv)/(1 + exp(-(time - ins_t)*2e5))"}
    - {line: "BRCELL cell_y $(BT1.1) I = V(ins) * (revsign*V(sgn)*V(cell_y, $(BT1.2)) - V($(BT1.1), $(BT1.2))) / (0.8*max(1, pow(2, (25 - temper)/25)) + 0.04)"}
    # DC initial guess (the boost + body-diode start-up has a slow, non-converged "transient op" branch):
    # regulated rail, pack on, M3 channel on. Only a Newton starting point; ignored by uic runs.
    - {line: ".nodeset v($(+3V3))=3.3 v($(VBAT))=3.6 v($(M3_G))=3.6 v($(M3_GH))=3.6 v($(BAT_N))=0 v(xu2.uv)=1 v(xu2.uvf)=1 v(xu2.n1)=3.3 v(xu2.n2)=3.3 v($(ESP_EN))=3.3 v(xu6.s)=1 v(xu6.sd)=1 v(xu6.sf)=1"}
    # ESP32-C3 EN state: 1 when EN > 0.75 x VDD (GPIO VIH, module datasheet); the module load and IO2 are
    # gated by it (held in reset = no active load). Floor 1.5 V so that EN = VDD = 0 reads as reset.
    - {line: "BENOK en_ok 0 V = 1/(1 + exp(-(V($(ESP_EN)) - max(0.75*V($(+3V3)), 1.5))*50))"}
    # R2 sleep corners (review-2 M1): wc = 0 typical (default), wc = 1 worst case at 50 C (sleep_wc). Every
    # sleep load below has a typical value and a worst-case value; sources in notes/circuit.md "R2 sleep corners".
    - {line: ".param wc=0"}
    # ESP32-C3 module load on the rail: deep sleep 5.0 uA typ (datasheet table, 25 C) + XTAL32K 0.5 uA
    # (architecture 4); worst case at 50 C 8.0 + 0.5 uA (estimate: the datasheet gives no 50 C value;
    # architecture.md section 4 sensitivity row "module 8"). Active profile below.
    - {line: "IESP_SLEEP $(+3V3) 0 DC {5.5u + wc*3u}"}
    - {line: "VIESP iesp_p 0 DC 0 PWL(0 0 0.001 0 0.0011 22m 0.30 22m 0.3001 0 0.40 0 0.4001 150m 1.395 150m 1.3951 350m 1.40 350m 1.4001 0 1.48 0 1.4801 22m 1.66 22m 1.6601 0 1.78 0 1.7801 22m 1.92 22m 1.9201 0 2.05 0 2.0501 150m 3.045 150m 3.0451 350m 3.05 350m 3.0501 0 3.20 0 3.2001 150m 4.195 150m 4.1951 350m 4.20 350m 4.2001 0)"}
    - {line: "BESP $(+3V3) 0 I = V(iesp_p) * V(en_ok)"}
    # C1 leakage, proportional to the rail: typical 1 uA at 3.3 V (purchase spec, 25 C, PM round 4 q2), worst
    # 3 uA (architecture.md buffer spec "<= 3 uA at 50 C"; notes/parts.md pessimistic estimate). NOT a datasheet bound:
    # the FS series only specifies 0.01 CV = 470 uA at 10 V after 2 min. Bench: 3 samples at bring-up.
    # Dead-board operating point (reverse_ins only, .param deadop=1): the last term of BCBUF_LEAK and BIQ2I holds
    # +3V3 and VBAT at 0 V through 100 ohm in the operating point, released linearly by 0.5 ms (the pack goes in at
    # 1 ms). With deadop = 0 (every other analysis) the term is zero. Without it the global .nodeset could land on a
    # false powered solution (rail 3.4 V, BAT_N 27 V) in 2 of 50 MC runs. Kept inside existing sources so that no
    # node or element is added to the other analyses.
    - {line: ".param deadop=0"}
    - {line: "BCBUF_LEAK $(+3V3) 0 I = V($(+3V3))/3.3*(1u + wc*2u) + deadop*V($(+3V3))/100*max(0, 1 - time/0.5m)"}
    # supervisor U6 IQ is inside its model (global tps3839_iq: 150 nA typ default, 500 nA max in sleep_wc)
    # Worst-case-only leakages (wc = 1), each at its actual bias in sleep (review-2 M1):
    #   U2 IQ max - typ (SLVSD88M 6.5: VIN 1.1 - 0.4 uA, VOUT 1.5 - 0.6 uA; the typical IQ is inside EFFL)
    - {line: "BIQ2I $(VBAT) 0 I = wc*0.7u*min(1, max(0, V($(VBAT))/0.7)) + deadop*V($(VBAT))/100*max(0, 1 - time/0.5m)"}
    - {line: "BIQ2O $(+3V3) 0 I = wc*0.9u*min(1, max(0, V($(+3V3))/3))"}
    #   M3 IGSS: AO3416 +/-10 uA max at VGS 8 V, scaled linearly to the actual VGS (= 8/9 VBAT here; linear is
    #   an upper bound for oxide/protection leakage, which falls faster than V). Typical not specified: 0.
    - {line: "BIGSS $(M3_G) 0 I = wc*10u*V($(M3_G))/8"}
    #   Q1 junction leakage: MMBT3904 ICEX 50 nA + IBL 50 nA max (at VCE 30 V), not scaled down
    - {line: "BQ1LK $(VBAT) 0 I = wc*100n*min(1, max(0, V($(VBAT))))"}
    #   off MOSFETs, IDSS max at 55 C scaled linearly from the test VDS: AO3401A 5 uA at 30 V (M2: +3V3 to
    #   AVDD_SW; M4: VBAT to the divider); 2N7002 1 uA at 60 V / 25 C, 500 uA at 125 C -> 4.7 uA at 50 C
    #   (log interpolation) for M1 (VBAT_SW_G to GND through R17). Datasheet values from the AOS/CJ sheets.
    - {line: "BM2LK $(+3V3) $(AVDD_SW) I = wc*5u*V($(+3V3), $(AVDD_SW))/30"}
    - {line: "BM4LK $(VBAT) $(VBAT_TOP) I = wc*5u*V($(VBAT), $(VBAT_TOP))/30"}
    - {line: "BM1LK $(VBAT_SW_G) 0 I = wc*4.7u*V($(VBAT_SW_G))/60"}
    #   IO9 (BOOT) input leakage at 3.3 V, ESP32-C3 IIH 50 nA max (IO3 is below with IIO3_LEAK)
    - {line: "BIO9LK $(BTN) 0 I = wc*50n*min(1, max(0, V($(BTN))/3.3))"}
    # D4 SP0402B-ULC-01 at 3.3 V: 25 nA (review-2 figure) in both corners. D2/D3 sit at 0 V in sleep
    # (AVDD_SW off): no sleep leakage; their 20 nA budget is applied while measuring (ITVS1/ITVS2 below).
    - {line: "BD4LK $(BTN_SW) 0 I = 25n*min(1, max(0, V($(BTN_SW))/3.3))"}
    # ESP32-C3 GPIO outputs (30 ohm pad resistance, estimate). IO2 turn-on edges are 100 ns (review-1 S2).
    - {line: "VIO2 io2 0 DC 3.3 PWL(0 3.3 0.005 3.3 0.0050001 0 0.29 0 0.2901 3.3 1.48 3.3 1.4800001 0 1.66 0 1.6601 3.3 1.78 3.3 1.7800001 0 1.92 0 1.9201 3.3)"}
    # IO2/IO8 drive high to the pad supply (+3V3), not to a fixed 3.3 V: a fixed source back-powered the rail
    # through R9/R14 and gave a false "powered" operating point with no pack.
    - {line: "BIO2 $(AVDD_EN_N) 0 I = -(V(io2)/3.3*V($(+3V3)) - V($(AVDD_EN_N)))/30 * V(en_ok)"}
    - {line: "VIO5 io5 0 DC 0 PWL(0 0 1.541 0 1.54101 3.3 1.542 3.3 1.54201 0 1.80 0 1.80001 3.3 1.842 3.3 1.84201 0)"}
    - {line: "RIO5 io5 $(RLY1_IN1) 30"}
    - {line: "VIO6 io6 0 DC 0 PWL(0 0 1.50 0 1.50001 3.3 1.542 3.3 1.54201 0 1.841 0 1.84101 3.3 1.842 3.3 1.84201 0)"}
    - {line: "RIO6 io6 $(RLY1_IN2) 30"}
    - {line: "VIO7 io7 0 DC 0 PWL(0 0 1.601 0 1.60101 3.3 1.602 3.3 1.60201 0 1.86 0 1.86001 3.3 1.902 3.3 1.90201 0)"}
    - {line: "RIO7 io7 $(RLY2_IN1) 30"}
    - {line: "VIO10 io10 0 DC 0 PWL(0 0 1.56 0 1.56001 3.3 1.602 3.3 1.60201 0 1.901 0 1.90101 3.3 1.902 3.3 1.90201 0)"}
    - {line: "RIO10 io10 $(RLY2_IN2) 30"}
    - {line: "VIO8 io8 0 DC 3.3"}
    - {line: "BIO8 $(LED_K) 0 I = -(V(io8)/3.3*V($(+3V3)) - V($(LED_K)))/30 * V(en_ok)"}
    # GPIO input leakage on IO3 (ESP32-C3 IIL max 50 nA)
    - {line: "IIO3_LEAK $(VBAT_SENSE) 0 50n"}
    # NTC probes 10 k B3950 on 2 m cable (0.4 ohm loop, 200 pF). Worst sensor corners: R25 +1 % on both,
    # B +1 % on probe 1 (worst cold), B -1 % on probe 2 (worst warm). tp1/tp2 = probe temperature in C.
    - {line: "VTP1 tp1 0 DC 35 PWL(0 5 0.08 5 0.081 20 0.16 20 0.161 35 0.3 35)"}
    - {line: "VTP2 tp2 0 DC 35 PWL(0 5 0.08 5 0.081 20 0.16 20 0.161 35 0.3 35)"}
    - {line: "VCAB cab 0 DC 0 PWL(0 0 0.22 0 0.221 0.4 0.3 0.4)"}
    # Bring-up gain calibration (lead decision, notes/datasheets/cs1238.md): a 10.00 k 0.1 % resistor at J2/J6 in
    # place of each probe. calm = 1 for 0-45 ms (cal resistor fitted, AVDD_SW on at 5 ms), calsg = +1 for 0-25 ms
    # (Rcal = 10.01 k), -1 for 25-45 ms (9.99 k). The probes are back from 45 ms (5 C point read at 75 ms).
    - {line: "VCALM calm 0 DC 0 PWL(0 1 0.045 1 0.04501 0)"}
    - {line: "VCALS calsg 0 DC 1 PWL(0 1 0.025 1 0.02501 -1)"}
    - {line: "BNTC1 $(J2.1) 0 I = V($(J2.1)) / ((1 - V(calm))*(10.1e3*exp(3989.5*(1/(V(tp1)+273.15) - 1/298.15)) + 0.4 + V(cab)) + V(calm)*10e3*(1 + 1e-3*V(calsg)))"}
    - {line: "BNTC2 $(J6.1) 0 I = V($(J6.1)) / ((1 - V(calm))*(10.1e3*exp(3910.5*(1/(V(tp2)+273.15) - 1/298.15)) + 0.4) + V(calm)*10e3*(1 + 1e-3*V(calsg)))"}
    - {line: "CCAB1 $(J2.1) 0 200p"}
    - {line: "CCAB2 $(J6.1) 0 200p"}
    # TVS leakage budget (architecture 5.2: <= 20 nA)
    - {line: "ITVS1 $(PROBE1) 0 20n"}
    - {line: "ITVS2 $(PROBE2) 0 20n"}
    # Firmware conversion with nominal values (47 k, R25 10 k, B 3950): ntct(ratio) = temperature in C.
    # ra = AIN / REFIN (REFIN = AVDD_SW) with the CS1238 offset residual +0.2 mV after the CH_SEL 11 reading.
    - {line: ".func ntct(x) {1/(1/298.15 + ln(47e3*max(1e-3, min(0.999, x))/(1 - max(1e-3, min(0.999, x)))/10e3)/3950) - 273.15}"}
    - {line: "BRA1 ra1 0 V = (V($(AIN1P))+0.2e-3)/max(V($(AVDD_SW)), 0.1)"}
    - {line: "BRA2 ra2 0 V = (V($(AIN2P))+0.2e-3)/max(V($(AVDD_SW)), 0.1)"}
    # CS1238 gain error (datasheet 1.6 table 3): +/-0.5 % (typ, PGA 128; no PGA 1 figure, used here), drift 8 ppm/C.
    # Sign p: gain +0.5 % and drift +8 ppm/C x |T - 25|; sign n: both negative. The calibration is done at 25 C
    # (bring-up), so the drift term is applied to the reading only, not to the stored calibration.
    - {line: ".param cs_gerr=0.005 cs_gdrift=8e-6"}
    # Calibration track-and-hold of the ideal ratio with the cal resistor: window a 23.5-24.5 ms (Rcal +0.1 %),
    # window b 43.5-44.5 ms (Rcal -0.1 %); tau 0.1 ms, hold leakage only rshunt.
    - {line: "VTRKA trka 0 DC 0 PWL(0 0 0.0235 0 0.02351 1 0.0245 1 0.02451 0)"}
    - {line: "VTRKB trkb 0 DC 0 PWL(0 0 0.0435 0 0.04351 1 0.0445 1 0.04451 0)"}
    - {line: "BH1A 0 h1a I = 1e4*V(trka)*(V(ra1) - V(h1a))"}
    - {line: "CH1A h1a 0 1"}
    - {line: "BH1B 0 h1b I = 1e4*V(trkb)*(V(ra1) - V(h1b))"}
    - {line: "CH1B h1b 0 1"}
    - {line: "BH2A 0 h2a I = 1e4*V(trka)*(V(ra2) - V(h2a))"}
    - {line: "CH2A h2a 0 1"}
    - {line: "BH2B 0 h2b I = 1e4*V(trkb)*(V(ra2) - V(h2b))"}
    - {line: "CH2B h2b 0 1"}
    # Calibrated reading (firmware): ratio_cal = g_meas x ra x (10/57) / (g_cal x hold), 10/57 = true ratio of 10.00 k
    # under the nominal 47 k. Four combinations per channel (gain p/n x Rcal +/-0.1 %); err = computed - true, C.
    - {line: "BE1PA e1pa 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra1)*(10/57)/((1+cs_gerr)*max(V(h1a), 1e-3))) - V(tp1)"}
    - {line: "BE1PB e1pb 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra1)*(10/57)/((1+cs_gerr)*max(V(h1b), 1e-3))) - V(tp1)"}
    - {line: "BE1NA e1na 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra1)*(10/57)/((1-cs_gerr)*max(V(h1a), 1e-3))) - V(tp1)"}
    - {line: "BE1NB e1nb 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra1)*(10/57)/((1-cs_gerr)*max(V(h1b), 1e-3))) - V(tp1)"}
    - {line: "BE2PA e2pa 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra2)*(10/57)/((1+cs_gerr)*max(V(h2a), 1e-3))) - V(tp2)"}
    - {line: "BE2PB e2pb 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra2)*(10/57)/((1+cs_gerr)*max(V(h2b), 1e-3))) - V(tp2)"}
    - {line: "BE2NA e2na 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra2)*(10/57)/((1-cs_gerr)*max(V(h2a), 1e-3))) - V(tp2)"}
    - {line: "BE2NB e2nb 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra2)*(10/57)/((1-cs_gerr)*max(V(h2b), 1e-3))) - V(tp2)"}
    # err1/err2: the calibrated combination with the largest |error| (signed)
    - {line: "BW1HI w1hi 0 V = max(max(V(e1pa), V(e1pb)), max(V(e1na), V(e1nb)))"}
    - {line: "BW1LO w1lo 0 V = min(min(V(e1pa), V(e1pb)), min(V(e1na), V(e1nb)))"}
    - {line: "BERR1 err1 0 V = abs(V(w1hi)) > abs(V(w1lo)) ? V(w1hi) : V(w1lo)"}
    - {line: "BW2HI w2hi 0 V = max(max(V(e2pa), V(e2pb)), max(V(e2na), V(e2nb)))"}
    - {line: "BW2LO w2lo 0 V = min(min(V(e2pa), V(e2pb)), min(V(e2na), V(e2nb)))"}
    - {line: "BERR2 err2 0 V = abs(V(w2hi)) > abs(V(w2lo)) ? V(w2hi) : V(w2lo)"}
    # Uncalibrated reading (information: shows why the calibration is needed), worst gain sign, signed
    - {line: "BU1P u1p 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra1)) - V(tp1)"}
    - {line: "BU1N u1n 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra1)) - V(tp1)"}
    - {line: "BUERR1 uerr1 0 V = abs(V(u1p)) > abs(V(u1n)) ? V(u1p) : V(u1n)"}
    - {line: "BU2P u2p 0 V = ntct((1+cs_gerr)*(1+cs_gdrift*abs(temper-25))*V(ra2)) - V(tp2)"}
    - {line: "BU2N u2n 0 V = ntct((1-cs_gerr)*(1-cs_gdrift*abs(temper-25))*V(ra2)) - V(tp2)"}
    - {line: "BUERR2 uerr2 0 V = abs(V(u2p)) > abs(V(u2n)) ? V(u2p) : V(u2n)"}
    # Pack reading (R17): firmware VBAT = 3 x ADC (200 k / 100 k nominal), ADC error +10 mV (ESP32-C3 ATTEN2
    # calibrated, worst case), compared with the pack terminal voltage BT1.1 - BT1.2.
    - {line: "BVBERR vbat_err 0 V = 3*(V($(VBAT_SENSE)) + 0.010) - V($(BT1.1), $(BT1.2))"}
    # Sense-circuit current drawn from the pack (R17 leakage): R17 gate pull-up + divider top (uA)
    - {line: "BVBLEAK vbleak 0 V = ((V($(VBAT)) - V($(VBAT_SW_G)))/1e6 + (V($(VBAT_TOP)) - V($(VBAT_SENSE)))/200e3)*1e6"}
    # ADC pin minus VDD (R17: never above VDD)
    - {line: "BTAPD tapd 0 V = V($(VBAT_SENSE)) - V($(+3V3))"}
    # coil voltages and hold current, both relays
    - {line: "BVC1 vc1 0 V = V($(COIL1_A)) - V($(COIL1_B))"}
    - {line: "BVC2 vc2 0 V = V($(COIL2_A)) - V($(COIL2_B))"}
    - {line: "BVC1R vc1r 0 V = V($(COIL1_B)) - V($(COIL1_A))"}
    - {line: "BVC2R vc2r 0 V = V($(COIL2_B)) - V($(COIL2_A))"}
    - {line: "BHOLD hold 0 V = (abs(V($(COIL1_A),$(COIL1_B))) + abs(V($(COIL2_A),$(COIL2_B))))/33.9"}
    # 50 Hz hum: 230 V through 2 pF onto probe 1 (architecture 5.2); the ADC result is averaged over 20 ms
    # (25 samples at 1280 SPS): integrator + 20 ms delay line = boxcar average (behavioral)
    - {line: "VHUM hum 0 DC 0 AC 325"}
    - {line: "CHUM hum $(J2.1) 2p"}
    - {line: "GINT 0 hint $(AIN1P) 0 1"}
    - {line: "CINT hint 0 1"}
    - {line: "RINT hint 0 1e3"}
    - {line: "EBUF hb 0 hint 0 1"}
    - {line: "RTS hb ht 1k"}
    - {line: "TDLY ht 0 hd 0 Z0=1k TD=20m"}
    - {line: "RTL hd 0 1k"}
    - {line: "BAVG havg 0 V = (V(hint) - 2*V(hd))/20e-3"}
    # review-1 S5: the firmware times the averaging window with the ESP32 40 MHz timer and weights the last
    # sample by its fractional share (notes/circuit.md rule 6); window error bound +/-1 %: 19.8 and 20.2 ms
    - {line: "RTSA hb hta 1k"}
    - {line: "TDLYA hta 0 hda 0 Z0=1k TD=19.8m"}
    - {line: "RTLA hda 0 1k"}
    - {line: "BAVGA havga 0 V = (V(hint) - 2*V(hda))/19.8e-3"}
    - {line: "RTSB hb htb 1k"}
    - {line: "TDLYB htb 0 hdb 0 Z0=1k TD=20.2m"}
    - {line: "RTLB hdb 0 1k"}
    - {line: "BAVGB havgb 0 V = (V(hint) - 2*V(hdb))/20.2e-3"}
  analyses:
    - name: sleep_dc
      # DC sweep of the pack Voc 2.20-3.60 V (cutoff to fresh lithium), sleep state
      cmd: dc VCELL 3.65 2.15 -0.05
      temps: [0, 50]
      measures:
        - {name: v3v3_sleep_2v2, meas: "find v(+3V3) at=2.2", min: 3.0, max: 3.6, unit: V, req: "R3,R13"}
        - {name: v3v3_sleep_3v6, meas: "find v(+3V3) at=3.6", min: 3.0, max: 3.6, unit: V, req: "R3,R13"}
        # R2 TYPICAL corner (wc = 0): pack sleep power at the 2.5 V average pack voltage. Allowance = 208 uW
        # limit - 166.3 uW active (architecture 4: 24 Wi-Fi + 144 measurement wakes + 40 relay pulses + LED at
        # 0.92) = 41.7 uW. Typical loads: module 5.5 uA, C1 1 uA, U6 150 nA, D4 25 nA, U2 PFM rail 3.4 V.
        # The worst-case corner is sleep_wc.
        - {name: r2_pack_sleep_uw, meas: "find i(VCELL) at=2.5", scale: -2.5e6, max: 41.7, unit: uW, req: R2}
        # rail sleep floor (information; architecture design value 6.7 uA)
        - {name: r2_rail_sleep_ua, meas: "find i(v.xu2.vx) at=2.5", scale: -1e6, unit: uA}
        - {name: vbat_div_leak_ua, meas: "find v(vbleak) at=3.6", max: 0.5, unit: uA, req: R17}
        - {name: r17_tap_minus_vdd_sleep, meas: "max v(tapd)", max: 0, unit: V, req: R17}
    - name: sleep_wc
      # R2 WORST-CASE corner (review-2 M1) and the S2 PFM rail maximum. The list run (wc = 0) only produces
      # placeholders; the control pass sets every sleep load to its worst value (wc = 1, see sources), U6 IQ
      # 500 nA max, and U2 VOUT at its 3.37 V maximum (PFM 3.47 V), then overwrites every row.
      # R2 worst case is defined at 50 C; the 0 C run uses the same 50 C leakages (pessimistic).
      cmd: dc VCELL 3.65 2.15 -0.05
      temps: [0, 50]
      measures:
        # limit from R2 worst-case acceptance (PM round 5, q1): 246 uW total - 166.3 uW active = 79.9 uW
        - {name: r2_pack_sleep_uw_wc, meas: "find i(VCELL) at=2.5", scale: -2.5e6, max: 79.9, unit: uW, req: R2}
        - {name: r2_rail_sleep_ua_wc, meas: "find i(v.xu2.vx) at=2.5", scale: -1e6, unit: uA}
        - {name: r2_rail_v_wc, meas: "find v(+3V3) at=2.5", unit: V}
        # S2: rail maximum in sleep (PFM) with a fresh lithium pack, 3.6 V; ESP32-C3 absolute maximum 3.6 V
        - {name: s2_rail_max_li_wc, meas: "find v(+3V3) at=3.6", max: 3.6, unit: V, req: "R3,R13"}
      control:
        - "alterparam wc=1"
        - "alterparam tps3839_iq=500n"
        - "alterparam tps_vscale=1.0212"
        - "reset"
        - "dc VCELL 3.65 2.15 -0.05"
        - "meas dc r2_pack_sleep_uw_wc find i(VCELL) at=2.5"
        - "meas dc r2_rail_sleep_ua_wc find i(v.xu2.vx) at=2.5"
        - "meas dc r2_rail_v_wc find v(+3V3) at=2.5"
        - "meas dc s2_rail_max_li_wc find v(+3V3) at=3.6"
        - "echo HWF r2_pack_sleep_uw_wc $&r2_pack_sleep_uw_wc"
        - "echo HWF r2_rail_sleep_ua_wc $&r2_rail_sleep_ua_wc"
        - "echo HWF r2_rail_v_wc $&r2_rail_v_wc"
        - "echo HWF s2_rail_max_li_wc $&s2_rail_max_li_wc"
    - name: reverse_tran
      # review-2 S1, rebuilt (notes/circuit.md "reverse_tran testbench"): pack Voc 3.20 V in sleep (DC operating
      # point), pulled out at 50 ms, out for 0.5 s, put back reversed (-3.20 V, 10 us edge) at 0.55 s, run to 1.05 s.
      # Pulling the pack in sleep leaves C4/C21 charged (VBAT 2.72 V, M3 gate 2.82 V at reversal): the worst case
      # for M3 conduction. The old schedule (pull 0.1 s after a Wi-Fi wake, 4.3-5.3 s) left the gate at 0.50-0.61 V
      # through a UVLO hiccup whose phase depends on the time step (VIN min -0.46 to +0.22 V at VGS(th) min).
      # The schedule is set by "alter @src[pwl]" in this analysis only; the global sources are unchanged.
      # Numerics: Gear integration (trapezoidal rings point to point on the Q1/M3 switching and latched a false
      # 2.3 A reverse state); 0.5 ms max step with a VSGN breakpoint grid of 0.5 us for 100 us, 2 us to 200 us,
      # 20 us to 2 ms and 200 us to 20 ms after the reversal. Checked against 5 us max step (within 30 mV).
      # The list run (10 ms) only gives placeholders; every row is overwritten by the control echoes.
      # Limits: VIN and SW >= -0.3 V (TPS610994 absolute maximum); settled reverse pack current within +/-10 uA.
      # S1 fix (R20, C23 to GND, R18 3.3 M, R19 100 k): VIN min +0.23 V (0 C) / +0.28 V (50 C) at VGS(th) min.
      cmd: tran 1m 0.01
      temps: [0, 50]
      measures:
        - {name: s1_vbat_at_rev, meas: "find v(VBAT) at=0.005", unit: V}
        - {name: s1_gate_at_rev, meas: "find v(VBAT) at=0.005", unit: V}
        - {name: s1_vin_min, meas: "find v(VBAT) at=0.005", min: -0.3, unit: V}
        - {name: s1_sw_min, meas: "find v(VBAT) at=0.005", min: -0.3, unit: V}
        - {name: s1_irev_peak_a, meas: "find v(VBAT) at=0.005", unit: A}
        - {name: s1_irev_settled_ua, meas: "find v(VBAT) at=0.005", scale: 1e6, min: -10, max: 10, unit: uA}
        - {name: s1_gate_settled, meas: "find v(VBAT) at=0.005", unit: V}
        - {name: s1_vin_min_vthmin, meas: "find v(VBAT) at=0.005", min: -0.3, unit: V}
        - {name: s1_sw_min_vthmin, meas: "find v(VBAT) at=0.005", min: -0.3, unit: V}
        - {name: s1_irev_peak_a_vthmin, meas: "find v(VBAT) at=0.005", unit: A}
        - {name: s1_irev_settled_ua_vthmin, meas: "find v(VBAT) at=0.005", scale: 1e6, min: -10, max: 10, unit: uA}
        - {name: s1_t_hi_us_vthmin, meas: "find v(VBAT) at=0.005", scale: 1e6, unit: us}
        - {name: s1_q_uc_vthmin, meas: "find v(VBAT) at=0.005", scale: 1e6, unit: uC}
        - {name: s1_vin_min_vthtyp, meas: "find v(VBAT) at=0.005", min: -0.3, unit: V}
      control:
        - "option method=gear"
        - "alter @vcell[dc] = 3.2"
        - "alter @vcell[pwl] = [ 0 3.2 2 3.2 ]"
        - "alter @vcut[pwl] = [ 0 0 2 0 ]"
        - "alter @viesp[pwl] = [ 0 0 2 0 ]"
        - "alter @vio2[pwl] = [ 0 3.3 2 3.3 ]"
        - "alter @vtp1[pwl] = [ 0 35 2 35 ]"
        - "alter @vtp2[pwl] = [ 0 35 2 35 ]"
        - "alter @vcalm[pwl] = [ 0 0 2 0 ]"
        - "alter @vrem[pwl] = [ 0 1 0.05 1 0.05001 0 0.55 0 0.55001 1 ]"
