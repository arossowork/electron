  # ---------------------------------------------------------------- front board: battery sense (gated by AVDD_SW)
  # 2 x AAA: 200 k top / 100 k bottom, both Yageo RT0603BR thin film 0.1 % 25 ppm (same family so the ratio tracks);
  # tap = VBAT / 3 = 0.73-1.2 V (ADC ATTEN2). High-side switch (stage 4): M4 P-FET from VBAT, gate pulled up to
  # VBAT by R17 1 M and pulled down by M1 when AVDD_SW is on. With M4 off, R4 holds the tap at GND, so IO3 never
  # sees more than VDD even with a 3.6 V pack (the low-side switch left the tap at VBAT = 3.6 V > 3.3 V, R17).
