[project]
name = "hwflow"
version = "0.1.0"
description = "Autonomous electronics design pipeline driven by Claude Code: requirements, parts, schematic, SPICE, PCB, routing, post-layout analysis."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.scripts]
hwflow = "hwflow.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: end-to-end builds (KiCad + Freerouting)"]
