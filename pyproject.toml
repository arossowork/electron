[project]
name = "hwflow"
version = "0.1.0"
description = "Autonomous electronics design pipeline driven by Claude Code: requirements, parts, schematic, SPICE, PCB, routing, post-layout analysis."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
    "pillow>=13.0.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
hwflow = "hwflow.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
# The hosted platform (epic #21) is a separate member; `uv run hwflow` and `uv run pytest` stay engine-only.
members = ["services/platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end builds and router or DRC runs over 15 s (`pytest -m \"not slow\"` skips them)"]
