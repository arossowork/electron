name: tps612994_ybh_boost
description: TPS612994 DSBGA-6 (0.4 mm pitch) boost, 4.0 V (VSEL resistor to GND), 1 uH inductor, input and output 0805 caps; balls escape sideways (left column BAT_P/SW/BAT_P, right column GND/VOUT/VSEL).
source: >-
  Hand layout from TI TPS61299x SLVSGS9G (https://www.ti.com/lit/ds/symlink/tps61299.pdf) layout guidelines (short wide
  SW and power path, input and output caps next to the device, GND plane through vias). Ball positions from
  Package_BGA:Texas_DSBGA-6_0.855x1.255mm_Layout2x3_P0.4mm_LevelB (0.23 mm balls, 0.17 mm gaps). Parts and nets of
  dog-gps-tracker (U2, L1, C2 on BAT_P, C3 on VDD_4V0, R1 on VSEL_BST).
layers_min: 4
rules: {clearance_mm: 0.127, via_dia_mm: 0.5, via_drill_mm: 0.3}
ports: [BAT_P, VDD_4V0, GND]
roles:
  U: {ref: U2, symbol: dog_misc:TPS612994_YBH, footprint: "Package_BGA:Texas_DSBGA-6_0.855x1.255mm_Layout2x3_P0.4mm_LevelB", value: TPS612994,
      pins: {A1: BAT_P, B1: SW_BST, C1: BAT_P, C2: VSEL_BST, B2: VDD_4V0, A2: GND}}
  L: {ref: L1, symbol: Device:L, footprint: Inductor_SMD:L_Murata_DFE201610P, value: 1u, pins: {'1': BAT_P, '2': SW_BST}}
  CIN: {ref: C2, symbol: Device:C, footprint: Capacitor_SMD:C_0805_2012Metric, pins: {'1': BAT_P, '2': GND}}
  COUT: {ref: C3, symbol: Device:C, footprint: Capacitor_SMD:C_0805_2012Metric, pins: {'1': VDD_4V0, '2': GND}}
  RVSEL: {ref: R1, symbol: Device:R, footprint: Resistor_SMD:R_0402_1005Metric, pins: {'1': VSEL_BST, '2': GND}}
placement:
  U: {x: 0, y: 0, rot: 0, side: front}
  L: {x: -2.73, y: 0, rot: 0, side: front}
  CIN: {x: -1.5, y: -2.66, rot: 0, side: front}
  COUT: {x: 2.46, y: 0, rot: 90, side: front}
  RVSEL: {x: 0.71, y: 2.2, rot: 0, side: front}
copper:
  tracks:
  # SW: 0.15 neck from B1, 0.4 into L pad 2
  - {net: SW_BST, layer: F.Cu, w: 0.15, pts: [[-0.2, 0], [-1.0, 0]]}
  - {net: SW_BST, layer: F.Cu, w: 0.4, pts: [[-1.0, 0], [-1.9, 0]]}
  # BAT_P: A1 up and over L pad 2 to L pad 1 and CIN pad 1; C1 down and under to L pad 1
  - {net: BAT_P, layer: F.Cu, w: 0.15, pts: [[-0.2, -0.4], [-0.5, -0.4]]}
  - {net: BAT_P, layer: F.Cu, w: 0.15, pts: [[-0.5, -0.4], [-0.5, -1.1]]}
  - {net: BAT_P, layer: F.Cu, w: 0.3, pts: [[-0.5, -1.1], [-3.45, -1.1], [-3.45, -0.8]]}
  - {net: BAT_P, layer: F.Cu, w: 0.3, pts: [[-2.45, -1.1], [-2.45, -2.2]]}
  - {net: BAT_P, layer: F.Cu, w: 0.3, pts: [[-3.45, -1.1], [-3.9, -1.1]]}
  - {net: BAT_P, layer: F.Cu, w: 0.15, pts: [[-0.2, 0.4], [-0.5, 0.4]]}
  - {net: BAT_P, layer: F.Cu, w: 0.15, pts: [[-0.5, 0.4], [-0.5, 1.1]]}
  - {net: BAT_P, layer: F.Cu, w: 0.3, pts: [[-0.5, 1.1], [-3.45, 1.1], [-3.45, 0.8]]}
  # VDD_4V0: B2 neck, then to COUT pad 1 (below the axis), port stub right
  - {net: VDD_4V0, layer: F.Cu, w: 0.15, pts: [[0.2, 0], [0.6, 0]]}
  - {net: VDD_4V0, layer: F.Cu, w: 0.15, pts: [[0.6, 0], [0.6, 0.95]]}
  - {net: VDD_4V0, layer: F.Cu, w: 0.3, pts: [[0.6, 0.95], [2.0, 0.95]]}
  - {net: VDD_4V0, layer: F.Cu, w: 0.3, pts: [[2.46, 0.95], [3.9, 0.95]]}
  # GND: A2 right then up to CIN pad 2; branch to COUT pad 2; three vias
  - {net: GND, layer: F.Cu, w: 0.15, pts: [[0.2, -0.4], [0.5, -0.4]]}
  - {net: GND, layer: F.Cu, w: 0.15, pts: [[0.5, -0.4], [0.5, -1.0]]}
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[0.5, -1.0], [0.5, -2.66], [-0.4, -2.66]]}
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[0.5, -1.0], [2.0, -1.0]]}
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[0.5, -1.9], [1.0, -1.9]]}
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[3.0, -1.0], [3.7, -1.0]]}
  # VSEL: C2 straight down to RVSEL pad 1; RVSEL pad 2 down to a GND via
  - {net: VSEL_BST, layer: F.Cu, w: 0.15, pts: [[0.2, 0.4], [0.2, 2.2]]}
  - {net: GND, layer: F.Cu, w: 0.2, pts: [[1.22, 2.2], [1.22, 3.0]]}
  vias:
  - {net: GND, x: 1.0, y: -1.9}
  - {net: GND, x: 3.7, y: -1.0}
  - {net: GND, x: 1.22, y: 3.0}
courtyard: [-4.0, -3.5, 4.2, 3.4]
notes: >-
  Courtyards touch with 0.05 mm gaps (U 1.43 x 1.63 half size). Left ball column (BAT_P, SW_BST, BAT_P) escapes
  leftwards to the inductor, right column (GND, VDD_4V0, VSEL_BST) rightwards or down; 0.15 mm necks at the balls.
