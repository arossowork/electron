budgets:
  - {name: c22_sim_decap, kind: copper_len, path: ["C22.1 -> U7.8"], max_mm: 5, source: "5 mm: the MFF2 courtyard and die-pad keep-out leave 3.3 mm straight at best (floorplan); eSIM VCC (SIM_1V8) 100 nF at the MFF2 VCC pin (board.decap_max_mm); stage 7 layout had 47.9 mm (lead)"}
  - {name: c24_gnss_decap, kind: copper_len, path: ["C24.1 -> U8.8, U8.6"], max_mm: 4, source: "LC76G VCC decoupling at the pins (LC76G HW design); stage 7 layout had 11.6 mm (lead)"}
  - {name: u1_vdd_bulk, kind: copper_len, path: ["C13.1 -> U1.14"], max_mm: 7, source: "stage 7: 4 mm met only on boards that leave nets open, best routed 6.2 mm; bulk cap, 7 mm accepted (lead). nRF9151 VDD 4.7 uF at the pin (Nordic reference; board.decap_max_mm 4); stage 7 layout had 18.7 mm (lead)"}
  - {name: u1_vdd_hf, kind: copper_len, path: ["C14.1 -> U1.14"], max_mm: 5, source: "stage 7: 3 mm met only on boards that leave nets open, best routed 4.9 mm; 5 mm accepted (lead). nRF9151 VDD 100 nF closest to the pin; stage 7 layout had 6.1 mm (lead)"}
  - {name: u1_dec0, kind: copper_len, path: ["C15.1 -> U1.24"], max_mm: 3, source: "nRF9151 DEC0 4.7 uF only, at the pin (DevZone 128776) (lead)"}
  - {name: u1_vddgpio, kind: copper_len, path: ["C16.1 -> U1.65"], max_mm: 3, source: "nRF9151 VDD_GPIO 100 nF at the pin; stage 7 layout had 14.5 mm (lead)"}
  - {name: gnss_ant_feed, kind: copper_len, path: ["AE2.1 -> FL1.1"], max_mm: 20, source: "20 mm (lead, stage 7, 75 mm board: best clean board routes 19.3 mm; 20 mm of 50 ohm microstrip ~0.09 dB at 1.575 GHz). Earlier: patch feed (x 9) to the SAW at the LC76G RF_IN (U8 fixed at x 25.5, pad 11 at x 20.7): ~10.5 mm straight + via + stub; 16 mm of 50 ohm microstrip is < 0.07 dB at 1.575 GHz (lead, stage 5: was 12 mm, unplaceable with U8 next to the patch zone)"}
  - {name: gnss_saw_to_rx, kind: copper_len, path: ["FL1.4 -> U8.11"], max_mm: 4, source: "stage-5 review: SAW output next to LC76G RF_IN; 4 mm = LC76G pad 11 to its courtyard edge (0.9 mm) + 0402-class SAW courtyard + 1.25 routing allowance; 4 mm of 50 ohm line at 1.575 GHz is 0.02 lambda (lead, stage 5)"}
  - {name: lte_pin_to_pi, kind: copper_len, path: ["U1.35 -> R12.1"], max_mm: 4, source: "stage-5 review: pi pad set at the SiP ANT pin; nRF9151 pad 35 sits 1.4 mm inside its 1 mm courtyard, R12 0402 courtyard 0.5 mm: 2 mm was unplaceable; 4 mm of 50 ohm line at 1.9 GHz is 0.04 lambda (lead, stage 5)"}
  - {name: lte_match_chain, kind: copper_len, path: ["R12.2 -> L2.1", "L2.2 -> C19.1", "C19.2 -> C21.1", "C21.2 -> L5.1"], max_mm: 16, source: "Ignion AN 3.3 p.8: match next to the feed in the ground area; 0402 parts in line, 4 mm per leg (0402 courtyard 1.9 mm + routing allowance; lead, stage 5: 3 mm per leg was not placeable)"}
  - {name: lte_match_to_feed, kind: copper_len, path: ["L5.2 -> AE1.1"], max_mm: 14, source: "Z1 at the ground edge (x <= 55.5) to the NN02-220 feed tab inside the 14.5 mm clearance: ~10 mm straight + 4 mm"}
  - name: vdd_burst_copper
    req: PWR-7
    kind: copper_r
    path: ["C4.2, C5.2 -> R2.2", "R2.1 -> U1.14"]
    current_a: 0.5
    max_mohm: 800
    source: "PWR-7 3.2 V floor; pre-layout worst pwr7_vdd_min_i80 = 3.614 V at 0.5 A; margin 0.414 V, 0.400 V given to this path (0.014 V to bat_path_copper): 0.400 V / 0.5 A = 800 mOhm"
  - name: bat_path_copper
    req: PWR-7
    kind: copper_r
    path: ["J1.1 -> M1.3", "M1.2 -> L1.1, U2.A1"]
    current_a: 0.12
    max_mohm: 6000
    source: "boost input limit 0.12 A max; a copper drop dV at the input lowers the boost output power by 0.12 x dV x 0.85, i.e. VDD_4V0 droop over 100 ms by 0.12 x 0.85 / 4.0 x dV x 0.1 s / 0.144 F = 0.0177 dV; 0.014 V of the 0.414 V PWR-7 margin -> dV 0.79 V -> 0.79 / 0.12 = 6.6 Ohm, rounded down to 6000 mOhm"
  - {name: d1_tvs_lead, kind: copper_len, path: ["D1.1 -> J1.1"], max_mm: 5, source: "TPD1E10B06 app note: TVS next to the entry pad, lead length adds ~1 nH/mm to the clamp; 5 mm lead default"}
  - {name: d3_tvs_lead, kind: copper_len, path: ["D3.1 -> SW1.1"], max_mm: 5, source: "ESD9B5.0S next to the button pad; 5 mm lead default"}
blocks:
  vbat_div: {use: pfet_vbat_divider, parts: {M: M2, RTOP: R8, RBOT: R9, CF: C12}}
  boost: {use: tps612994_ybh_boost, parts: {U: U2, L: L1, CIN: C2, COUT: C3, RVSEL: R1}}
sim:
  ambient_c: 50
  includes: [models/dog_fets.lib]
  sources:
    # battery: Thevenin source on the wire pads; Vbat / Rbat set per analysis with alter
    - {line: "Vbat bat_src 0 DC 3.0"}
    - {line: "Rbat bat_src $(BAT_RAW) 1.5"}
    # boost input-limit corner (V = A) and supercap ESR multiplier (1 = 23 C, 1.7 = -20 C), global nodes of models/dog_power.lib
    - {line: "Vilim ilim_ctl 0 DC 0.08"}
    - {line: "Vesr esr_ctl 0 DC 1.7"}
    # modem load on nRF9151 VDD: 5 mA idle, 0.5 A TX burst (PWR-4 2 ms, PWR-7 100 ms set per analysis)
    - {line: "Imod $(VDD_4V0) 0 PULSE(0.005 0.5 20m 10u 10u 2m 1)"}
    - {line: "Iaon $(VDD_AON) 0 DC 20u"}
    - {line: "Ven $(VBAT_SENSE_EN) 0 DC 3.0"}
    - {line: "Bverr verr_div 0 V = 2*v($(VBAT_SENSE)) - v($(BAT_P))"}   # PWR-6 probe: divider reading x2 minus the battery node
    # charged start for the burst transients (uic): rails at their regulated values (the OP has a second, start-up equilibrium of the input-limited boost)
    - {line: ".ic v($(VDD_4V0))=3.98 v($(VSTORE))=3.98 v($(VSTORE_BAL))=1.99 v($(VDD_AON))=3.0 v($(VDD_GNSS))=3.0"}
  analyses:
    - name: pwr4_lifes2_cold_ilim80
      cmd: |
        alter Vbat dc = 3.0
        alter Rbat = 1.5
        alter Vilim dc = 0.08
        tran 20u 40m uic
      realism: "who: environment, every LTE TX at -20 C on Li-FeS2 cells; how often: each connection; timing: 0.5 A for 2 ms (lead default, PWR-4); limits: nRF9151 VDD min 3.0 V (PS), 2x Li-FeS2 1.5 ohm at -20 C (PM round 2 q2); boost input limit min 80 mA (SLVSGS9G EC table), supercap C min 72 mF/module, ESR 132 mOhm x1.7 cold (gz215f.md)"
      measures:
        - {name: pwr4_vdd_min_i80, meas: "min v(VDD_4V0) from=19m to=40m", min: 3.0, unit: V, req: PWR-4}
    - name: pwr4_lifes2_cold_ilim120
      cmd: |
        alter Vbat dc = 3.0
        alter Rbat = 1.5
        alter Vilim dc = 0.12
        tran 20u 40m uic
      realism: "as pwr4_lifes2_cold_ilim80, boost input limit max 120 mA (deepest battery sag)"
      measures:
        - {name: pwr4_vdd_min_i120, meas: "min v(VDD_4V0) from=19m to=40m", min: 3.0, unit: V, req: PWR-4}
        - {name: dbg_pwr4_vbatp_min_i120, meas: "min v(BAT_P) from=19m to=40m", unit: V}
    - name: pwr7_alkaline_cold_ilim80
      cmd: |
        alter Vbat dc = 2.8
        alter Rbat = 4.0
        alter Vilim dc = 0.08
        alter Imod pulse = [ 0.005 0.5 20m 10u 10u 100m 1 ]
        tran 100u 300m uic
      realism: "who: user fits 2x alkaline AA (PM round 3 q5), environment -20 C; how often: each LTE connection with CE repetitions; timing: 0.5 A for 100 ms (lead default); limits: modem floor 3.2 V and supervisor trip max 2.99 V (TPS3838K33, SLVS292F 7.5), E91 2.8 V / 4.0 ohm cold (e91.md), boost limit min 80 mA, supercap C min, cold ESR"
      measures:
        - {name: pwr7_vdd_min_i80, meas: "min v(VDD_4V0) from=19m to=300m", min: 3.2, unit: V, req: PWR-7}
    - name: pwr7_alkaline_cold_ilim120
      cmd: |
        alter Vbat dc = 2.8
        alter Rbat = 4.0
        alter Vilim dc = 0.12
        alter Imod pulse = [ 0.005 0.5 20m 10u 10u 100m 1 ]
        tran 100u 300m uic
      realism: "as pwr7_alkaline_cold_ilim80, boost input limit max 120 mA"
      measures:
        - {name: pwr7_vdd_min_i120, meas: "min v(VDD_4V0) from=19m to=300m", min: 3.2, unit: V, req: PWR-7}
        - {name: dbg_pwr7_vbatp_min_i120, meas: "min v(BAT_P) from=19m to=300m", unit: V}
    - name: vbat_divider_lo
      cmd: |
        alter Vbat dc = 1.8
        alter Rbat = 0.1
        alter Imod pulse = [ 0.005 0.005 1 1u 1u 1 2 ]
        tran 50u 20m uic
      realism: "who: firmware, battery reading at end of life (1.8 V, PWR-1 floor) under idle load; limits: R8/R9 0.1 % (ratio error 0.2 %), CJ2305 on through M3 at 3.0 V gate drive"
      measures:
        - {name: vbat_div_err_mv_1v8, meas: "find v(verr_div) at=19m", scale: 1000, min: -50, max: 50, unit: mV, req: PWR-6}
        - {name: pwr1_vdd4v0_at_1v8, meas: "min v(VDD_4V0) from=5m to=20m", min: 3.88, max: 4.12, unit: V, req: PWR-1}
        - {name: pwr1_vaon_at_1v8, meas: "min v(VDD_AON) from=5m to=20m", min: 2.94, max: 3.06, unit: V, req: PWR-1}
    - name: vbat_divider_hi
      cmd: |
        alter Vbat dc = 3.6
        alter Rbat = 1.5
        alter Imod pulse = [ 0.005 0.005 1 1u 1u 1 2 ]
        tran 50u 20m uic
      realism: "who: firmware, battery reading on fresh cells (3.6 V OC); limits as vbat_divider_lo"
      measures:
        - {name: vbat_div_err_mv_3v6, meas: "find v(verr_div) at=19m", scale: 1000, min: -50, max: 50, unit: mV, req: PWR-6}
        - {name: pwr1_vdd4v0_at_3v6, meas: "max v(VDD_4V0) from=5m to=20m", min: 3.88, max: 4.12, unit: V, req: PWR-1}
        - {name: pwr1_vaon_at_3v6, meas: "max v(VDD_AON) from=5m to=20m", min: 2.94, max: 3.06, unit: V, req: PWR-1}

