project: dog_gps_tracker
revision: A
description: "Dog-collar GPS tracker: nRF9151 SiP (LTE-M/NB-IoT + app MCU), LC76G GNSS (GPS+Galileo), 2x AA Li-FeS2 via boost"
board:
  pour_taps: [L2, L3, L4, L5, C17, C18, C19, C20, C21, C15, FL1, U8, C24, C25, C26, AE1, AE2]   # sign-off review: a GND via at each RF shunt and the GNSS chain (taps on every pad choked the routing round U1)
  width_mm: 75          # MECH-2: 75 x 35 (PM round 8, q1; was 70, layout density)
  height_mm: 35
  layers: 4             # nRF9151 LGA escape + 50 ohm CPWG on L1 over solid GND L2 (Nordic reference is 4-layer); architecture.md
  thickness_mm: 0.8     # MECH-1 (65 g, PM round 3 q2): 0.8 mm FR-4 = 3.6 g (1.0 mm 4.5 g); mass budget architecture.md 10
  margin_mm: 1.0        # MECH-2: parts >= 1 mm from the edge
  clearance_mm: 0.127   # JLCPCB 4-layer standard capability 0.09 mm trace/space; 0.127 (5 mil) clears the TPS612994 WCSP 0.4 mm and LIS2DW12 0.5 mm pad gaps (0.17 / 0.15 mm), stage 7 lead
  track_mm: 0.15        # 6 mil signal tracks for the nRF9151 LGA 0.5 mm escape
  via_drill_mm: 0.3     # JLCPCB standard via without the small-hole surcharge
  via_dia_mm: 0.5
  ref_plane_h_mm: 0.1   # JLCPCB 0.8 mm 4-layer stack JLC04081H-3313: L1-L2 prepreg 3313 0.1 mm, core 0.45 mm (JLCPCB impedance stack-up page); 50 ohm microstrip L1 over L2 GND, er 4.1, 35 um: w ~0.18 mm (Hammerstad)
# budgets: written in architecture.md (Layout budgets); stage 2 has no component pads, hwflow check rejects paths on item names. Stage 4 adds them with real refs.
floorplan:
  construction: double      # MECH-3: SMD parts on the front; back face: test pads, battery wire pads, 2 hand-soldered supercaps (PM round 5 q1, round 7 q1)
  fill_max: 0.85
  wall_mm: {left: 4, right: 4, top: 4, bottom: 4}   # MECH-2: 4 mm keep-in from the housing wall
  depth:
    limit_mm: 27   # lead estimate, no requirement number (device thickness is a PM item)
    extra:
      - {name: "battery compartment below the board: ceiling 1.0 + gap 0.5 + 2x AA dia 14.5 + door 1.5", mm: 17.5, source: "AA IEC LR6/FR6 dia 14.5 mm; lead housing estimate"}
      - {name: "front housing wall 1.5 + air 0.5", mm: 2.0, source: "lead housing estimate (IP67 PC shell)"}
  regions:
    - {name: lte_clearance, kind: antenna, rect: [60.5, 0, 75, 35], side: both, items: [lte_ant], copper_keepout: {forbids: [vias, copperpour]},
       source: "Ignion AN NN02-220 clearance/GND length: clearance 14.5 mm deep (NN02-220 courtyard 13.3 mm + 1 mm edge margin), copper-free on all layers; GND length left 55.5 mm (avg LFR efficiency ~19 % at 60 mm)"}
    - {name: accel_zone, kind: other, rect: [8, 26.5, 20, 34], side: front, items: [U9, C29, C30, R18, R19],
       source: "LIS2DW12 cluster away from the dense U1 top-left escape (stage 7: its GND pads were left on F.Cu pour islands); I2C/INT length is not critical (lead)"}
    - {name: gnd_plane_in1, rect: [0, 0, 75, 35], copper_keepout: {layers: [In1.Cu], forbids: [tracks]},
       source: "In1.Cu is the solid GND reference of the 50 ohm L1 microstrip (board.ref_plane_h_mm 0.1, JLC04081H-3313) and of the nRF9151/LC76G RF grounds; stage 7: signal tracks on In1 split the GND pour into islands (lead)"}
    - {name: c4_pad0_novia, circle: [35.55, 4.25, 2.10], copper_keepout: {forbids: [vias]},
       note: "sign-off review: 0.85 mm here, the fixed GND via of the boost block at (36.1, 6.55)"}
    - {name: c4_pad1_novia, circle: [50.55, 4.25, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C4 pad"}
    - {name: c4_pad2_novia, circle: [35.55, 22.25, 1.85], copper_keepout: {forbids: [vias]},
       note: "sign-off: 0.6 mm here (tented vias): the U1 decoupling and SWD routes need the room"}
    - {name: c4_pad3_novia, circle: [50.55, 22.25, 1.85], copper_keepout: {forbids: [vias]},
       note: "sign-off: 0.6 mm here (tented vias): the U1 decoupling and SWD routes need the room"}
    - {name: c4_pad4_novia, circle: [43.05, 23.45, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C4 pad"}
    - {name: c5_pad0_novia, circle: [14.53, 13.78, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C5 pad"}
    - {name: c5_pad1_novia, circle: [32.53, 13.78, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C5 pad"}
    - {name: c5_pad2_novia, circle: [14.53, 28.78, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C5 pad"}
    - {name: c5_pad3_novia, circle: [32.53, 28.78, 1.85], copper_keepout: {forbids: [vias]},
       note: "sign-off: 0.6 mm here (tented vias): the U1 decoupling and SWD routes need the room"}
    - {name: c5_pad4_novia, circle: [13.33, 21.28, 2.25], copper_keepout: {forbids: [vias]},
       note: "sign-off review: no via within 1 mm of a hand-soldered C5 pad"}
    - {name: gnss_patch_body_tracks, rect: [4, 11.5, 16, 23.5], copper_keepout: {layers: [F.Cu], forbids: [tracks, vias]},
       source: "IF-5: no F.Cu signal tracks under the 12 x 12 patch body (its ground is the F.Cu GND pour); stage 7: the whole-zone ban pushed GNSS_ANT and the pour around (lead)"}
    - {name: lte_clear_tracks_inner, rect: [60.5, 0, 75, 35], copper_keepout: {layers: [In1.Cu, In2.Cu, B.Cu], forbids: [tracks]},
       source: "IF-5, Ignion AN NN02-220: clearance copper-free on all layers (stage 7: the router put SIM/UART tracks and GND pour in it)"}
    - {name: lte_clear_tracks_front_a, rect: [60.5, 0, 75, 2], copper_keepout: {layers: [F.Cu], forbids: [tracks]}, source: "IF-5; F.Cu tracks only in the feed channel y 2.0-8.6 (L5 to the NN02-220 feed tab)"}
    - {name: lte_clear_tracks_front_b, rect: [60.5, 8.6, 75, 35], copper_keepout: {layers: [F.Cu], forbids: [tracks]}, source: "IF-5; as lte_clear_tracks_front_a"}
    - {name: gnss_patch_zone, kind: antenna, rect: [2.5, 10.5, 17.5, 24.5], side: front, items: [gnss_patch],
       source: "15x15 patch on GND, facing up when worn; parts kept 1 mm off its edges"}
    - {name: screw_tl, kind: keepout, mechanical: screw, circle: [4, 4, 2.5], conductive: true, accessible: false, source: "M2 x 4 self-tap into housing boss, head dia 4.5 mm (+0.25); inside the sealed shell"}
    - {name: screw_bl, kind: keepout, mechanical: screw, circle: [4, 31, 2.5], conductive: true, accessible: false, source: "as screw_tl"}
    - {name: screw_tr, kind: keepout, mechanical: screw, circle: [54, 3.5, 2.5], conductive: true, accessible: false, source: "as screw_tl; moved from (53, 4) (stage-5 floorplan rework) to free x 51.5..55.5 for the LTE match column from U1 pad 35 up to the feed; head edge x 51.5 = 4 mm from the LTE clearance, y 6.0 < U1 courtyard 6.45; housing boss position is a lead estimate"}
    - {name: screw_br, kind: keepout, mechanical: screw, circle: [58, 31, 2.5], conductive: true, accessible: false, source: "as screw_tl; head edge at x 55.5 = 0 mm to the LTE clearance"}
    - {name: hole_tl, cut: true, circle: [4, 4, 1.1], source: "M2 clearance hole 2.2 mm"}
    - {name: hole_bl, cut: true, circle: [4, 31, 1.1], source: "M2 clearance hole 2.2 mm"}
    - {name: hole_tr, cut: true, circle: [54, 3.5, 1.1], source: "M2 clearance hole 2.2 mm"}
    - {name: hole_br, cut: true, circle: [58, 31, 1.1], source: "M2 clearance hole 2.2 mm"}
  items:
    - {name: lte_ant, refs: [AE1], footprint: "dog_misc:NN02-220", side: front, rot: 270, at: [67.3, 17.5], height_mm: 2.0, region: lte_clearance,
       source: "Ignion ALL mXTEND NN02-220, 24 x 12 x 2 mm, 698-960/1710-2690 MHz (DS_NN02-220)"}
    - {name: gnss_patch, refs: [AE2], footprint: "dog_misc:GP.1575.12.4.A.02", side: front, at: [10, 17.5], height_mm: 4.0, region: gnss_patch_zone,
       source: "Taoglas GP.1575.12.4.A.02 12 x 12 x 4 mm patch, pin feed (datasheet p.16; notes/datasheets/gnss-patch-saw.md)"}
    - {name: sip, refs: [U1], footprint: "dog:nRF9151_LGA", side: front, rot: 90, at: [50.5, 13.5], height_mm: 1.2,
       source: "nRF9151 LGA 12.1 x 11.1 x 1.2 mm (nRF9151 PS v1.0 features page)"}
    - {name: gnss_rx, refs: [U8], footprint: "dog_misc:LC76G", side: front, rot: 180, at: [25.5, 21.0], height_mm: 2.4,
       source: "Quectel LC76G-PA 10.1 x 9.7 x 2.4 mm, 28 pads (LC76G HW design V1.3 Fig 18 p.40, p.46)"}
    - {name: buzzer, refs: [BZ1], footprint: "Buzzer_Beeper:Buzzer_Murata_PKLCS1212E", side: front, at: [30, 7.5], height_mm: 3.0,
       source: "Murata PKLCS1212E 12 x 12 x 3 mm SMD piezo; sound port to the top-edge membrane (ENV-2)"}
    - {name: button, refs: [SW1], footprint: "Button_Switch_SMD:SW_Push_1P1T_XKB_TS-1187A", side: front, at: [30, 31], height_mm: 1.5,
       source: "TS-1187A 5.1 x 5.1 mm, pressed through the housing membrane at the bottom edge"}
    - {name: led, refs: [D2], footprint: "LED_SMD:LED_0603_1608Metric", side: front, at: [42, 32.5], height_mm: 0.8,
       source: "0603 LED under a light pipe next to the button"}
    - {name: esim, refs: [U7], footprint: "dog_misc:MFF2_DFN8_5x6_P1.27", side: front, height_mm: 1.27,
       source: "MFF2 eUICC (SON-8 6 x 5 mm, ETSI TS 102 671) soldered; lead decision instead of a nano-SIM holder"}
    - {name: test_pads, refs: [TP1, TP2, TP3, TP4, TP5, TP6, TP7], side: back, height_mm: 0.1,
       source: "IF-8: SWD + UART pads on the back face, reached through the battery-compartment ceiling window"}
    - {name: bat_pads, refs: [J1], side: back, height_mm: 1.5,
       source: "wires from the housing cell contacts (hand-soldered, MECH-3 allows); cells sit below the compartment ceiling, not on the board"}
    - {name: supercap_a, refs: [C4], footprint: "dog_misc:CAPXX_GZ215F", side: back, rot: 90, at: [22.6, 17.5], height_mm: 2.5,
       source: "PWR-7, PM round 7 q1: CAP-XX GZ215F 72 mF min, 20 x 15 x 2.5 mm, hand solder (CAP-XX GZ115/GZ215 datasheet; notes/datasheets/gz215f.md)"}
    - {name: supercap_b, refs: [C5], footprint: "dog_misc:CAPXX_GZ215F", side: back, rot: 90, at: [45, 17.5], height_mm: 2.5,
       source: "as supercap_a, in parallel; kept 2.5 mm off screw_tr"}
    - {name: rest_front, groups: [power, modem, lte_rf, gnss, sim, ui, sensor], side: front, area_mm2: 357,
       source: "power (boost IC 9 + inductor 10 + 2x 47 uF MLCC 8 (polymer replaced by the back-face supercap) + rev FET 6 + LDO 4 + supervisor 6 + TPL5010 6 + caps 30 = 102) x1.5 = 153; SiP decoupling + LTE match 100; GNSS match 30; accel 12; TVS x3 15; divider + switch 15; buzzer drive 15; LED R + misc 40"}
  nets:
    - {between: [sip, lte_ant], count: 1}
    - {between: [sip, gnss_rx], count: 4}
    - {between: [gnss_rx, gnss_patch], count: 1}
    - {between: [sip, buzzer], count: 2}
    - {between: [sip, esim], count: 4}
    - {between: [sip, button], count: 1}
    - {between: [sip, led], count: 1}
    - {between: [sip, test_pads], count: 6}
    - {between: [sip, rest_front], count: 12}
    - {between: [bat_pads, rest_front], count: 2}
    - {between: [supercap_a, rest_front], count: 2}
    - {between: [supercap_b, rest_front], count: 2}
    - {between: [gnss_rx, rest_front], count: 3}
nets:
  GND: {class: ground}
  BAT_RAW: {class: power, current_a: 0.15, v_max: 3.7, v_min: -3.7, external_supply: true}   # 2x Li-FeS2 fresh OC 3.6 V (PWR-1) + 0.1; reversed pair -3.7 V (user fault)
  BAT_P: {class: power, current_a: 0.15, v_max: 3.7, external_supply: true}   # fed from the cells through M1       # boost input; TPS612994 average input limit 0.12 A max (SLVSGS9G EC table)
  SW_BST: {class: switching, current_a: 0.4}               # inductor peak ~350 mA in start-up (7.3.7)
  VDD_4V0: {class: power, current_a: 0.6, v_max: 4.15}      # 4.0 V (VSEL 22.6k) + 3 % accuracy assumed + ripple (parts-power.md F6)
  VSTORE: {class: power, current_a: 0.6, v_max: 4.15}
  VSTORE_BAL: {v_max: 2.1}
  VDD_AON: {class: signal, width_mm: 0.15, v_max: 3.06}      # < 5 mA loads; 0.15 mm escapes SiP pads 10/65 (escape proof)     # TPS7A0230 3.0 V + 2 % (parts-power.md G2)
  VDD_GNSS: {class: power, current_a: 0.05, v_max: 3.06}
  SIM_1V8: {v_max: 1.9, external_supply: true}             # nRF9151 SIM supply output 1.8 V (the symbol types pin 19 power_in)
  DEC0: {v_max: 2.3}                                       # internal regulator ~2.2 V (DevZone 128776)
  GNSS_RST_L: {pullup: internal, v_max: 1.9}               # LC76G RESET_N internal pull-up to 1.8 V (LC76G HW design p.25); nRF drives it open-drain low only
  RESET_N: {v_max: 3.06}
  LTE_RF: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  LTE_M0: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  LTE_M1: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  LTE_M2: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  LTE_M3: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  LTE_FEED: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  GNSS_ANT: {impedance_ohm: 50, width_mm: 0.18, layers: [B.Cu, F.Cu]}   # patch pin -> B.Cu (no F.Cu copper in the 3.0 mm top clearance, Taoglas p.16) -> via next to FL1.1; F.Cu only for the via-to-FL1.1 stub (FL1 is SMD on F.Cu)
  GNSS_RF_IN: {impedance_ohm: 50, width_mm: 0.18, layers: [F.Cu]}
  VBAT_SENSE: {class: signal, sensitive: true}
  BUZ_A: {v_max: 6.2, v_min: -3.1}   # AC-coupled antiphase drive: 2 x 3.06 V peak
  BUZ_B: {v_max: 6.2, v_min: -3.1}
  SIM_RST: {v_max: 1.9}   # SIM_1V8 domain
  SIM_IO: {v_max: 1.9}   # SIM_1V8 domain
  SIM_CLK: {v_max: 1.9}   # SIM_1V8 domain
  GNSS_RX: {v_max: 3.06}
  GNSS_RXD_L: {v_max: 3.06}
  GNSS_RST_N: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  GNSS_TX: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  GNSS_EN: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  ACCEL_SDA: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  ACCEL_SCL: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  ACCEL_INT: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  WDT_WAKE: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  WDT_DONE: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  UART_TX: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  UART_RX: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  SWDIO: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  SWCLK: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  BTN: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  LED: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  BUZ_P: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  BUZ_N: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  VBAT_SENSE_EN: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  LED_A: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  BUZ_P1: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
  BUZ_N1: {v_max: 3.06}   # VDD_GPIO = VDD_AON domain
