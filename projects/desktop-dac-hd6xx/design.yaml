# Reviewable revision-A circuit; fabrication and listening gates are not complete.
# Source decisions and model limitations are in notes/*-circuit.md.
project: desktop_dac_hd6xx
revision: A
description: >-
  Desktop USB-C DAC and HD6XX headphone amplifier; circuit capture under verification, not fabrication-ready.
board:
  width_mm: 140
  height_mm: 80
  layers: 4
  thickness_mm: 1.6
  # Low-current rails fit 0.5 mm QFN pin escape; current_a still widens high-current nets.
  power_track_mm: 0.3
floorplan:
  construction: single
  depth:
    limit_mm: 32
    source: 'architecture.md: provisional enclosure allowance; module/support and panel controls not mechanically released.'
    extra:
    - name: bottom_standoffs
      mm: 4
      source: Provisional assembly allowance.
    - name: top_clearance
      mm: 2
      source: Provisional assembly allowance.
  regions:
  - name: usb
    kind: keepout
    rect:
    - 2
    - 0
    - 36
    - 71
    items:
    - usb_module
    source: 'notes/mechanics.md: official module CAD bounds plus edge allowance; reserve module envelope.'
  - name: power
    kind: other
    rect:
    - 38
    - 2
    - 137
    - 35
    items:
    - dc_input
    - power_stage
    isolation_mm: 5
    from:
    - analog
    - dac
    source: Repacked inside agreed outline for real power parts; 5 mm separation is an engineering placement rule, not
      noise proof.
  - name: dac
    kind: other
    rect:
    - 38
    - 43
    - 76
    - 78
    items:
    - usb_header
    - dac_stage
    - volume
    source: Short interface from module at left; DAC support and panel-pot header.
  - name: analog
    kind: other
    rect:
    - 80
    - 43
    - 137
    - 78
    items:
    - amplifier
    - output_protection
    - headphone_jack
    source: Analog output/filter/driver and normally-open output protection.
  items:
  - name: usb_module
    size_mm:
    - 32
    - 69.258
    height_mm: 15
    at:
    - 19
    - 35.629
    source: 'notes/mechanics.md: CAD XY bounds; 15 mm height includes provisional support allowance.'
  - name: usb_header
    refs:
    - J100
    height_mm: 9
    source: Custom sequential-row footprint; short harness mating/orientation remains a mechanical gate.
  - name: dc_input
    refs:
    - J300
    height_mm: 12
    source: PJ-102AH selected footprint; enclosure cutout not finalized.
  - name: power_stage
    groups:
    - power
    height_mm: 22
    source: 'notes/power-circuit.md: maximum seated C340 height; all parts use real courtyards.'
  - name: dac_stage
    groups:
    - dac
    height_mm: 5
    source: Real footprints; conservative support-component height.
  - name: volume
    refs:
    - J200
    height_mm: 9
    source: Panel-pot harness header; pot/enclosure selection still open.
  - name: headphone_jack
    refs:
    - J201
    height_mm: 9
    source: Panel jack harness header; jack/enclosure selection still open.
  - name: amplifier
    groups:
    - analog
    height_mm: 3
    source: OPA1612/OPA1622 output-stage footprints.
  - name: output_protection
    groups:
    - protection
    height_mm: 6
    source: G6K relay and comparator/logic footprints; body-height allowance.
