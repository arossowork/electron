sim:
  includes: [lib/spice/opa1622_ti.lib, lib/spice/opa161x_ti.lib]
  sources:
  - {name: VPOS, p: VPOS, n: GND, value: DC 9}
  - {name: VNEG, p: VNEG, n: GND, value: DC -9}
  - {name: VINL, p: VOL_L, n: GND, value: DC 0 AC 2 SIN(0 2.828427 1k)}
  - {name: VINR, p: VOL_R, n: GND, value: DC 0 AC 2 SIN(0 2.828427 1k)}
  - {name: RL, p: AMP_L, n: GND, value: '300'}
  - {name: RR, p: AMP_R, n: GND, value: '300'}
  analyses:
  - name: 4vrms_two_channel
    timeout_s: 30
    cmd: tran 1u 6m
    measures:
    - {name: left_vrms, meas: rms v(AMP_L) from=5m to=6m, min: 3.8, max: 4.2, unit: Vrms, req: R8}
    - {name: right_vrms, meas: rms v(AMP_R) from=5m to=6m, min: 3.8, max: 4.2, unit: Vrms, req: R8}
  # This attempts the OPA1622 gain/load check using TI's macromodel and
  # ideal ±9 V supplies. It does not verify DAC full scale, pot, protection,
  # relay, rail tolerance, thermal behavior, distortion/noise, or safety.
