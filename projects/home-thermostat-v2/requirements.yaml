# Round 1 and round 2 answers applied (inbox/answers.md). All conflicts resolved (conflicts.md).
product: Screenless 2-zone WiFi/MQTT thermostat, 3-module device for an Italian 503 wall box, 1 x AA, 2 NTC probes, 2 latching 5 A 230 VAC outputs, offline schedule; 10-unit prototype
optimize_for:   # PM round 2, q4 (cost first); size is a hard limit (R12), not a criterion
  - {criterion: cost, weight: 2}
  - {criterion: battery_life, weight: 1}
requirements:
  # ---------- power ----------
  - id: R1
    priority: must
    text: "Power from 1 x AA alkaline cell (LR6). No mains supply. Electronics run from 0.9 V to 1.65 V cell voltage."
    acceptance: "3.3 V rail within 3.0-3.6 V for cell voltage 0.9-1.65 V at 0-80 mA continuous load; 350 mA peaks covered by R4"
    verification: simulation
    evidence: ""
    source: "brief; PM round 1, q1; load range derived (conflicts.md C8, stage 2)"
  - id: R2
    priority: must
    text: "Battery life at least 10 months on 1 x AA with 24 WiFi check-ins per day, 2 button-triggered check-ins per day, 2 probe readings per 2 min, 20 relay pulses per day."
    acceptance: "Average power at 3.3 V rail <= 224 uW (85 % of the 263 uW usable from 1 x AA over 10 months: 3.0 Wh x 0.80 x 0.8 / 7300 h), from the power budget in architecture.md with datasheet sleep currents (R3 <= 10 uA) and a WiFi wake energy of 0.5 J design value (limit 0.52 J per wake at 26 wakes/day; break-even 0.65 J)"
    verification: analysis
    evidence: "notes/power_budget.py; conflicts.md C1"
    source: "brief (1y+); PM round 1, q1; PM round 2, q4 (cost first, 10-11 months accepted)"
  - id: R3
    priority: must
    text: "Sleep current low enough for the budget."
    acceptance: "Total sleep current at 3.3 V <= 10 uA (sum of MCU deep sleep, RTC, converter Iq, divider and leakage datasheet values; bulk capacitor leakage <= 3.1 uA by first-article bench test, conflicts.md C7)"
    verification: datasheet
    evidence: "to fill in stage 3 (parts datasheets)"
    source: "derived from R2; C7 resolution (stage 2)"
  - id: R4
    priority: must
    text: "Supply holds up during WiFi TX bursts at end-of-life cell."
    acceptance: "3.3 V rail stays >= 3.0 V during a 350 mA, 5 ms load step with cell at 1.0 V and 0.5 ohm source resistance; boost input current <= 1.5 A"
    verification: simulation
    evidence: ""
    source: "derived (conflicts.md C1, peak current)"
  - id: R5
    priority: must
    text: "Low-battery warning sent over MQTT to the app at least 30 days before the heating-OFF cut-off (R8)."
    acceptance: "Battery voltage measurement error <= 20 mV over 0.9-1.65 V (divider tolerance + ADC error budget, Monte Carlo); warning threshold leaves >= 10 % of usable capacity before cut-off (30 days / 304 days minimum life (R2, 10 months) = 9.9 %)"
    verification: simulation
    evidence: ""
    source: "PM round 1, q4"
  # ---------- relay outputs ----------
  - id: R6
    priority: must
    text: "Two independent outputs, one per room, voltage-free normally-open contacts rated 5 A 250 VAC. Load: up to 4 x 230 V thermoelectric valve heads per output, or a zone valve / boiler enable contact."
    acceptance: "Relay datasheet contact rating >= 5 A resistive and >= 2 A inductive (cos phi 0.6) at 250 VAC; continuous rating >= 4 A (worst-case inrush of 4 heads, 4 x 1 A; steady 4 x 0.3 A = 1.2 A); electrical life >= 100k operations (20/day x 365 x 10 yr = 73k)"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "brief (2 x 220 VAC relay, two rooms); PM round 1, q3"
  - id: R7
    priority: must
    text: "Relays are latching (bistable); no holding current."
    acceptance: "Relay datasheet type = latching; driver delivers rated coil voltage +/-10 % for >= 2x rated set/reset time (>= 30 ms) from the battery buffer"
    verification: simulation
    evidence: ""
    source: "derived (conflicts.md C2: monostable coil 263 Wh/season vs 3 Wh battery)"
  - id: R8
    priority: must
    text: "Safe state: both outputs switch OFF before the battery is too low to switch them. No hold-up for sudden battery removal (not required)."
    acceptance: "Energy reserve at the low-battery cut-off >= 2 relay pulses (2 x 25 mJ = 50 mJ) with cell at 0.9 V, shown by driver simulation"
    verification: simulation
    evidence: ""
    source: "PM round 1, q4"
  # ---------- isolation and safety ----------
  - id: R9
    priority: must
    text: "Reinforced insulation between 230 VAC parts (relay contacts, terminals) and all SELV parts (probes, button, battery, MCU, antenna)."
    acceptance: "Creepage and clearance >= 6.0 mm on PCB between mains and SELV copper (IEC 60664-1: 250 V, PD2, group IIIb, OVC III -> 5.0 mm creepage, 5.5 mm clearance); relay datasheet coil-contact reinforced, >= 4 kV"
    verification: layout
    evidence: "layout DRC zone clearance; relay datasheet"
    source: "brief (isolation from 220 VAC); derived (IEC 60664-1, EN 60730-1)"
  - id: R10
    priority: must
    text: "Basic insulation between the two relay outputs (they may be on different circuits)."
    acceptance: "Creepage >= 2.5 mm and clearance >= 3.0 mm between output 1 and output 2 copper"
    verification: layout
    evidence: "layout DRC zone clearance"
    source: "derived (IEC 60664-1 basic, 250 V, OVC III)"
  - id: R11
    priority: must
    text: "Battery replacement does not expose live parts."
    acceptance: "Mechanical drawing: mains terminals and relays behind a fixed insulating cover (tool needed), IPXXB with the front plate removed; battery reachable without removing that cover"
    verification: inspection
    evidence: "enclosure drawing, stage 5"
    source: "derived (EN 60730-1 accessibility)"
  - id: R30
    priority: must
    text: "No mains supply: 230 VAC appears only on the relay contacts and the output terminals; no neutral connection."
    acceptance: "Schematic: mains nets connect only relay contact pins and the output terminal; no AC/DC converter, no N terminal"
    verification: inspection
    evidence: "schematic, stage 4"
    source: "PM round 1, q1 (conflicts.md C4)"
  # ---------- size ----------
  - id: R12
    priority: must
    text: "Standard 3-module device that clips into the support frame of an Italian 503 box, behind any brand's 3-module plate (plastic frame)."
    acceptance: "PCB outline <= 65 x 42 mm; component height so that total depth behind the frame <= 38 mm"
    verification: layout
    evidence: "board outline and 3D height check"
    source: "brief (Italian wall box); research (503 box 104-105 x 68-72 x 50-53.5 mm, module 22.5 x 45 mm); PM round 1, q2 (delegated to engineering)"
  # ---------- probes ----------
  - id: R13
    priority: must
    text: "Two temperature probe inputs, one per room."
    acceptance: "Two 2-pole SELV probe terminals on the PCB"
    verification: inspection
    evidence: "schematic and layout"
    source: "brief (two heat probes)"
  - id: R14
    priority: must
    text: "Standard 2-wire NTC 10 k B3950 1 % probes (heating-controller type, 0.5-1 USD each), cable up to 5 m."
    acceptance: "Measurement error <= +/-0.5 C over 10-30 C including NTC 1 %, reference resistor 0.1 %, ADC error after one-point calibration and 5 m cable (2 x 0.5 ohm series, < 0.01 C at 10 k) (Monte Carlo of the divider)"
    verification: simulation
    evidence: ""
    source: "PM round 2, q1 (conflicts.md C5)"
  - id: R15
    priority: should
    text: "Probe input survives cable pickup and ESD."
    acceptance: "Input RC filter corner <= 10 Hz; TVS or clamp on each probe line rated for IEC 61000-4-2 +/-8 kV air, +/-4 kV contact (datasheet)"
    verification: simulation
    evidence: ""
    source: "derived (5 m cable in the wall)"
  - id: R16
    priority: should
    text: "Temperature resolution and sampling."
    acceptance: "Resolution <= 0.1 C at 20 C; sample period <= 2 min per probe"
    verification: analysis
    evidence: "ADC LSB / NTC slope at 20 C, architecture.md"
    source: "derived from R14 (resolution 5x finer than +/-0.5 C) and R2 (720 samples/day)"
  # ---------- control and scheduling ----------
  - id: R17
    priority: must
    text: "Works offline: local thermostat loop and weekly schedule run without WiFi."
    acceptance: "Schedule (>= 6 switch points per day per zone, 7 days) stored in non-volatile flash; firmware test of control without network"
    verification: test
    evidence: "firmware test, outside hardware flow"
    source: "brief (work offline, RTC for scheduling)"
  - id: R18
    priority: must
    text: "Real-time clock accurate enough for offline scheduling."
    acceptance: "32.768 kHz crystal or RTC IC with tolerance <= 20 ppm at 25 C (datasheet) = <= 1.7 s/day; total drift <= 1 min per week offline over 0-40 C"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "brief (RTC); derived (schedule switch points within 1 min after a week offline)"
  - id: R19
    priority: should
    text: "Time resynchronised from NTP at each WiFi check-in; after a battery swap without network, zones run at a fixed fallback setpoint until time is known."
    acceptance: "architecture.md documents: NTP sync at every check-in (<= 60 min, R21); fallback setpoint value (18 C) used while time is unknown after a battery swap"
    verification: analysis
    evidence: "architecture.md"
    source: "derived from R17, R18 and R21 (engineering)"
  # ---------- connectivity ----------
  - id: R20
    priority: must
    text: "WiFi 2.4 GHz 802.11b/g/n with MQTT for remote setpoints, schedules and readings."
    acceptance: "Pre-certified (CE/RED) WiFi module with integrated antenna, datasheet TX power >= 15 dBm"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "brief (WiFi, MQTT)"
  - id: R21
    priority: must
    text: "Remote commands take effect within 60 min (hourly check-in), or at once when the user presses the button."
    acceptance: "Wake timer period <= 60 min in the firmware config; button wired to an MCU deep-sleep wake-up pin (datasheet) that starts a check-in; commands delivered as retained MQTT messages"
    verification: analysis
    evidence: "conflicts.md C1"
    source: "PM round 1, q1"
  - id: R22
    priority: must
    text: "Antenna performance protected from relays, battery and mains wiring."
    acceptance: "Module antenna at a board edge, no copper under it on any layer, >= 10 mm from relays and battery holder, per module datasheet keep-out"
    verification: layout
    evidence: "layout keep-out check"
    source: "brief (beware of WiFi HF); derived"
  # ---------- user interface ----------
  - id: R23
    priority: should
    text: "One button (WiFi setup, force check-in, factory reset by long press) and one status LED shown only on demand."
    acceptance: "LED current <= 2 mA, on only during button interaction or setup (energy <= 1 % of the 263 uW budget = 2.6 uW, about 0.23 J/day = 35 s/day at 2 mA, 3.3 V); button on a deep-sleep wake-up pin"
    verification: analysis
    evidence: "power budget"
    source: "brief (no screen); PM round 2, q3 (delegated to engineering)"
  - id: R24
    priority: should
    text: "WiFi setup from a phone without a screen on the device (BLE or temporary access point started by the button)."
    acceptance: "WiFi module supports BLE or SoftAP (datasheet)"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "PM round 2, q3 (delegated to engineering)"
  # ---------- environment ----------
  - id: R25
    priority: must
    text: "Indoor operating temperature 0-40 C, 10-90 % RH non-condensing; storage -20 to 60 C."
    acceptance: "All parts rated >= -10 to +60 C operating (datasheet min/max)"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "derived (indoor wall box, EN 60730-1 normal indoor conditions)"
  - id: R26
    priority: should
    text: "ESD on user-reachable parts."
    acceptance: "Button and probe lines protected to IEC 61000-4-2 +/-8 kV air, +/-4 kV contact (TVS datasheet)"
    verification: datasheet
    evidence: "to fill in stage 3"
    source: "derived (EN 301 489-1)"
  # ---------- compliance, cost, volume ----------
  - id: R27
    priority: must
    text: "Designed for CE: LVD (EN 60730-1, EN 60730-2-9), RED (EN 300 328, EN 301 489-1/-17, EN 62479, EN 18031-1 cybersecurity), RoHS, EU battery regulation 2023/1542."
    acceptance: "Compliance checklist in architecture.md: insulation per R9/R10, pre-certified radio module, RoHS parts only"
    verification: inspection
    evidence: "architecture.md compliance list"
    source: "derived (230 VAC control with radio sold in the EU)"
  - id: R28
    priority: should
    text: "Unit cost under 25 USD at 10 units (BOM + PCB + JLCPCB assembly per unit), excluding probes, plate and battery."
    acceptance: "Sum of price_usd in design.yaml at qty 10 + (PCB fabrication + assembly setup + extended-part fees) / 10 <= 25 USD per unit"
    verification: analysis
    evidence: "hwflow build cost report"
    source: "PM round 2, q2"
  - id: R29
    priority: should
    text: "Prototype run of 10 units, assembled by JLCPCB."
    acceptance: "Every part has an LCSC number with JLCPCB stock >= 15 (10 units + attrition) at order time (hwflow parts); parts JLCPCB cannot place (battery holder, terminals if needed) listed as hand-solder in the BOM"
    verification: inspection
    evidence: "hwflow parts check"
    source: "PM round 2, q2"
