project: mechanical-keyboard-usb-audio-hub
revision: A
description: >
  Full-size ANSI 104-key hot-swap keyboard PCB with a cascaded USB 3 hub (2x USB-A, 2x USB-C user ports on the
  front, PD 20 W per C port and 7.5 W per A port from an optional 65 W PD input on the back) and a 120 dB USB audio
  device (headphone out, mic in). Stage 2: board and floorplan only (architecture.md).

board:
  width_mm: 440        # R2 (<= 440 x 155)
  height_mm: 152       # 6.2 back margin + 123.8 key field (6.5 rows x 19.05) + 22 front strip (R24 <= 25)
  layers: 4            # R34, JLC04161H-7628
  thickness_mm: 1.6    # R34

floorplan:
  construction: double   # parts on both faces: hot-swap sockets + diodes on the back (R27), ICs on the top
  depth:
    limit_mm: 11.1
    source: "R24: tallest front part 7.5 mm above PCB top (knob shaft excluded) + 1.6 mm board (R34) + 2.0 mm back allowance = hot-swap socket height (assumption: nothing on the back taller than the sockets, case bottom sees one flat level)"
  regions:
    - name: key_matrix
      kind: other
      poly: [[3, 4], [358, 4], [358, 26], [437, 26], [437, 130], [3, 130]]
      items: [keys]
      isolation_mm: 5
      from: [audio]
      source: "ANSI 104 at 19.05 mm pitch: 22.5 u x 6.5 u = 428.6 x 123.8 mm; R35 no matrix trace within 5 mm of the audio region"
    - name: back_conn
      kind: other
      rect: [360, 0, 437, 24]
      items: [usbc_host, host_mux, usbc_pdin, pd_sink, vbus_path]
      source: "R9, R20: host and PD input on the back edge, in the blank 4 u x 1 u above the numpad (no switch there)"
    - name: audio
      kind: other
      rect: [3, 135.5, 123, 152]
      items: [hp_jack, mic_jack, audio_top]
      isolation_mm: 30
      from: [power_a, power_b, usb_c]
      source: "R35 / C11: audio analog parts and jacks >= 30 mm from switching inductors and USB-C charge ports; 120 x 16.5 = 1980 mm2 for 1348 mm2 of courtyards (68 %)"
    - name: ui
      kind: other
      rect: [125, 130, 145, 152]
      items: [encoder]
      source: "R28 knob on the front strip, next to the audio corner (not inside it); 255 mm2 in 440 (58 %)"
    - name: audio_dig
      kind: other
      rect: [147, 130, 187, 152]
      items: [audio_bridge, mcu]
      source: "USB audio bridge and keyboard MCU: 539 mm2 in 880 (61 %); USB traces stay >= 24 mm from the audio region (R35 asks 5 mm)"
    - name: power_a
      kind: other
      rect: [189, 130, 245, 152]
      items: [buck_5v, buck_dig, aux_pm, usba_sw]
      source: "5 V buck (USB-A + internal), 3.3 V / 0.9 V bucks, +-5.5 V audio pre-regulator: 785 mm2 in 1232 (64 %), 66 mm from audio (R35 30)"
    - name: usb_a
      kind: other
      rect: [247, 130, 290, 152]
      items: [usba1, usba2, usba_esd]
      source: "R3, R14; 545 mm2 in 946 (58 %), next to usba_sw (power_a) and the hub"
    - name: hub
      kind: other
      rect: [292, 130, 330, 152]
      items: [hub1, hub2]
      source: "hub between the USB-A and USB-C ports; upstream SuperSpeed pairs come down the nav/numpad channel (x ~356); 428 mm2 in 836 (51 %)"
    - name: usb_c
      kind: other
      rect: [332, 130, 358, 152]
      items: [usbc1, usbc2, usbc_mux]
      source: "R3, R14; 273 mm2 in 572 (48 %); USB-C charge ports 209 mm from the audio region"
    - name: power_b
      kind: other
      rect: [360, 130, 437, 152]
      items: [pd_src1, pd_src2]
      source: "two PD source bucks next to the C ports, 968 mm2 in 1694 (57 %); 20 V arrives from back_conn down the right edge on L3"
  items:
    # key matrix: 104 sockets + 104 diodes with fixed ANSI 104 placements (components SW1-SW104, D1-D104)
    - {name: keys, groups: [matrix], height_mm: 1.85, source: "Kailh CPG151101S11 socket height ~1.85 mm on the back; the MX switch sits above the plate (not a board part)"}
    # back edge
    - {name: usbc_host, refs: [J301], height_mm: 3.3, source: "HCTL USB-C 24P mid-mount (provisional footprint, B1); under the plate gap 3.5 mm (C7)"}
    - {name: host_mux, groups: [usb_host], height_mm: 1.0, source: "HD3SS3220 + host SS/D ESD arrays at the host connector"}
    - {name: usbc_pdin, refs: [J600], at: [398, 3.8], side: front, height_mm: 3.3, source: "USB-C power receptacle; centre 20 mm from the host socket (R20 <= 25)"}
    - {name: pd_sink, groups: [pd_sink, pwr_ctl], side: front, height_mm: 1.2, source: "pass B real parts: CH224D sink + AO4407A back-to-back + TVS, and the PD/bus mode logic (pwr_ctl)"}
    - {name: vbus_path, groups: [vbus_path], side: front, height_mm: 1.2, source: "host VBUS eFuse with ILIM (SOT/QFN 2x2) + CC Rp detect + ideal-diode OR"}
    # audio corner
    - {name: hp_jack, refs: [J930], at: [12, 145], side: front, height_mm: 5.37, source: "SJ-3524-SMT headphone jack (pass C), 5.37 mm high"}
    - {name: mic_jack, refs: [J980], at: [27, 145], side: front, height_mm: 5.37, source: "SJ-3524-SMT mic jack (pass C)"}
    - {name: audio_top, groups: [audio_dac, audio_hp, audio_ldo, audio_mic], side: front, height_mm: 2.8, source: "pass C real parts: DAC + ADC QFN, 4 OPA1612 SOIC-8, OPA1622 VSON, 4 LDOs, 4 x 330 uF tantalum B (2.1 mm), passives; all front (hwflow places every part on the front)"}
    # UI and digital
    - {name: encoder, groups: [ui], height_mm: 7.0, source: "EC11E vertical encoder with push, body height class 7 mm (B10; shaft excluded from R24)"}
    - {name: audio_bridge, groups: [audio_bridge], side: front, height_mm: 1.2, source: "pass C real parts: XU316 QFN-60 7x7, W25Q64 SOIC-8, 24 MHz crystal, 2 MCLK oscillators, decoupling, JTAG pads"}
    - {name: mcu, groups: [mcu], height_mm: 1.0, source: "RP2040 QFN-56 + W25Q16 SOIC-8 + 12 MHz crystal, buttons, SWD pads"}
    # power
    - {name: buck_5v, groups: [buck_5v], side: front, height_mm: 4.0, source: "20 V -> 5 V 4 A sync buck, forced PWM >= 400 kHz, shielded inductor ~7 x 7 x 4 mm"}
    - {name: buck_dig, groups: [buck_dig], side: front, height_mm: 2.0, source: "3.3 V and 0.9 V bucks, inductors 3 x 3 x 1.5"}
    - {name: aux_pm, groups: [aux_pm], side: front, height_mm: 2.0, source: "+-5.5 V forced-PWM pre-regulator for the audio op-amps, inductors 4 x 4 x 2"}
    - {name: usba_sw, groups: [usba_sw], side: front, height_mm: 1.0, source: "2 USB-A current-limit switches SOT-23-6 + BC1.2 charge-port controller"}
    - {name: pd_src1, groups: [pd_src1], side: front, height_mm: 4.0, source: "PD source controller + 20 V -> 5/9 V sync buck + VBUS FET, inductor ~7 x 7 x 4"}
    - {name: pd_src2, groups: [pd_src2], side: front, height_mm: 4.0, source: "same as pd_src1"}
    # front ports and hub
    - {name: usba1, refs: [J321], height_mm: 7.0, source: "HC-ST-003-01-Z USB 3.0 A right angle, height class 6.5-7.55 (B2, unverified)"}
    - {name: usba2, refs: [J322], height_mm: 7.0, source: "same as usba1"}
    - {name: usba_esd, groups: [usb_a], height_mm: 0.6, source: "TPD4E02B04 + PUSB3FR4Z arrays at the USB-A pins"}
    - {name: hub1, groups: [hub1], height_mm: 1.0, source: "GL3523 QFN-76 + 25 MHz crystal + 1.2 V DC-DC L (NR3015 1.5 mm) + AC caps"}
    - {name: hub2, groups: [hub2], height_mm: 1.0, source: "same, cascaded on hub1 DS4"}
    - {name: usbc1, refs: [J311], height_mm: 3.3, source: "HCTL USB-C 24P mid-mount (provisional footprint, B1)"}
    - {name: usbc2, refs: [J312], height_mm: 3.3, source: "same"}
    - {name: usbc_mux, groups: [usb_c], height_mm: 1.0, source: "2 x HD3SS3212 + SS/D ESD arrays"}
  # stage-2 placeholder nets removed: every item is real parts now, the real nets drive the estimate

nets:
  # rails (5V_SYS and 3V3_D are made by pass B; VBUS_HOST enters from the host cable)
  GND: {class: ground}
  5V_SYS: {class: power, current_a: 4.0}   # pass B: PD mode 2 x 1.5 A USB-A + internal ~0.8 A
  # IC-local rails carry no class power: its 0.4 mm floor (board power_track_mm) cannot enter the 0.4 mm-pitch QFN
  # pads (check: 14 necks at U101); they get pours/vias in layout. current_a from the load where known.
  # external_supply on inductor/FET/resistor-fed rails: their source pin is passive (no power_out in the symbol)
  3V3_D: {current_a: 0.3, external_supply: true}   # U830 SW -> L830 (passive);  pass B sets the rail; RP2040 21 mA max + hub muxes, bridge 3.3 V side
  # USB-C VBUS: the 0.5 mm-pitch receptacle pads take <= 0.33 mm; pass B sizes the copper with budgets (L1, L2)
  VBUS_HOST: {external_supply: true}
  # VBUS_C1/C2/PDIN_VBUS: no current_a (3 A -> 1.4 mm IPC width cannot leave the 0.5 mm-pitch receptacle pads);
  # their copper comes from the copper_r budgets L2_vbus_c1/c2 and L4_pd_input (3 A / 3.19 A), which set the width
  VBUS_C1: {}
  VBUS_C2: {}
  VBUS_A1: {class: power, current_a: 1.5}
  VBUS_A2: {class: power, current_a: 1.5}
  HUB1_5V: {current_a: 0.5, external_supply: true}   # from 5V_SYS via FB101 (passive bead); no class power (0.4 mm QFN)
  HUB2_5V: {current_a: 0.5, external_supply: true}   # from 5V_SYS via FB151
  HUB1_1V2: {current_a: 0.5, external_supply: true}   # hub SW -> L101 (passive);               # 599 mW at 1.2 V with 4 SS ports (gl3523.md, p.39)
  HUB1_3V3: {current_a: 0.25}                # internal LDO, 250 mA max
  HUB1_SW: {class: switching, current_a: 0.5}
  HUB1_XI: {class: clock}
  HUB1_XO: {class: clock}
  HUB2_1V2: {current_a: 0.5, external_supply: true}
  HUB2_3V3: {current_a: 0.25}
  HUB2_SW: {class: switching, current_a: 0.5}
  HUB2_XI: {class: clock}
  HUB2_XO: {class: clock}
  MCU_1V1: {current_a: 0.05}
  MCU_XIN: {class: clock}
  MCU_XOUT: {class: clock}
  MCU_XOUT_X: {class: clock}
  # interface nets completed by pass B (power/PD) and pass C (audio)
  CC1_C1: {class: signal, allow_single: true}
  CC2_C1: {class: signal, allow_single: true}
  CC1_C2: {class: signal, allow_single: true}
  CC2_C2: {class: signal, allow_single: true}
  C1_ORIENT: {class: signal, allow_single: true}
  C2_ORIENT: {class: signal, allow_single: true}
  HUB1_PWREN1: {class: signal, allow_single: true}
