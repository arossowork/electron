    # stage 5: PD adapter plug / unplug control (kpm 0 = connected, 1 = plug ramp 0 -> 20 V at 100-102 ms
    # (10 V/ms), 2 = unplug (cable opens at ~101 ms), 3 = C1 sink detach (Rd removed at ~101 ms))
