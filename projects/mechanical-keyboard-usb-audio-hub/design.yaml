      temps: [25, 40]
      realism: "who: user, multi-driver IEM on the output; test: 1 mA AC into the jack tip, DAC at silence, no load; limits: R32 |Zout| <= 1 ohm incl. 0.47 ohm series, 10 k detect resistor and TVS"
      measures:
        - {"name": "hp_zout_max", "expr": "m_zmax", "scale": 1000, "min": 0.0, "max": 1.0, "unit": "ohm", "req": "R32"}
    # ==== STAGE 5 AUDIO ANALYSES (notes/circuit.md "Stage 5 fixes, audio")
    - name: mic_fs_min
      cmd: "option gmin=1e-9\noption klu\nalter vsigmic dc=1.513\ntran 2u 6m 0 2u\nmeas tran m_tip pp v(mic_t) from=3m to=6m\nmeas tran m_adc rms v(madc) from=3m to=6m"
      temps: [0, 40]
      realism: "who: user, loud source at the mic jack (1 Vrms full scale at minimum gain, R11), sustained; how often: occasional (loud speech close to a capsule, line-level device); timing: steady state; limits: R11 full scale with >= 0.5 V from each U980 rail (ADC_4V5, MIC_VN); OPA1612 supply 4.5-36 V total [V], swing 0.6 V from the rails at 2 k [V]"
      measures:
        - {"name": "dbg_mic_tip_vrms_min", "expr": "m_tip/2.8284", "unit": "Vrms"}
        - {"name": "dbg_mic_adc_vrms_min", "expr": "m_adc", "unit": "Vrms"}
        - {"name": "dbg_mic_pa_pk_min", "expr": "vecmax(v(MIC_PA))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pb_pk_min", "expr": "vecmax(v(MIC_PB))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pa_lo_min", "expr": "vecmin(v(MIC_PA))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pb_lo_min", "expr": "vecmin(v(MIC_PB))", "unit": "V", "debug": true}
        - {"name": "mic_head_pos_min", "expr": "vecmin(v(ADC_4V5))-(dbg_mic_pa_pk_min+dbg_mic_pb_pk_min+abs(dbg_mic_pa_pk_min-dbg_mic_pb_pk_min))/2", "min": 0.5, "unit": "V", "req": "R11"}
        - {"name": "mic_head_neg_min", "expr": "(dbg_mic_pa_lo_min+dbg_mic_pb_lo_min-abs(dbg_mic_pa_lo_min-dbg_mic_pb_lo_min))/2-vecmax(v(MIC_VN))", "min": 0.5, "unit": "V", "req": "R11"}
        - {"name": "mic_supply_min", "expr": "vecmin(v(ADC_4V5)-v(MIC_VN))", "min": 4.5, "unit": "V", "req": "R11"}
    - name: mic_fs_max
      cmd: "option gmin=1e-9\noption klu\nalter vmicg dc=3.3\nalter vsigmic dc=0.01513\ntran 2u 6m 0 2u\nmeas tran m_tip pp v(mic_t) from=3m to=6m\nmeas tran m_adc rms v(madc) from=3m to=6m"
      temps: [0, 40]
      realism: "who: user, 10 mVrms full scale at maximum gain (R11 +40 dB setting), sustained; how often: every recording at high gain near full scale; limits: R11 full scale with >= 0.5 V from each U980 rail"
      measures:
        - {"name": "dbg_mic_tip_vrms_max", "expr": "m_tip/2.8284", "unit": "Vrms"}
        - {"name": "dbg_mic_adc_vrms_max", "expr": "m_adc", "unit": "Vrms"}
        - {"name": "dbg_mic_pa_pk_max", "expr": "vecmax(v(MIC_PA))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pb_pk_max", "expr": "vecmax(v(MIC_PB))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pa_lo_max", "expr": "vecmin(v(MIC_PA))", "unit": "V", "debug": true}
        - {"name": "dbg_mic_pb_lo_max", "expr": "vecmin(v(MIC_PB))", "unit": "V", "debug": true}
        - {"name": "mic_head_pos_max", "expr": "vecmin(v(ADC_4V5))-(dbg_mic_pa_pk_max+dbg_mic_pb_pk_max+abs(dbg_mic_pa_pk_max-dbg_mic_pb_pk_max))/2", "min": 0.5, "unit": "V", "req": "R11"}
        - {"name": "mic_head_neg_max", "expr": "(dbg_mic_pa_lo_max+dbg_mic_pb_lo_max-abs(dbg_mic_pa_lo_max-dbg_mic_pb_lo_max))/2-vecmax(v(MIC_VN))", "min": 0.5, "unit": "V", "req": "R11"}
    - name: hp_thump
      cmd: "option gmin=1e-9\noption klu\nalter vkthmp dc=1\nalter rlk910 = 303k\nalter cc910 = 396u\nalter cc911 = 264u\nalter @grdlp[gain]=2.2297e-3\nalter @grdln[gain]=3.0166e-3\ntran 1m 1.4 0 1m\nmeas tran m_thx max v(hp_l) from=1.3 to=1.4\nmeas tran m_thn min v(hp_l) from=1.3 to=1.4\nmeas tran m_mux max v(hp_l) from=0 to=1.29\nmeas tran m_mun min v(hp_l) from=0 to=1.29\nmeas tran m_nmx max v(ds_lo) from=0 to=1.3\nmeas tran m_nmn min v(ds_lo) from=0 to=1.3\nmeas tran m_rel find v(ds_lo) at=1.3\nmeas tran m_end find v(hp_l) at=1.4"
      temps: [25]
      monte_carlo: false
      realism: "who: user, headphones (32 ohm) on while the board powers up or the firmware enables the DAC (CHIP_EN); how often: every power-up / enumeration; timing: DAC bias steps 0 -> AVCC/2 in 10 us at 1 ms, firmware releases AUDIO_MUTE at 1.3 s (>= 1.3 s after DAC_EN, firmware rule); worst mismatch: Rdac +15 % / -15 % (ES9039Q2M p.21) and DC blocks +20 % / -20 % on the two legs, tantalum leakage 0.01 CV at 6.3 V (303 k) on one leg only; limit: 10 mVpk at the jack after the release (design-review target, no requirement covers pops: debug probe, notes/circuit.md)"
      measures:
        - {"name": "dbg_thump_mvpk", "expr": "(abs(m_thx)+abs(m_thn)+abs(abs(m_thx)-abs(m_thn)))/2*1e3", "unit": "mVpk"}
        - {"name": "dbg_thump_muted_mvpk", "expr": "(abs(m_mux)+abs(m_mun)+abs(abs(m_mux)-abs(m_mun)))/2*1e3", "unit": "mVpk"}
        - {"name": "dbg_thump_unmuted_mvpk", "expr": "(abs(m_nmx)+abs(m_nmn)+abs(abs(m_nmx)-abs(m_nmn)))/2*1e3", "unit": "mVpk"}
        - {"name": "dbg_thump_residual_mv", "expr": "m_rel*1e3", "unit": "mV"}
        - {"name": "dbg_thump_end_mv", "expr": "m_end*1e3", "unit": "mV"}
