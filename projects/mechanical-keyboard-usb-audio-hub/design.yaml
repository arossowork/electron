    # AUDIO_MUTE: XU316 GPIO (100 ohm output class); low = play. hp_thump: high until trel, 1 ms edge
    - {"line": "BAMUTE amute_s 0 V = 3.3*v(kthmp)*min(1,max(0,(v(trel)+1m-time)/1m))"}
    - {"line": "RAMUTE amute_s $(AUDIO_MUTE) 100"}
