# ==== PASS B SIM BEGIN (tools/gen_pass_b.py)
sim:
  ambient_c: 40
  # Solver per analysis. The board transients (pd_*, bus_*: tran uic from 0) run on SPARSE 1.3 (KLU stalls on their
  # first step, timestep too small at ivs_ln). The op-based audio analyses (op, ac, tran after op) start with
  # `option klu`: SPARSE lost its pivots there ("Pivot for step not found") and the op landed on a false solution
  # in 2-12 % of the MC runs; KLU converged on every tested failing run. KLU has no noise analysis, so the noise runs
  # use `option sparse`. KLU AC does not apply rshunt, so nets that only a coupling cap / series R joins to another
  # non-simulated pin get explicit 1e9 ohm paths below (RFL*).
  # method=gear: the board start-up transient is stiff (330 uF / 400 uF audio caps charging into op-amp models whose
  # rails are still rising); trapezoidal integration stalled 6-10 % of the bus_* MC runs (timestep too small at
  # mic_gain / ivs_ln at 7-12 ms), Gear converged on every tested failing run.
  options: ["rshunt=1e9", "itl1=1000", "method=gear"]
  # derating audit op (ammeter on every pin): KLU, as the other op-based runs (SPARSE gave a false op: U910 17 kW)
  derating_cmd: "option gmin=1e-9\noption klu\nop"
  sources:
    # ---- sim-only DC paths (testbench, not in the BOM): 1e9 ohm on nets that only an AC-coupling cap or a series
    # resistor joins to another non-simulated pin (hub SuperSpeed caps, RP2040 USB/QSPI series R, XU316 I2S / MCLK)
    - {"line": "RFLA131 $(C131.1) 0 1e9"}
    - {"line": "RFLB131 $(C131.2) 0 1e9"}
    - {"line": "RFLA132 $(C132.1) 0 1e9"}
    - {"line": "RFLB132 $(C132.2) 0 1e9"}
    - {"line": "RFLA133 $(C133.1) 0 1e9"}
    - {"line": "RFLB133 $(C133.2) 0 1e9"}
    - {"line": "RFLA134 $(C134.1) 0 1e9"}
    - {"line": "RFLB134 $(C134.2) 0 1e9"}
    - {"line": "RFLA135 $(C135.1) 0 1e9"}
    - {"line": "RFLB135 $(C135.2) 0 1e9"}
    - {"line": "RFLA136 $(C136.1) 0 1e9"}
    - {"line": "RFLB136 $(C136.2) 0 1e9"}
    - {"line": "RFLA137 $(C137.1) 0 1e9"}
    - {"line": "RFLB137 $(C137.2) 0 1e9"}
    - {"line": "RFLA138 $(C138.1) 0 1e9"}
    - {"line": "RFLB138 $(C138.2) 0 1e9"}
    - {"line": "RFLA139 $(C139.1) 0 1e9"}
    - {"line": "RFLB139 $(C139.2) 0 1e9"}
    - {"line": "RFLA140 $(C140.1) 0 1e9"}
    - {"line": "RFLB140 $(C140.2) 0 1e9"}
    - {"line": "RFLA181 $(C181.1) 0 1e9"}
    - {"line": "RFLB181 $(C181.2) 0 1e9"}
    - {"line": "RFLA182 $(C182.1) 0 1e9"}
    - {"line": "RFLB182 $(C182.2) 0 1e9"}
    - {"line": "RFLA183 $(C183.1) 0 1e9"}
    - {"line": "RFLB183 $(C183.2) 0 1e9"}
    - {"line": "RFLA184 $(C184.1) 0 1e9"}
    - {"line": "RFLB184 $(C184.2) 0 1e9"}
    - {"line": "RFLA402 $(R402.1) 0 1e9"}
