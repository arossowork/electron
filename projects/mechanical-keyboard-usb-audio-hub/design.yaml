    # ==== PASS C ANALYSES BEGIN (tools/gen_pass_c.py)
    # R22 coupled noise (all pass C noise analyses): AC transfer method. The coupled generators are linear, white
    # in 20 Hz - 20 kHz, so coupled_rms = V_gen,rms x sqrt(mean over a linear 20 Hz - 20 kHz sweep of |H_A(f)|^2)
    # (H_A: generator -> A-weighted output). Host VBUS 0.1 Vrms on vbn, ground drop 0.5 mVrms on gdn, RSS (R22
    # acceptance). The earlier method (E gain 1.7e5..1.7e9 on a resistor's thermal noise) put that gain in the
    # operating point matrix: SPARSE lost its pivots and the op landed on a false solution (hp_total_32 142.9 uV).
    # Noise runs switch to SPARSE (`option sparse`: KLU has no noise analysis); their op has the generators at 0.
    - name: hp_noise_32
      cmd: "option gmin=1e-9\noption sparse\nalter vmic ac=1\nnoise v(haw) iaclp dec 40 20 20k"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user, headphones (32 ohm) on, maximum analog gain (fixed), digital silence; how often: every listening session; limits: R10 intrinsic <= sqrt(1.0^2 - coupled_worst^2) uVrms (notes/noise-allocation.md, re-allocation of the C11 0.944 / 0.33 split from the simulated coupled noise); DAC noise 1.016e-11 A/rtHz per pin from DNR 130 dB re 10 Vrms (datasheet p.54, notes/datasheets/es9039q2m.md: 0.60 uV at Rf 374)"
      measures:
        - {"name": "hp_intrinsic_32", "plot": "noise2", "expr": "onoise_total*1e6", "max": 0.9999, "unit": "uVrms", "req": "R10"}
    - name: hp_total_32
      cmd: "option gmin=1e-9\noption sparse\nnoise v(haw) iaclp dec 40 20 20k\noption klu\nalter iaclp ac=0\nalter iacln ac=0\nalter evbn gain=1\nalter vvbn ac=1\nac lin 1000 20 20k\nlet hv = 0.1*sqrt(mean(mag(v(haw))^2))\nalter vvbn ac=0\nalter evbn gain=0\nalter egdn gain=1\nalter vgdn ac=1\nac lin 1000 20 20k\nlet hg = 5e-4*sqrt(mean(mag(v(haw))^2))"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user and environment, as hp_noise_32 plus the R22 coupled generators (host VBUS 100 mV rms audio band on every audio supply entry, 0.5 mV rms ground drop), AC transfer method, RSS with the intrinsic noise; limits: R10 1.0 uVrms A-wtd total"
      measures:
        - {"name": "dbg_hp_cpl_vbus_32", "plot": "ac2", "expr": "hv*1e6", "unit": "uVrms"}
        - {"name": "dbg_hp_cpl_gnd_32", "plot": "ac3", "expr": "hg*1e6", "unit": "uVrms"}
        - {"name": "hp_total_32", "plot": "ac3", "expr": "sqrt((noise2.onoise_total*1e6)^2+(ac2.hv*1e6)^2+(hg*1e6)^2)", "max": 1.0, "unit": "uVrms", "req": "R10,R22"}
    - name: hp_noise_300
      cmd: "option gmin=1e-9\noption sparse\nalter rll = 300\nnoise v(haw) iaclp dec 40 20 20k"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user, 300 ohm headphones, digital silence; limits as hp_noise_32"
      measures:
        - {"name": "hp_intrinsic_300", "plot": "noise2", "expr": "onoise_total*1e6", "max": 0.9999, "unit": "uVrms", "req": "R10"}
    - name: hp_total_300
      cmd: "option gmin=1e-9\noption sparse\nalter rll = 300\nnoise v(haw) iaclp dec 40 20 20k\noption klu\nalter iaclp ac=0\nalter iacln ac=0\nalter evbn gain=1\nalter vvbn ac=1\nac lin 1000 20 20k\nlet hv = 0.1*sqrt(mean(mag(v(haw))^2))\nalter vvbn ac=0\nalter evbn gain=0\nalter egdn gain=1\nalter vgdn ac=1\nac lin 1000 20 20k\nlet hg = 5e-4*sqrt(mean(mag(v(haw))^2))"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user and environment, 300 ohm headphones with the R22 generators on (AC transfer method, RSS); limits: R10 1.0 uVrms total"
      measures:
        - {"name": "hp_total_300", "plot": "ac3", "expr": "sqrt((noise2.onoise_total*1e6)^2+(ac2.hv*1e6)^2+(hg*1e6)^2)", "max": 1.0, "unit": "uVrms", "req": "R10,R22"}
    - name: r22_coupled
      cmd: "option gmin=1e-9\noption klu\nalter iaclp ac=0\nalter iacln ac=0\nalter vmic ac=1\nac lin 1 1k 1k\nlet gmic = mag(v(madc)/v(ms))\nalter vmic ac=0\nalter evbn gain=1\nalter vvbn ac=1\nac lin 1000 20 20k\nlet hv = 0.1*sqrt(mean(mag(v(haw))^2))\nlet mv = 0.1*sqrt(mean(mag(v(maw))^2))\nalter vvbn ac=0\nalter evbn gain=0\nalter egdn gain=1\nalter vgdn ac=1\nac lin 1000 20 20k\nlet hg = 5e-4*sqrt(mean(mag(v(haw))^2))\nlet mg = 5e-4*sqrt(mean(mag(v(maw))^2))"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: environment, host VBUS audio-band noise 100 mV rms (R22) on every audio supply entry (5V_SYS -> 3V3_A LDO, TPS65131 outputs -> +-4.5 V and ADC LDOs: the TPS65131 fit has no line transfer, so 0 dB rejection is assumed) plus a ground drop 0.5 mV rms (0.5 mohm shared plane square x 1 A audio-band charge swing, C11; post-layout Z replaces it); how often: always in bus mode; method: AC transfer, coupled_rms = V_gen x sqrt(mean |H_A|^2) over a 1000-point linear 20 Hz - 20 kHz sweep, RSS of the two generators; mic referred to the input with the 1 kHz gain from the 150 ohm source"
      measures:
        - {"name": "hp_coupled", "plot": "ac3", "expr": "sqrt(ac2.hv^2+hg^2)*1e6", "max": 0.33, "unit": "uVrms", "req": "R22"}
        - {"name": "mic_coupled_min_gain", "plot": "ac3", "expr": "sqrt(ac2.mv^2+mg^2)*1e6/ac1.gmic", "max": 0.33, "unit": "uVrms", "req": "R22"}
    - name: r22_tones
      cmd: "option gmin=1e-9\noption klu\nalter iaclp ac=0\nalter iacln ac=0\nalter evbn gain=1\nalter vvbn ac=1\nac lin 13 400k 1.6meg\nmeas ac m_t400 find vm(hp_l) at=400k\nmeas ac m_t1m4 find vm(hp_l) at=1.4meg"
      temps: [25]
      monte_carlo: false
      realism: "who: environment, converter ripple tones: LM61460 5V_SYS 400 kHz, TPS62933 3V3_D 1.2 MHz (no modelled analog path: DAC/ADC AVDD only), TPS65131 1.38 MHz [E] 20 mVpp on each audio supply entry; out of the 20 Hz-20 kHz band, so they add nothing to the A-weighted R22 figure in a linear simulation; listed for intermodulation awareness"
      measures:
        - {"name": "dbg_tone_400k_uvpk", "expr": "m_t400", "scale": 10000.0, "unit": "uVpk"}
        - {"name": "dbg_tone_1m38_uvpk", "expr": "m_t1m4", "scale": 10000.0, "unit": "uVpk"}
    - name: mic_noise_min
      cmd: "option gmin=1e-9\noption sparse\nalter vmic ac=1\nac lin 1 1k 1k\nlet gmic = mag(v(madc)/v(ms))\nprint gmic\nnoise v(maw) vmic dec 40 20 20k"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user, mic plugged (150 ohm source, 0.5 mA electret), minimum gain (full scale 1 Vrms at the jack), recording; limits: R11 <= 1.0 uVrms A-wtd input-referred; intrinsic <= sqrt(1.0^2 - coupled_worst^2) (notes/noise-allocation.md); ADC 125 dB re 2 Vrms [S] (alldatasheet snippet, datasheet not read: B6)"
      measures:
        - {"name": "dbg_mic_gain_min", "plot": "ac1", "expr": "gmic", "unit": "V/V"}
        - {"name": "mic_in_noise_min", "plot": "noise2", "expr": "onoise_total*1e6/ac1.gmic", "max": 0.9999, "unit": "uVrms", "req": "R11,R33"}
    - name: mic_noise_max
      cmd: "option gmin=1e-9\noption sparse\nalter vmic ac=1\nalter vmicg dc=3.3\nac lin 1 1k 1k\nlet gmic = mag(v(madc)/v(ms))\nlet gtip = mag(v(madc)/v(mic_t))\nprint gmic gtip\nnoise v(maw) vmic dec 40 20 20k"
      temps: [0, 25, 40]
      monte_carlo: false
      realism: "who: user, mic plugged, maximum gain (+40 dB class, 10 mVrms full scale); limits: R11 EIN <= -120 dBV (1.0 uVrms) A-wtd with a 150 ohm source"
      measures:
        - {"name": "mic_gain_max_db", "plot": "ac1", "expr": "db(gtip/2)", "min": 40, "unit": "dB", "req": "R11"}
        - {"name": "dbg_mic_gain_emf_db", "plot": "ac1", "expr": "db(gmic/2)", "unit": "dB"}
        - {"name": "mic_ein_max", "plot": "noise2", "expr": "onoise_total*1e6/ac1.gmic", "max": 1.0, "unit": "uVrms", "req": "R11"}
    - name: mic_bias
      cmd: "option gmin=1e-9\noption klu\nop"
      temps: [0, 40]
      realism: "who: user, electret capsule drawing 0.5 mA through the 2.2 k plug-in power; limits: R33 2.0-3.0 V bias"
      measures:
        - {"name": "bias_source_v", "expr": "v(2V5_BIAS)", "min": 2.0, "max": 3.0, "unit": "V", "req": "R33"}
        - {"name": "dbg_tip_v", "expr": "v(MIC_T)", "unit": "V"}
        - {"name": "dbg_3v3a", "expr": "v(3V3_A)", "unit": "V"}
        - {"name": "dbg_p4v5", "expr": "v(AUD_P4V5)", "unit": "V"}
        - {"name": "dbg_n4v5", "expr": "v(AUD_N4V5)", "unit": "V"}
        - {"name": "dbg_adc4v5", "expr": "v(ADC_4V5)", "unit": "V"}
        - {"name": "dbg_hp_dc_mv", "expr": "v(J930.T)*1e3", "unit": "mV"}
    - name: hp_level_32
      cmd: "option gmin=1e-9\noption klu\nalter rll = 32\nalter rlr = 32\nalter vsigamp dc=3.75m\ntran 0.5u 4m 0 0.5u\nmeas tran m_vl rms v(hp_l) from=2m to=4m\nmeas tran m_vr rms v(hp_r) from=2m to=4m"
      temps: [0, 40]
      realism: "who: user, 0 dBFS 1 kHz sine on both channels into 32 ohm (a test signal; music sits >= 10 dB lower); how often: rare; timing: steady state; limits: R29 >= 1.0 Vrms, >= 0.5 V to each rail, no current limit (OPA1622 +145/-130 mA [V], OPA1612 +-30 mA [V])"
      measures:
        - {"name": "hp_vrms_32", "expr": "m_vl", "min": 1.0, "max": 2.79, "unit": "Vrms", "req": "R29"}
        - {"name": "hp_head_pos_32", "expr": "vecmin(v(AUD_P4V5))-vecmax(v(HPA_L))", "min": 0.5, "unit": "V", "req": "R29"}
        - {"name": "hp_head_neg_32", "expr": "vecmin(v(HPA_L))-vecmax(v(AUD_N4V5))", "min": 0.5, "unit": "V", "req": "R29"}
        - {"name": "hp_ipk_32", "expr": "vecmax(abs(v(HPA_L)-v(J930.T)))/0.47*1e3", "max": 130, "unit": "mA", "req": "R29"}
        - {"name": "iv_ipk_32", "expr": "vecmax(abs((v(IV_LP)-v(DS_LM))/100+(v(IV_LP)-v(IVS_LP))/383))*1e3", "max": 30, "unit": "mA", "req": "R29"}
        - {"name": "dbg_p4v5_min_32", "expr": "vecmin(v(AUD_P4V5))", "unit": "V"}
        - {"name": "dbg_vrms_r_32", "expr": "m_vr", "unit": "Vrms"}
    - name: hp_level_300
      cmd: "option gmin=1e-9\noption klu\nalter rll = 300\nalter rlr = 300\nalter vsigamp dc=3.75m\ntran 0.5u 4m 0 0.5u\nmeas tran m_vl rms v(hp_l) from=2m to=4m\nmeas tran m_vr rms v(hp_r) from=2m to=4m"
      temps: [0, 40]
      realism: "who: user, 0 dBFS 1 kHz sine on both channels into 300 ohm (a test signal; music sits >= 10 dB lower); how often: rare; timing: steady state; limits: R29 >= 2.0 Vrms, >= 0.5 V to each rail, no current limit (OPA1622 +145/-130 mA [V], OPA1612 +-30 mA [V])"
      measures:
        - {"name": "hp_vrms_300", "expr": "m_vl", "min": 2.0, "max": 2.79, "unit": "Vrms", "req": "R29"}
        - {"name": "hp_head_pos_300", "expr": "vecmin(v(AUD_P4V5))-vecmax(v(HPA_L))", "min": 0.5, "unit": "V", "req": "R29"}
        - {"name": "hp_head_neg_300", "expr": "vecmin(v(HPA_L))-vecmax(v(AUD_N4V5))", "min": 0.5, "unit": "V", "req": "R29"}
        - {"name": "hp_ipk_300", "expr": "vecmax(abs(v(HPA_L)-v(J930.T)))/0.47*1e3", "max": 130, "unit": "mA", "req": "R29"}
        - {"name": "iv_ipk_300", "expr": "vecmax(abs((v(IV_LP)-v(DS_LM))/100+(v(IV_LP)-v(IVS_LP))/383))*1e3", "max": 30, "unit": "mA", "req": "R29"}
        - {"name": "dbg_p4v5_min_300", "expr": "vecmin(v(AUD_P4V5))", "unit": "V"}
        - {"name": "dbg_vrms_r_300", "expr": "m_vr", "unit": "Vrms"}
    - name: hp_response_32
      cmd: "option gmin=1e-9\noption klu\nalter rll = 32\nac dec 100 20 20k\nmeas ac m_g1k find vdb(hp_l) at=1k\nmeas ac m_rmax max vdb(hp_l) from=20 to=20k\nmeas ac m_rmin min vdb(hp_l) from=20 to=20k"
      temps: [25, 40]
      realism: "who: user, 32 ohm headphones, 48 / 96 kHz streams (the analog chain is the same at both rates); limits: R31 +-0.1 dB minus the DAC filter ripple 0.0031 dB (ES9039Q2M p.35, worst listed filter): +-0.0969 dB"
      measures:
        - {"name": "dbg_g1k_32", "expr": "m_g1k", "unit": "dB"}
        - {"name": "resp_max_32", "expr": "m_rmax", "unit": "dB", "debug": true}
        - {"name": "resp_min_32", "expr": "m_rmin", "unit": "dB", "debug": true}
        - {"name": "resp_hi_32", "expr": "resp_max_32-dbg_g1k_32", "max": 0.0969, "unit": "dB", "req": "R31"}
        - {"name": "resp_lo_32", "expr": "resp_min_32-dbg_g1k_32", "min": -0.0969, "unit": "dB", "req": "R31"}
    - name: hp_response_300
      cmd: "option gmin=1e-9\noption klu\nalter rll = 300\nac dec 100 20 20k\nmeas ac m_g1k find vdb(hp_l) at=1k\nmeas ac m_rmax max vdb(hp_l) from=20 to=20k\nmeas ac m_rmin min vdb(hp_l) from=20 to=20k"
      temps: [25, 40]
      realism: "who: user, 300 ohm headphones, 48 / 96 kHz streams (the analog chain is the same at both rates); limits: R31 +-0.1 dB minus the DAC filter ripple 0.0031 dB (ES9039Q2M p.35, worst listed filter): +-0.0969 dB"
      measures:
