    group: power
  # C21: gate-source cap of M1/M2/M3 (100 nF >> Crss ~0.1 nF): a reversed insertion steps the drains by -6 V;
  # without C21 the Miller charge pulls the gates about 1.5 V below the source and the guard turns on
  C21:
    value: 100n
    symbol: Device:C
    footprint: Capacitor_SMD:C_0402_1005Metric
    price_usd: 0.002
    pins: {"1": VBAT_EN, "2": VBAT_P}
    voltage_rating_v: 16
    group: power
  # M4 + R41 + C23: R35 lithium limiter (PM D4, 2026-10-22: the AO3413 guard body diodes drop only 0.22-0.30 V at uA,
  # so VBAT_P reaches 3.41-3.49 V with 3.7 V lithium cells and +3V3 follows it). M4 (AO3413, drain on VBAT_P, source on
  # VIN_BST) sits between C1/C2 and the boost input (C3, L1, U2 IN/EN), outside the R4 path (BT1.1 -> C1.1). Guard OFF
  # (sleep, lithium wakes, reset, dead board): the boost is fed through the M4 body diode as well, VIN_BST = VBAT_RAW -
  # 2 body-diode drops (3.08-3.24 V at 3.7 V, 0-45 C), below the 3.389 V ULPM level. Guard ON (alkaline wakes, rule 8):
  # M4 is ON too (same VBAT_EN; gate at VIN_BST x R41 / (R41 + R42) = 0.09 x VIN_BST). R42 1 M and C23 10 nF from the gate
  # to the M4 source (VIN_BST), R41 100 k from VBAT_EN: tau 0.9 ms keeps M4 OFF during the 50 us rule-8 read (a direct gate
  # would connect C1/C2, 3.45-3.52 V on lithium, to IN and lift +3V3 above 3.45 V); with IO2 hi-Z the gate sits above the
  # source (OFF). Gate referenced to its own source like M1/M2 (R14/C21): with C23/R42 to VBAT_P the DC point did not
  # converge in 30-60 % of the MC runs. Cost 0.098 USD (R35 <= 0.3).
  M4:
    value: AO3413
    mpn: AO3413
    lcsc: C86648
    price_usd: 0.092
    datasheet: https://www.aosmd.com/res/datasheets/AO3413.pdf
