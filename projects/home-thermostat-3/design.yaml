sim:
  options: ["rshunt=1e12", "itl1=1000", "itl4=100"]
  sources:
    # initial guess for the operating point (the averaged boost has a hard current limit; Newton needs a start):
    # the default 2.4 V state with the guard OFF (VBAT_P one body diode, VIN_BST two body diodes below the cells)
    - {line: ".nodeset v(VBAT_RAW)=2.4 v(VBAT_P)=2.1 v(VIN_BST)=1.85 v(+3V3)=3.3 v(SW_BOOST)=1.85"}
    # two AAA cells at the holder pads, series resistance VRS (ohm) as a behavioral conductance;
    # VCONN = 0 removes the cells (open holder)
    - {name: VBAT, p: tb_vs, n: GND, value: "DC 2.4 PULSE(2.4 2.4 0 1u 1u 1000 2000)"}
    - {line: "VRS tb_rs 0 DC 1"}
    - {line: "VCONN tb_conn 0 DC 1 PULSE(1 1 0 1u 1u 1000 2000)"}
    - {line: "BSRC tb_vs $(BT1.1) I = v(tb_vs,$(BT1.1))*(v(tb_conn)+1e-9)/v(tb_rs)"}
    # C1+C2 leakage: 2 uA at 2.6 V for 2 x 3300 uF (assumed, architecture.md section 4; bench check, parts.md 7.14)
    - {name: RLEAKC1, p: VBAT_P, n: GND, value: 1.3meg}
    # ESP32 active current (control wake, Wi-Fi burst) on +3V3; off by default
    - {line: "IBURST $(U1.3) 0 DC 0 PULSE(0 0 1m 10u 10u 5m 1000)"}
    # ESP32 light sleep while C1+C2 recharge at the start of a wake (130 uA, ESP32-C3 datasheet light-sleep
    # figure, recall, unverified); off by default
    - {line: "ILSLP $(U1.3) 0 DC 0 PULSE(0 0 1m 10u 10u 5m 1000)"}
    # ESP32 light sleep while the ADS1115 converts (130 uA, same figure), on the probe-read wakes only (PM D17); off by default
    - {line: "ILSLP2 $(U1.3) 0 DC 0 PULSE(0 0 1m 10u 10u 5m 1000)"}
    # test load on VBAT_P for the guard drop (R4)
    - {line: "VITEST tb_itest 0 DC 0"}
    - {line: "BTEST $(VBAT_P) 0 I = v(tb_itest)*0.5*(1+tanh((v(VBAT_P)-1)/0.1))"}
    # NTC probes on J2 with 2 m cable (2 x 2 m x 0.125 ohm/m = 0.5 ohm)
    - {name: RCAB1, p: J2.1, n: tb_n1, value: 0.5}
    - {name: RNTC1, p: tb_n1, n: J2.2, value: 10k}
    - {name: RCAB2, p: J2.3, n: tb_n2, value: 0.5}
    - {name: RNTC2, p: tb_n2, n: J2.4, value: 10k}
    # ESP32 GPIO drivers (25 ohm), controls tb_ioN 0/1, off (hi-Z) by default
    - {line: "VIO4 tb_io4 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO4 $(+3V3) $(SENS_EN) I = v(+3V3,SENS_EN)*v(tb_io4)/25"}
    # IO2 (VBAT_EN: guard M1/M2 and divider switch M3, active low): tb_io2 or tb_io2b = 1 drives it low
    # (guard ON), tb_io2h = 1 drives it high to +3V3 (fast turn-off); all 0 = hi-Z, R14 holds the guard OFF
    - {line: "VIO2 tb_io2 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "VIO2B tb_io2b 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "VIO2H tb_io2h 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO2 $(VBAT_EN) 0 I = v(VBAT_EN)*(v(tb_io2)+v(tb_io2b))/25"}
    - {line: "BIO2H $(+3V3) $(VBAT_EN) I = v(+3V3,VBAT_EN)*v(tb_io2h)/25"}
    - {line: "VIO7 tb_io7 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO7 $(+3V3) $(K1_IN1) I = v(+3V3,K1_IN1)*v(tb_io7)/25"}
    - {line: "VIO10 tb_io10 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO10 $(+3V3) $(K1_IN2) I = v(+3V3,K1_IN2)*v(tb_io10)/25"}
    - {line: "VIO20 tb_io20 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO20 $(+3V3) $(K2_IN1) I = v(+3V3,K2_IN1)*v(tb_io20)/25"}
    - {line: "VIO21 tb_io21 0 DC 0 PULSE(0 0 0 1u 1u 1000 2000)"}
    - {line: "BIO21 $(+3V3) $(K2_IN2) I = v(+3V3,K2_IN2)*v(tb_io21)/25"}
    # coil voltages (meas cannot take v(a,b)) and rail power into each coil (W): rail voltage x coil current
    # (coil 40.5 ohm in models/thermo.lib)
    - {line: "BVK1 tb_vk1 0 V = v(K1_COIL_A,K1_COIL_B)"}
    - {line: "BVK2 tb_vk2 0 V = v(K2_COIL_A,K2_COIL_B)"}
    - {line: "BVK1R tb_vk1r 0 V = v(K1_COIL_B,K1_COIL_A)"}
    - {line: "BVK2R tb_vk2r 0 V = v(K2_COIL_B,K2_COIL_A)"}
    - {line: "BPK1 tb_pk1 0 V = v(U1.3)*v(tb_vk1)/40.5"}
    - {line: "BPK2 tb_pk2 0 V = v(U1.3)*v(tb_vk2)/40.5"}
    # power in one guard FET during a reversed insertion (M1 = M2, current shared equally): Vsd x I / 2 (W)
    - {line: "BPFET tb_pfet 0 V = v(VBAT_P,VBAT_RAW)*i(vbat)*0.5"}
    - {line: "BVDS tb_vds 0 V = v(VBAT_RAW,VBAT_P)"}
    # I^2 in one guard FET (M1 = M2, current shared equally), for I2t: (I/2)^2 (A^2)
    - {line: "BI2FET tb_i2fet 0 V = (i(vbat)*0.5)*(i(vbat)*0.5)"}
    # ---- switching-level ULPM testbench (isolated, idle unless VTBSEL = 1), delta review 2026-10-22 finding 1.
    # MAX17227A ULPM pulse with VIN near VOUT: VIN = v(VIN_BST) (U2 IN) of the main circuit (ideal copy, no load on it);
    # L1 1 uH + DCR 57 mOhm; low side 50 mOhm (RDS_L typ), on until the inductor current reaches VIN x tON(VIN) / L
    # (= on-time tON(VIN) = 86.7 ns + 640 ns.V / VIN, fit to tON_1.2V / tON_3.0V); synchronous rectifier as an ideal
    # diode + 95 mOhm (RDS_H typ), no early zero-crossing turn-off (more charge, conservative); comparator at the
    # ULPM level VTBVTH: a pulse starts when OUT < VTBVTH (the data sheet: LX stops switching when OUT exceeds the
    # level). COUT = C4 + C5 + C22 effective at 3.4 V (3 x 26.3 = 78.9 uF, Samsung DC-bias curve; C22 PM D1) + ESR 1 mOhm (3 x 3 mOhm, assumed);
    # C6 at U1 is left out (conservative). OUT starts 0.5 mV under the level, released at 2 us (VTBPRE).
    - {line: "VTBSEL tb_sel 0 DC 0"}
    - {line: "VTBVTH tb_vth 0 DC 0"}
    - {line: "VTBPRE tb_pre 0 DC 1 PULSE(1 1 0 1n 1n 1000 2000)"}
    - {line: "BTBVIN tb_vin 0 V = v(VIN_BST)*v(tb_sel)"}
    - {line: "BTBPRE 0 tb_out I = (v(tb_vth)-0.5m-v(tb_out))*v(tb_pre)*100"}
    - {line: "RTBDCR tb_vin tb_l1 0.057"}
    - {line: "LTB tb_l1 tb_li 1u"}
    - {line: "VTBIL tb_li tb_lx DC 0"}
    - {line: "CTBLX tb_lx 0 100p"}
    - {line: "BTBLS tb_lx 0 I = v(tb_lx)*v(tb_q)/0.05"}
    - {line: "BTBHS tb_lx tb_out I = 0.5*(v(tb_lx,tb_out)+sqrt(v(tb_lx,tb_out)^2+1e-8))/0.095"}
    - {line: "CTBOUT tb_out tb_oe 78.9u"}
    - {line: "RTBESR tb_oe 0 1m"}
    - {line: "ITBLOAD tb_out 0 DC 0"}
    - {line: "BTBIPK tb_ipk 0 V = v(tb_vin)*(86.7+640/max(v(tb_vin),0.3))*1e-3"}
    - {line: "BTBQX tb_qx 0 V = v(tb_sel)*(1-v(tb_pre))*0.5*(1+tanh(((0.5*(1+tanh((v(tb_vth)-v(tb_out))/0.2m))+v(tb_q))*(1-0.5*(1+tanh((i(vtbil)-v(tb_ipk))/0.005)))-0.5)/0.05))"}
    - {line: "RTBQ tb_qx tb_q 1k"}
    - {line: "CTBQ tb_q 0 1p"}
  analyses:
    # ---------------------------------------------------------------- R3 / R25: Wi-Fi burst
    - name: burst_vbat20
      realism: "who: environment (Wi-Fi TX at end of life); how often: every 60 min Wi-Fi wake, worst at the 2.0 V firmware cut-off (R23, PM round 3); timing: 350 mA for 5 ms (ESP32-C3 datasheet 335 mA at 21 dBm 802.11b), cells through 1 ohm; limits: R3 3.2-3.46 V, ESP32 VDD 3.0-3.6 V (module datasheet Table 6-2); boost MAX17227A typical (peak limit 2.0 A, about 1.6 A average input at VBAT_P 1.5 V)"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        tran 5u 10m
      measures:
        - {name: v3v3_min_b20, meas: "min v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: v3v3_max_b20, meas: "max v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: dbg_vbatp_min_b20, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
    - name: burst_vbat20_corner
      realism: "who: environment, as burst_vbat20, with the MAX17227A at its low corner: VOUT 3.3 V -1 % accuracy (VACC_LPM min) -1 % load regulation (ACCLOAD) = 3.234 V, ULPM offset +1.5 % (min), peak limit 1.8 A (IPK_LX min over temperature), on-time x 1.194 (tON_1.2V 740 / 620 ns), L 0.8 uH (1 uH -20 %), so the average input limit is about 1.2 A at VBAT_P 1.55 V; efficiency 0.85 (max RDS(on) 90 / 160 mOhm, DCR +20 %, 2 % switching: about 0.865, notes/models.md); cells 2.0 V through 1 ohm; 350 mA 5 ms"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        alter @v.xu2.vref[dc] = 3.234
        alter @v.xu2.veffh[dc] = 0.85
        alter @v.xu2.vipk[dc] = 1.8
        alter @v.xu2.vtonk[dc] = 1.194
        alter @v.xu2.vlind[dc] = 0.8
        alter @v.xu2.vofs[dc] = 0.015
        tran 5u 10m
      measures:
        - {name: v3v3_min_b20c, meas: "min v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: dbg_v3v3_pre_b20c, meas: "find v(U1.3) at=0.9m", unit: V}
        - {name: dbg_vbatp_min_b20c, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
        - {name: dbg_vinbst_min_b20c, meas: "min v(VIN_BST) from=0.5m to=10m", unit: V}
    - name: burst_vbat24
      realism: "who: environment; NiMH / mid-life alkaline; how often: every Wi-Fi wake; timing: 350 mA 5 ms"
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.4 2.4 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        tran 5u 10m
      measures:
        - {name: v3v3_min_b24, meas: "min v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: v3v3_max_b24, meas: "max v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: dbg_vbatp_min_b24, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
    - name: burst_vbat18_info
      realism: "information only (debug): below the 2.0 V firmware cut-off (R23), so no user reaches it in operation; 350 mA 5 ms at 1.8 V through 1 ohm with the boost corner, to show the margin left under the cut-off"
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 1.8 1.8 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        alter @v.xu2.vref[dc] = 3.234
        alter @v.xu2.veffh[dc] = 0.85
        alter @v.xu2.vipk[dc] = 1.8
        alter @v.xu2.vtonk[dc] = 1.194
        alter @v.xu2.vlind[dc] = 0.8
        alter @v.xu2.vofs[dc] = 0.015
        tran 5u 10m
      measures:
        - {name: dbg_v3v3_min_b18c, meas: "min v(U1.3) from=0.5m to=10m", unit: V}
        - {name: dbg_vbatp_min_b18c, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
    - name: burst_vbat20_vthmax_info
      realism: "information only (review 2b M1; R3 stays verified at typical values, PM decision 2026-10-22): burst_vbat20_corner (boost low corner, 2.0 V cells, 1 ohm, 350 mA 5 ms) with M1, M2 and M4 at the AO3413 data sheet limits: VGS(th) max -1.0 V (EC table p.2) and RDS(on) max 130 / 100 / 80 mOhm at -1.8 / -2.5 / -4.5 V (EC table): level-1 fit VTO -1.0 V, KP 19.29, RD = RS 32.6 mOhm (gives 130.0 / 99.8 / 80.0 mOhm; notes/circuit.md Review-2b round)"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        alter @v.xu2.vref[dc] = 3.234
        alter @v.xu2.veffh[dc] = 0.85
        alter @v.xu2.vipk[dc] = 1.8
        alter @v.xu2.vtonk[dc] = 1.194
        alter @v.xu2.vlind[dc] = 0.8
        alter @v.xu2.vofs[dc] = 0.015
        altermod m.xm1.m1 vto = -1.0
        altermod m.xm1.m1 kp = 19.29
        altermod m.xm2.m1 vto = -1.0
        altermod m.xm2.m1 kp = 19.29
        altermod m.xm4.m1 vto = -1.0
        altermod m.xm4.m1 kp = 19.29
        alter @r.xm1.rd[resistance] = 0.0326
        alter @r.xm1.rs[resistance] = 0.0326
        alter @r.xm2.rd[resistance] = 0.0326
        alter @r.xm2.rs[resistance] = 0.0326
        alter @r.xm4.rd[resistance] = 0.0326
        alter @r.xm4.rs[resistance] = 0.0326
        tran 5u 10m
      measures:
        - {name: dbg_v3v3_min_b20v, meas: "min v(U1.3) from=0.5m to=10m", unit: V}
        - {name: dbg_vbatp_min_b20v, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
        - {name: dbg_vinbst_min_b20v, meas: "min v(VIN_BST) from=0.5m to=10m", unit: V}
        - {name: dbg_vbstg_b20v, meas: "find v(VBST_G) at=6.01m", unit: V}
    - name: burst_vbat34
      realism: "who: environment; fresh alkaline cells 3.4 V, 0.3 ohm; guard OFF by the firmware rule (rule 8: last guard-ON reading 3.4 V >= 3.35 V), the body diodes feed the boost; how often: every Wi-Fi wake while the cells are fresh; timing: 350 mA 5 ms"
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.4 3.4 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        tran 5u 10m
      measures:
        - {name: v3v3_min_b34, meas: "min v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: v3v3_max_b34, meas: "max v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: dbg_vbatp_min_b34, meas: "min v(VBAT_P) from=0.5m to=10m", unit: V}
    - name: burst_vbat33_on
      realism: "who: environment; alkaline wake with the guard ON (rule 8: last guard-ON reading 3.3 V < 3.35 V), cells 3.3 V at the top of the guard-ON range, 0.3 ohm: VBAT_P about 3.29 V is within 150 mV of the target, outside the MAX17227A stated regulation range (VOUT > VIN + 150 mV); the model lets the rail follow VIN there (assumption, bench check in notes/models.md); timing: 350 mA 5 ms"
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.3 3.3 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.35 1m 10u 10u 5m 1000 ]
        tran 5u 10m
      measures:
        - {name: v3v3_min_b33, meas: "min v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}
        - {name: v3v3_max_b33, meas: "max v(U1.3) from=0.5m to=10m", min: 3.2, max: 3.46, unit: V, req: "R3,R25"}

    # ---------------------------------------------------------------- R35 (and R3 top of range): lithium 3.7 V
    - name: r35_dc_vbat37
      realism: "who: user fits two fresh lithium AAA cells (Energizer L92 class, open circuit up to 3.7 V, PM round 3 q2); how often: any time lithium cells are in; timing: steady deep sleep (about 12 uA), guard OFF (R14), VBAT_P = VBAT - M1/M2 body-diode drop, VIN_BST one more drop lower (M4 OFF); limits: R35 +3V3 <= 3.45 V (ESP32-C3 VDD abs max 3.6 V, module datasheet)"
      temps: [0, 25, 45]
      cmd: |
        alter vbat dc = 3.7
        alter vrs dc = 0.3
        op
      measures:
        - {name: v3v3_dc_37, expr: "v(U1.3)", max: 3.45, unit: V, req: R35}
        - {name: dbg_vbatp_dc_37, expr: "v(VBAT_P)", unit: V}
        - {name: dbg_vinbst_dc_37, expr: "v(VIN_BST)", unit: V}
    - name: sw_ulpm_li37_sleep
      realism: "who: lithium 3.7 V cells, 0.3 ohm, deep sleep (guard and M4 OFF, VIN_BST 3.10 / 3.19 / 3.27 V at 0 / 25 / 45 C = closest to VOUT); timing: one ULPM pulse at the typical +2.7 % level (3.389 V) into 6.5 uA, switching level (sim.sources testbench); limits: R35 +3V3 <= 3.45 V, R3 <= 3.46 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter vtbsel dc = 1
        alter vtbvth dc = 3.3891
        alter itbload dc = 6.5u
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 30u 0 5n
      measures:
        - {name: v3v3_pk_sw_li_sleep, meas: "max v(tb_out) from=2u to=30u", max: 3.45, unit: V, req: R35}
        - {name: v3v3_pk_sw_li_sleep_r3, meas: "max v(tb_out) from=2u to=30u", min: 3.2, max: 3.46, unit: V, req: R3}
        - {name: dbg_ipk_sw_li_sleep, meas: "max i(vtbil) from=2u to=30u", unit: A}
        - {name: dbg_vin_sw_li_sleep, meas: "find v(tb_vin) at=1u", unit: V}
    - name: sw_ulpm_li37_relay
      realism: "who: lithium 3.7 V cells, guard OFF, relay pulse: 25 mA SoC + 83 mA coil (3.389 V / 40.78 ohm) on +3V3; the ULPM-to-LPM transition current is above 200 mA at this VIN, so the converter keeps pulsing at the ULPM level; 300 us of repeated pulses at the typical level; limits: R35 rail <= 3.45 V and coil <= 3.4 V (coil voltage = mean rail x 40.5 / (40.5 + 0.28) (coil 40.5 ohm, DRV8837 280 mOhm HS + LS); the 30 mH coil averages the us ripple; ADW1103HLW continuous maximum 110 % = 3.3 V, vendor page, unverified: the 31 ms pulse is not continuous), R3 <= 3.46 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter vtbsel dc = 1
        alter vtbvth dc = 3.3891
        alter itbload dc = 0.108
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 300u 0 5n
      measures:
        - {name: v3v3_pk_sw_li_relay, meas: "max v(tb_out) from=100u to=300u", max: 3.45, unit: V, req: R35}
        - {name: v3v3_pk_sw_li_relay_r3, meas: "max v(tb_out) from=100u to=300u", min: 3.2, max: 3.46, unit: V, req: R3}
        - {name: dbg_v3v3_avg_sw_li_relay, meas: "avg v(tb_out) from=100u to=300u", unit: V}
        - {name: vcoil_avg_sw_li_relay, expr: "dbg_v3v3_avg_sw_li_relay*40.5/40.78", max: 3.4, unit: V, req: R35}
    - name: sw_ulpm_alk33_on
      realism: "who: alkaline 3.3 V cells, 0.3 ohm, guard ON during a wake (rule 8: reading < 3.35 V), VBAT_P about 3.3 V = the alkaline case nearest VOUT; light-sleep recharge load 130 uA; one ULPM pulse at the typical level; limit: R3 +3V3 3.2-3.46 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.3 3.3 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter vtbsel dc = 1
        alter vtbvth dc = 3.3891
        alter itbload dc = 130u
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 30u 0 5n
      measures:
        - {name: v3v3_pk_sw_alk33, meas: "max v(tb_out) from=2u to=30u", min: 3.2, max: 3.46, unit: V, req: R3}
        - {name: dbg_vin_sw_alk33, meas: "find v(tb_vin) at=1u", unit: V}
    - name: sw_ulpm_li37_ofsmax_info
      realism: "information only (known risk, PM decision 2026-10-22: R35 and R6 verified at typical values): sw_ulpm_li37_sleep and the relay pulse with the ULPM level at its data sheet maximum +4.6 % (3.452 V)"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter vtbsel dc = 1
        alter vtbvth dc = 3.4518
        alter itbload dc = 6.5u
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 30u 0 5n
      measures:
        - {name: dbg_v3v3_pk_sw_li_ofsmax, meas: "max v(tb_out) from=2u to=30u", unit: V}
    - name: sw_ulpm_li37_relay_ofsmax_info
      realism: "information only (known risk, PM decision 2026-10-22): sw_ulpm_li37_relay at the ULPM maximum +4.6 % (3.452 V); coil voltage = mean rail x 40.5 / (40.5 + 0.28) (coil 40.5 ohm, DRV8837 280 mOhm HS + LS); the 30 mH coil averages the us ripple"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter vtbsel dc = 1
        alter vtbvth dc = 3.4518
        alter itbload dc = 0.108
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 300u 0 5n
      measures:
        - {name: dbg_v3v3_pk_sw_li_relay_ofsmax, meas: "max v(tb_out) from=100u to=300u", unit: V}
        - {name: dbg_v3v3_avg_sw_li_relay_ofsmax, meas: "avg v(tb_out) from=100u to=300u", unit: V}
        - {name: dbg_vcoil_avg_sw_li_relay_ofsmax, expr: "dbg_v3v3_avg_sw_li_relay_ofsmax*40.5/40.78", unit: V}
    - name: sw_ulpm_li37_ctol_info
      realism: "information only (tolerance): sw_ulpm_li37_sleep with COUT at -20 % (CL31A476MPHNNNE tolerance M): 63.1 uF effective (3 x 47 uF)"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter vtbsel dc = 1
        alter vtbvth dc = 3.3891
        alter itbload dc = 6.5u
        alter ctbout = 63.1u
        alter @vtbpre[pulse] = [ 1 0 2u 1n 1n 1 2 ]
        tran 2n 30u 0 5n
      measures:
        - {name: dbg_v3v3_pk_sw_li_ctol, meas: "max v(tb_out) from=2u to=30u", unit: V}
    - name: r3_ulpm_max_info
      realism: "information only (known risk, PM decision 2026-10-22: R3 is verified with typical datasheet values; ripple-inclusive peak in sw_ulpm_li37_ofsmax_info, checked in prototype test 7): lithium 3.7 V cells in deep sleep (guard OFF, VBAT_P closest to VOUT, light load), with the MAX17227A light-load (ULPM) offset at its data sheet maximum +4.6 % (VACC_ULPM max): target 3.452 V; the case the R3 ceiling 3.46 V was set for (PM decision 2026-10-22); fixed data sheet corner, so no MC"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        alter vbat dc = 3.7
        alter vrs dc = 0.3
        alter @v.xu2.vofs[dc] = 0.046
        op
      measures:
        - {name: dbg_v3v3_ulpm_max_r3, expr: "v(U1.3)", unit: V}
    - name: r35_dc_vbat37_ulpm_max_info
      realism: "information only (known risk, PM decision 2026-10-22: R35 is verified with typical datasheet values): as r35_dc_vbat37 (lithium 3.7 V, deep sleep, guard OFF) with the MAX17227A light-load (ULPM) offset at its data sheet maximum +4.6 % (VACC_ULPM max): target 3.452 V; checked on the prototype"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        alter vbat dc = 3.7
        alter vrs dc = 0.3
        alter @v.xu2.vofs[dc] = 0.046
        op
      measures:
        - {name: dbg_v3v3_dc_37_ofsmax, expr: "v(U1.3)", unit: V}
    - name: r35_wake_vbat37_ulpm_max_info
      realism: "information only (known risk, PM decision 2026-10-22: R35 is verified with typical datasheet values): as r35_wake_vbat37 (lithium 3.7 V wake with a relay pulse and a Wi-Fi burst, guard OFF), with the ULPM offset at its data sheet maximum +4.6 %: the rail sits at 3.452 V before each load step; limits: R35 coil <= 3.4 V and +3V3 <= 3.45 V, R3 ceiling 3.46 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @v.xu2.vofs[dc] = 0.046
        alter @vio2[pulse] = [ 0 1 1m 1u 1u 50u 1000 ]
        alter @vio2h[pulse] = [ 0 1 1.052m 1u 1u 0.5m 1000 ]
        alter @iburst[pulse] = [ 0 0.35 3m 10u 10u 5m 1000 ]
        alter @vio4[pulse] = [ 0 1 10m 1u 1u 45m 1000 ]
        alter @vio7[pulse] = [ 0 1 12m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 43m 1u 1u 5m 1000 ]
        tran 5u 70m
      measures:
        - {name: dbg_v3v3_max_w37_ofsmax, meas: "max v(U1.3) from=0.5m to=70m", unit: V}
        - {name: dbg_vcoil_max_w37_ofsmax, meas: "max v(tb_vk1) from=10m to=70m", unit: V}
    - name: r35_wake_vbat37
      realism: "who: firmware wake on lithium cells 3.7 V, 0.3 ohm (PM round 3 q2); how often: every minute (control) and every 60 min (Wi-Fi); timing: guard OFF in sleep; IO2 low for 50 us to sample VBAT_P twice (divider 20 k / 10 k, C15 1 nF, tau 6.7 us; no 30 mV fall, so no fault); reading about 3.6 V >= 3.35 V (rule 8), so IO2 is driven high for 0.5 ms and released (guard OFF for the wake); 350 mA 5 ms Wi-Fi burst at 3 ms; relay K1 set pulse 31 ms + 5 ms brake at 12 ms (one at a time, no relay during TX); limits: R35 +3V3 <= 3.45 V and coil <= 3.4 V, R3 rail 3.2-3.4 V in the burst"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 0 1 1m 1u 1u 50u 1000 ]
        alter @vio2h[pulse] = [ 0 1 1.052m 1u 1u 0.5m 1000 ]
        alter @iburst[pulse] = [ 0 0.35 3m 10u 10u 5m 1000 ]
        alter @vio4[pulse] = [ 0 1 10m 1u 1u 45m 1000 ]
        alter @vio7[pulse] = [ 0 1 12m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 43m 1u 1u 5m 1000 ]
        tran 5u 70m
      measures:
        - {name: v3v3_max_w37, meas: "max v(U1.3) from=0.5m to=70m", max: 3.45, unit: V, req: R35}
        - {name: vcoil_max_w37, meas: "max v(tb_vk1) from=10m to=70m", max: 3.4, unit: V, req: R35}
        - {name: v3v3_min_b37, meas: "min v(U1.3) from=2.5m to=10m", min: 3.2, max: 3.46, unit: V, req: R3}
        - {name: v3v3_max_b37, meas: "max v(U1.3) from=2.5m to=10m", min: 3.2, max: 3.46, unit: V, req: R3}
        - {name: dbg_vbatp_max_w37, meas: "max v(VBAT_P) from=0.5m to=70m", unit: V}
        - {name: dbg_vbat_read_w37, meas: "find v(VBAT_ADC) at=1.048m", scale: 3, unit: V}
        - {name: dbg_vbatp_min_w37, meas: "min v(VBAT_P) from=0.5m to=70m", unit: V}
        - {name: dbg_vinbst_max_w37, meas: "max v(VIN_BST) from=0.5m to=70m", unit: V}
    # P6 (partition.md): two consecutive wakes on lithium. Wake 1 decides guard OFF (cold boot, VBAT_P(off) >= 2.85 V)
    # and stores its 50 us read (3.26-3.36 V). The fixed rule (PM D20 record) keeps the cold-boot criterion after a
    # guard-OFF decision, so wake 2 is again a 50 us read. Wakes 2 s apart instead of 60 s: less C1/C2 sag, so VBAT_P
    # is higher at wake 2 (conservative for R35).
    - name: r35_two_wake_vbat37
      realism: "who: firmware on lithium cells 3.7 V, 0.3 ohm (PM round 3 q2); how often: every pair of consecutive control wakes; timing: wake 1 at 1 ms and wake 2 at 2.001 s, each IO2 low 50 us (rule 8b read) then IO2 high 0.5 ms and released (guard OFF, partition.md P6 fix); 25 mA 20 ms work per wake; limit: R35 +3V3 <= 3.45 V over both wakes"
      temps: [0, 25, 45]
      monte_carlo: false
      timeout_s: 600
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 0 1 1m 1u 1u 50u 2 ]
        alter @vio2h[pulse] = [ 0 1 1.052m 1u 1u 0.5m 2 ]
        alter @iburst[pulse] = [ 0 0.025 2m 10u 10u 20m 2 ]
        tran 50u 2.1
      measures:
        - {name: v3v3_max_2w37, meas: "max v(U1.3) from=0.5m to=2.1", max: 3.45, unit: V, req: R35}
        - {name: dbg_v3v3_max_2w37_w2, meas: "max v(U1.3) from=2.0005 to=2.1", unit: V}
    - name: r35_two_wake_rule8a_info
      realism: "information only (debug): the same two wakes with rule 8a as first written: wake 2 sees the stored 50 us read (< 3.35 V) and turns the guard ON for the 20 ms recharge (IO2 held low, M4 turns ON after about 1 ms), then reads about 3.7 V and releases; shows the defect P6 fixes"
      temps: [0, 25, 45]
      monte_carlo: false
      timeout_s: 600
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 0 1 1m 1u 1u 50u 1000 ]
        alter @vio2b[pulse] = [ 0 1 2.001 1u 1u 20m 1000 ]
        alter @vio2h[pulse] = [ 0 1 1.052m 1u 1u 0.5m 2.0207 ]
        alter @iburst[pulse] = [ 0 0.025 2m 10u 10u 20m 2 ]
        tran 50u 2.1
      measures:
        - {name: dbg_v3v3_max_2w37_rule8a, meas: "max v(U1.3) from=2.0005 to=2.1", unit: V}
        - {name: dbg_vinbst_max_2w37_rule8a, meas: "max v(VIN_BST) from=2.0005 to=2.1", unit: V}
    - name: r35_swap_to_lithium
      realism: "who: user swaps spent alkaline cells (2.6 V) for fresh lithium (3.7 V) while the board still runs on C1+C2 (hold-up about 60 s, R24); how often: once per battery change; timing: cells out at 0.1 s, lithium in at 5 s (hand swap), board in deep sleep, guard OFF (R14) since the last wake; limit: R35 +3V3 <= 3.45 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vio2b[pulse] = [ 1 0 0.05 1u 1u 1000 2000 ]
        alter @vio2h[pulse] = [ 0 1 0.0502 1u 1u 0.5m 1000 ]
        alter @vbat[pulse] = [ 2.6 3.7 2 1m 1m 1000 2000 ]
        alter vrs dc = 0.3
        alter @vconn[pulse] = [ 1 0 0.1 1m 1m 4.9 1000 ]
        tran 1m 10
      measures:
        - {name: v3v3_max_swap37, meas: "max v(U1.3) from=0.2 to=10", max: 3.45, unit: V, req: R35}
        - {name: dbg_vbatp_max_swap37, meas: "max v(VBAT_P) from=0.2 to=10", unit: V}
        - {name: dbg_vinbst_max_swap37, meas: "max v(VIN_BST) from=0.2 to=10", unit: V}
    - name: r35_guard_on_fault_info
      realism: "stress case (information only): firmware fault that drives IO2 low (guard ON) with lithium cells 3.7 V; the shipped firmware never does this (rule 8: ON only while the last guard-ON reading is < 3.35 V), and a reset or crash releases IO2 so R14 turns the guard OFF; shows the pass-through rail the hardware default prevents"
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 0 1 1m 1u 1u 1000 2000 ]
        tran 10u 20m
      measures:
        - {name: dbg_v3v3_max_fault37, meas: "max v(U1.3) from=1m to=20m", unit: V}

    # ---------------------------------------------------------------- R4: reverse polarity guard
    - name: reverse_dead_board
      realism: "who: user inserts both cells backwards into a board that has been without cells for > 15 min (C1 empty); worst case two fresh lithium cells (-3.7 V, R35); how often: rare, at most once per battery change; timing: steady state, left reversed for hours; limits: R4 1 uA; AO3413 VDS -20 V, VGS +-8 V abs max, IDSS <= 1 uA at VDS -20 V per FET at 25 C (5 uA at 55 C), data sheet EC table (the model carries only the body-diode IS leakage, nA), MAX17227A IN abs min -0.3 V (data sheet abs-max table)"
      temps: [0, 25, 45]
      cmd: |
        alter vbat dc = -3.7
        alter vrs dc = 0.3
        op
      measures:
        - {name: i_rev_dead_ua, expr: "abs(i(vbat))*1e6", max: 1, unit: uA, req: R4}
        - {name: vbatp_rev_dead, expr: "v(VBAT_P)", min: -0.3, max: 0.3, unit: V, req: R4}
    - name: guard_forward_drop
      realism: "who: environment (Wi-Fi burst current through the guard); how often: every Wi-Fi wake; limit: R4 55 mV at 0.7 A with the cells at the 2.0 V cut-off (Vgs = -2.0 V); AO3413 RDS(on) typ 85 mOhm at VGS -1.8 V, 70 at -2.5 V per FET (data sheet EC table, max 130 / 100), model 79.5 mOhm at -1.97 V, 25 C"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        alter vbat dc = 2.0
        alter vrs dc = 1m
        alter vitest dc = 0.7
        alter vio2 dc = 1
        op
      measures:
        - {name: vdrop_guard_mv, expr: "(v(VBAT_RAW)-v(VBAT_P))*1000", max: 55, unit: mV, req: R4}
    - name: guard_forward_drop_vthmax_info
      realism: "information only (review 2b M1; R4 stays verified at typical values with the copper budget held at the RDS(on) maximum, PM decision 2026-10-22): guard_forward_drop with M1 and M2 at VGS(th) max -1.0 V and RDS(on) max (VTO -1.0 V, KP 19.29, RD = RS 32.6 mOhm, as burst_vbat20_vthmax_info); 0.7 A at 2.0 V"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        alter vbat dc = 2.0
        alter vrs dc = 1m
        alter vitest dc = 0.7
        alter vio2 dc = 1
        altermod m.xm1.m1 vto = -1.0
        altermod m.xm1.m1 kp = 19.29
        altermod m.xm2.m1 vto = -1.0
        altermod m.xm2.m1 kp = 19.29
        alter @r.xm1.rd[resistance] = 0.0326
        alter @r.xm1.rs[resistance] = 0.0326
        alter @r.xm2.rd[resistance] = 0.0326
        alter @r.xm2.rs[resistance] = 0.0326
        op
      measures:
        - {name: dbg_vdrop_guard_vthmax_mv, expr: "(v(VBAT_RAW)-v(VBAT_P))*1000", unit: mV}
    - name: reverse_both_peak
      realism: "who: user pulls the cells and re-inserts both backwards; C1+C2 still charged: hold-up from 2.6 V to 0.7 V at 16 uA = 1.9 V x 6.6 mF / 16 uA = 780 s, much longer than a hand swap (5-30 s), so this is a real case; with the guard OFF outside wakes (R14) the insertion dumps only if it falls inside a wake (20 ms per minute = 0.03 % of insertions, plus the hourly Wi-Fi wake): this analysis is that case, guard ON (IO2 low); timing: 10 us step from +2.6 V to -3.4 V, fresh cells 0.3 ohm; limits: AO3413 IDM -15 A (pulsed, TJ limited), single-pulse power Fig. 10 and SOA Fig. 9 (data sheet); R4 still verifies this case by a prototype test (20 reversed insertions, >= 90 s wait after each, notes/circuit.md test list), so the simulated per-FET peak and energy are debug records"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @vbat[pulse] = [ 2.6 -3.4 1m 10u 10u 10 20 ]
        alter vrs dc = 0.3
        tran 1u 30m
      measures:
        - {name: dbg_ipk_dump_both, meas: "max i(vbat) from=0.5m to=30m", unit: A}
        - {name: dbg_ipk_per_fet, expr: "dbg_ipk_dump_both/2", unit: A}
        - {name: dbg_e_per_fet_mj, meas: "integ v(tb_pfet) from=0.9m to=30m", scale: 1000, unit: mJ}
        - {name: dbg_vbatp_5m_both, meas: "find v(VBAT_P) at=5m", unit: V}
    - name: reverse_both_peak_sleep
      realism: "who: user, as reverse_both_peak, insertion between wakes (99.97 % of cases): guard OFF (gates at VBAT_P through R14), body diodes reverse biased, VDS = -6.0 V (AO3413 -20 V abs max, data sheet)"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vio2b[pulse] = [ 1 0 0.5m 1u 1u 1000 2000 ]
        alter @vio2h[pulse] = [ 0 1 0.502m 1u 1u 0.2m 1000 ]
        alter @vbat[pulse] = [ 2.6 -3.4 1m 10u 10u 10 20 ]
        alter vrs dc = 0.3
        tran 1u 30m
      measures:
        - {name: dbg_ipk_dump_sleep, meas: "max i(vbat) from=0.9m to=30m", unit: A}
        - {name: dbg_vds_min_sleep, meas: "min v(tb_vds) from=0.9m to=30m", unit: V}
    - name: reverse_both_just_pulled
      realism: "who: user pulls the cells and re-inserts both backwards (see reverse_both_peak); how often: rare; timing: 1 ms step from +2.6 V to -3.7 V (fresh lithium, R35), 0.3 ohm, left reversed 1 h; limits: R4 1 uA steady"
      monte_carlo: false
      timeout_s: 300
      cmd: |
        tran 1u 2u
        alter @vio2b[pulse] = [ 1 0 0.05 1u 1u 100000 200000 ]
        alter @vio2h[pulse] = [ 0 1 0.0502 1u 1u 0.5m 100000 ]
        alter @vbat[pulse] = [ 2.6 -3.7 0.1 1m 1m 10000 20000 ]
        alter vrs dc = 0.3
        tran 0.1 3600
      measures:
        - {name: dbg_ipk_dump_both_1h, meas: "max i(vbat) from=0.09 to=1", unit: A}
        - {name: dbg_vbatp_1h_both, meas: "find v(VBAT_P) at=3590", unit: V}
        - {name: dbg_i_1h_both, meas: "find i(vbat) at=3590", unit: A}
        - {name: i_rev_1h_both_ua, expr: "abs(dbg_i_1h_both)*1e6", max: 1, unit: uA, req: R4}
    - name: reverse_one_just_pulled
      realism: "who: user re-inserts one cell backwards (series sum about 0 V) on a just-pulled board (C1 charged, see reverse_both_just_pulled); how often: rare; timing: 1 ms step from +2.6 V to 0 V, 0.3 ohm"
      monte_carlo: false
      timeout_s: 300
      cmd: |
        tran 1u 2u
        alter @vio2b[pulse] = [ 1 0 0.05 1u 1u 100000 200000 ]
        alter @vio2h[pulse] = [ 0 1 0.0502 1u 1u 0.5m 100000 ]
        alter @vbat[pulse] = [ 2.6 0 0.1 1m 1m 10000 20000 ]
        alter vrs dc = 0.3
        tran 0.1 3600
      measures:
        - {name: dbg_ipk_dump_one, meas: "max i(vbat) from=0.09 to=1", unit: A}
        - {name: dbg_i_1h_one, meas: "find i(vbat) at=3590", unit: A}
        - {name: i_rev_1h_one_ua, expr: "abs(dbg_i_1h_one)*1e6", max: 1, unit: uA, req: R4}
    - name: forward_insert_dead
      realism: "who: user inserts two fresh lithium AAA cells (3.7 V open circuit, 0.3 ohm, PM round 3 q2) the right way round into an empty board (C1+C2 at 0 V, board without cells > 15 min); how often: every battery change; timing: 10 us contact step, guard OFF (no firmware running, R14 holds the gates at VBAT_P), C1+C2 6.6 mF charge through the M1/M2 body diodes in parallel (tau about 2.3 ms); limits: AO3413 body diode IS -1.4 A continuous, IDM -15 A pulsed, single-pulse power about 15-20 W at 10 ms (data sheet Fig. 10, PM D4): the per-FET peak current, I2t and energy are debug records checked against Fig. 10 in notes/circuit.md (and the prototype test, 20 forward lithium insertions)"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.7 3.7 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vconn[pulse] = [ 0 1 1m 10u 10u 1000 2000 ]
        tran 2u 40m
      measures:
        - {name: dbg_ipk_fwd37_per_fet, meas: "min i(vbat) from=0.5m to=40m", scale: -0.5, unit: A}
        - {name: dbg_i2t_fwd37_per_fet, meas: "integ v(tb_i2fet) from=0.5m to=40m", unit: A2s}
        - {name: dbg_e_fwd37_per_fet_mj, meas: "integ v(tb_pfet) from=0.5m to=40m", scale: 1000, unit: mJ}
        - {name: dbg_vbatp_fwd37_39m, meas: "find v(VBAT_P) at=39m", unit: V}
        - {name: dbg_v3v3_max_fwd37, meas: "max v(U1.3) from=0.5m to=40m", unit: V}
    - name: forward_insert_dead_alk
      realism: "who: user inserts two fresh alkaline AAA cells (3.2 V, 0.3 ohm) the right way round into an empty board (C1+C2 at 0 V); how often: every battery change; timing: 10 us contact step, guard OFF (no firmware yet), C1+C2 charge through the body diodes; limits: as forward_insert_dead (AO3413 Fig. 10): debug records"
      temps: [0, 25, 45]
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.2 3.2 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vconn[pulse] = [ 0 1 1m 10u 10u 1000 2000 ]
        tran 2u 40m
      measures:
        - {name: dbg_ipk_fwd32_per_fet, meas: "min i(vbat) from=0.5m to=40m", scale: -0.5, unit: A}
        - {name: dbg_i2t_fwd32_per_fet, meas: "integ v(tb_i2fet) from=0.5m to=40m", unit: A2s}
        - {name: dbg_e_fwd32_per_fet_mj, meas: "integ v(tb_pfet) from=0.5m to=40m", scale: 1000, unit: mJ}
        - {name: dbg_vbatp_fwd32_39m, meas: "find v(VBAT_P) at=39m", unit: V}

    # ---------------------------------------------------------------- R9 / R23: relay pulses
    - name: relay_vbat20_set
      realism: "who: firmware (relay set/reset, about 20 per day); worst rail: cells at the 2.0 V firmware cut-off (R23) through 1 ohm; timing: guard ON (IO2 low, rule 8: reading < 3.35 V), SENS_EN (nSLEEP) high, then IN1 high 31 ms per relay, one relay at a time, SoC awake 25 mA; limits: coil >= 2.64 V = 110 % of 2.4 V must-operate for >= 30 ms = 2 x 15 ms (Panasonic ADW1 page, search summary)"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 84m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 84m 1000 ]
        alter @vio7[pulse] = [ 0 1 5m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 36m 1u 1u 5m 1000 ]
        alter @vio20[pulse] = [ 0 1 45m 1u 1u 36m 1000 ]
        alter @vio21[pulse] = [ 0 1 76m 1u 1u 5m 1000 ]
        tran 10u 90m
      measures:
        - {name: dbg_k1_vmin_20, meas: "min v(tb_vk1) from=6m to=35m", unit: V}
        - {name: dbg_k1_rail_20, meas: "max v(U1.3) from=6m to=35m", unit: V}
        - {name: k1_vcoil_at_rail_min, expr: "dbg_k1_vmin_20*3.2/dbg_k1_rail_20", min: 2.64, unit: V, req: R9}
        - {name: k1_t_on_20s, meas: "trig v(tb_vk1) val=2.64 rise=1 targ v(tb_vk1) val=2.64 fall=1", min: 0.030, unit: s, req: R9}
        - {name: dbg_k2_vmin_20, meas: "min v(tb_vk2) from=46m to=75m", unit: V}
        - {name: dbg_k2_rail_20, meas: "max v(U1.3) from=46m to=75m", unit: V}
        - {name: k2_vcoil_at_rail_min, expr: "dbg_k2_vmin_20*3.2/dbg_k2_rail_20", min: 2.64, unit: V, req: R9}
        - {name: k2_t_on_20s, meas: "trig v(tb_vk2) val=2.64 rise=1 targ v(tb_vk2) val=2.64 fall=1", min: 0.030, unit: s, req: R9}
        - {name: v3v3_min_relay_20, meas: "min v(U1.3) from=1m to=90m", min: 3.2, max: 3.46, unit: V, req: R3}
    - name: relay_vbat34
      realism: "who: firmware relay pulse with fresh alkaline cells 3.4 V, 0.3 ohm; guard OFF by the firmware rule (rule 8: last guard-ON reading 3.4 V >= 3.35 V), boost regulating; the highest rail with the guard ON is at 3.3 V cells (relay_vbat33_on); limit: pulse energy <= 9 mJ from the rail (R9, PM round 2 q4)"
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.4 3.4 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 84m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 84m 1000 ]
        alter @vio7[pulse] = [ 0 1 5m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 36m 1u 1u 5m 1000 ]
        alter @vio20[pulse] = [ 0 1 45m 1u 1u 36m 1000 ]
        alter @vio21[pulse] = [ 0 1 76m 1u 1u 5m 1000 ]
        tran 10u 90m
      measures:
        - {name: e_k1_mj, meas: "integ v(tb_pk1) from=4m to=40m", scale: 1000, max: 9, unit: mJ, req: R9}
        - {name: e_k2_mj, meas: "integ v(tb_pk2) from=44m to=80m", scale: 1000, max: 9, unit: mJ, req: R9}
        - {name: v3v3_max_relay_34, meas: "max v(U1.3) from=1m to=90m", max: 3.46, unit: V, req: R3}
    - name: relay_vbat33_on
      realism: "who: firmware relay pulse at the alkaline wake with the guard ON (rule 8: last guard-ON reading 3.3 V < 3.35 V, 0.3 ohm): VBAT_P near the target (model: rail follows VIN, assumption), highest rail with the guard ON; limits: pulse energy <= 9 mJ (R9), rail <= 3.4 V (R3)"
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.3 3.3 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 84m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 84m 1000 ]
        alter @vio7[pulse] = [ 0 1 5m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 36m 1u 1u 5m 1000 ]
        alter @vio20[pulse] = [ 0 1 45m 1u 1u 36m 1000 ]
        alter @vio21[pulse] = [ 0 1 76m 1u 1u 5m 1000 ]
        tran 10u 90m
      measures:
        - {name: e_k1_mj_33, meas: "integ v(tb_pk1) from=4m to=40m", scale: 1000, max: 9, unit: mJ, req: R9}
        - {name: e_k2_mj_33, meas: "integ v(tb_pk2) from=44m to=80m", scale: 1000, max: 9, unit: mJ, req: R9}
        - {name: v3v3_max_relay_33, meas: "max v(U1.3) from=1m to=90m", max: 3.46, unit: V, req: R3}
    - name: relay_vbat20
      realism: "who: firmware cut-off: at loaded VBAT <= 2.0 V both relays are reset OFF from the cells (R23); how often: once at battery end; timing: as relay_vbat20_set (guard ON), cells at 2.0 V through 1 ohm"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2[pulse] = [ 1 1 0 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 84m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 84m 1000 ]
        alter @vio10[pulse] = [ 0 1 5m 1u 1u 36m 1000 ]
        alter @vio7[pulse] = [ 0 1 36m 1u 1u 5m 1000 ]
        alter @vio21[pulse] = [ 0 1 45m 1u 1u 36m 1000 ]
        alter @vio20[pulse] = [ 0 1 76m 1u 1u 5m 1000 ]
        tran 10u 90m
      measures:
        - {name: k1_vcoil_reset_20, meas: "min v(tb_vk1r) from=6m to=35m", min: 2.64, unit: V, req: R23}
        - {name: k1_t_on_20, meas: "trig v(tb_vk1r) val=2.64 rise=1 targ v(tb_vk1r) val=2.64 fall=1", min: 0.030, unit: s, req: R23}
        - {name: k2_vcoil_reset_20, meas: "min v(tb_vk2r) from=46m to=75m", min: 2.64, unit: V, req: R23}
        - {name: k2_t_on_20, meas: "trig v(tb_vk2r) val=2.64 rise=1 targ v(tb_vk2r) val=2.64 fall=1", min: 0.030, unit: s, req: R23}

    - name: relay_backemf_brake
      realism: "who: firmware, every relay pulse (about 20 per day); fresh cells 3.4 V through 0.3 ohm, guard OFF (rule 8: reading 3.4 V >= 3.35 V), the boost cannot sink current, so coil energy returned to +3V3 raises the rail; timing: 31 ms pulse, then brake 5 ms (IN1 = IN2 = 1, both low sides on), then coast; coil 40.5 ohm + 30 mH (inductance assumed, unverified); limit: ESP32-C3 VDD abs max 3.6 V (module datasheet abs-max table)"
      temps: [0, 25, 45]
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.4 3.4 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 60m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 55m 1000 ]
        alter @vio7[pulse] = [ 0 1 5m 1u 1u 36m 1000 ]
        alter @vio10[pulse] = [ 0 1 36m 1u 1u 5m 1000 ]
        tran 2u 70m
      measures:
        - {name: v3v3_max_backemf_brake, meas: "max v(U1.3) from=30m to=70m", max: 3.6, unit: V, req: R9}
    - name: relay_backemf_coast_info
      realism: "information only (debug): the same pulse ending in coast (IN1 = IN2 = 0) right after 31 ms; shows why the firmware must brake: the coil current returns to +3V3 through the DRV8837 body diodes"
      monte_carlo: false
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 3.4 3.4 0 1u 1u 1000 2000 ]
        alter vrs dc = 0.3
        alter @iburst[pulse] = [ 0 0.025 1m 10u 10u 60m 1000 ]
        alter @vio4[pulse] = [ 0 1 1m 1u 1u 55m 1000 ]
        alter @vio7[pulse] = [ 0 1 5m 1u 1u 31m 1000 ]
        tran 2u 70m
      measures:
        - {name: dbg_v3v3_max_backemf_coast, meas: "max v(U1.3) from=30m to=70m", unit: V}

    # ---------------------------------------------------------------- R17 / R19: NTC inputs
    # T_est = 1/(1/298.15 + ln(x/(1-x))/3950) - 273.15 with x = (Vn +- 0.5 mV)/Ve: ratiometric (gain cancels),
    # 0.5 mV = ADS1115 offset 3 LSB + INL 1 LSB at FSR +-4.096 V (125 uV/LSB; SBAS444 search snippet, unverified)
    - name: ntc_0c_40c
      cmd: |
        alter vio4 dc = 1
        alter rntc1 = 33620.6
        alter rntc2 = 5301.5
        op
      measures:
        - {name: t0_err_pos, expr: "1/(1/298.15+ln(((v(AIN_NTC1)+5e-4)/v(AIN_REF))/(1-(v(AIN_NTC1)+5e-4)/v(AIN_REF)))/3950)-273.15", min: -0.3, max: 0.3, unit: C, req: R17}
        - {name: t0_err_neg, expr: "1/(1/298.15+ln(((v(AIN_NTC1)-5e-4)/v(AIN_REF))/(1-(v(AIN_NTC1)-5e-4)/v(AIN_REF)))/3950)-273.15", min: -0.3, max: 0.3, unit: C, req: R17}
        - {name: t40_err_pos, expr: "1/(1/298.15+ln(((v(AIN_NTC2)+5e-4)/v(AIN_REF))/(1-(v(AIN_NTC2)+5e-4)/v(AIN_REF)))/3950)-273.15-40", min: -0.3, max: 0.3, unit: C, req: R17}
        - {name: t40_err_neg, expr: "1/(1/298.15+ln(((v(AIN_NTC2)-5e-4)/v(AIN_REF))/(1-(v(AIN_NTC2)-5e-4)/v(AIN_REF)))/3950)-273.15-40", min: -0.3, max: 0.3, unit: C, req: R17}
        - {name: dbg_ratio_0c, expr: "v(AIN_NTC1)/v(AIN_REF)"}
        - {name: dbg_ratio_40c, expr: "v(AIN_NTC2)/v(AIN_REF)"}
    - name: ntc_25c
      cmd: |
        alter vio4 dc = 1
        op
      measures:
        - {name: t25_err_pos, expr: "1/(1/298.15+ln(((v(AIN_NTC1)+5e-4)/v(AIN_REF))/(1-(v(AIN_NTC1)+5e-4)/v(AIN_REF)))/3950)-273.15-25", min: -0.3, max: 0.3, unit: C, req: R17}
        - {name: t25_err_neg, expr: "1/(1/298.15+ln(((v(AIN_NTC2)-5e-4)/v(AIN_REF))/(1-(v(AIN_NTC2)-5e-4)/v(AIN_REF)))/3950)-273.15-25", min: -0.3, max: 0.3, unit: C, req: R17}
    - name: ntc_open_short
      realism: "who: fault (probe cable cut or crushed); how often: rare; limit: R19 window 2-98 % of the excitation"
      cmd: |
        alter vio4 dc = 1
        alter rntc1 = 1e12
        alter rntc2 = 1e-3
        op
      measures:
        - {name: ratio_probe_open, expr: "v(AIN_NTC1)/v(AIN_REF)", min: 0.98, unit: "", req: R19}
        - {name: ratio_probe_short, expr: "v(AIN_NTC2)/v(AIN_REF)", max: 0.02, unit: "", req: R19}

    # ---------------------------------------------------------------- R22: battery divider
    # error = divider (simulated, incl. M3 and 0.1 % resistors) + ESP32 ADC +-10 mV at ATTEN2 x 3 = 30 mV
    # (ESP32-C3 datasheet ADC table, after calibration)
    - name: vbat_divider
      cmd: |
        alter vio2 dc = 1
        dc vbat 2.0 3.3 0.05
      measures:
        - {name: vbat_err_mv, expr: "vecmax(abs(3*v(VBAT_ADC)-v(VBAT_RAW)))*1000+30", max: 50, unit: mV, req: R22}

    # ---------------------------------------------------------------- R24: hold-up without cells
    - name: holdup_60s
      realism: "who: user changing cells; how often: once per battery change (about yearly); timing: hand swap 5-30 s, R24 asks 60 s, cells at the 2.0 V cut-off when pulled; one 20 ms 25 mA control wake inside the minute; limit: ESP32 VDD min 3.0 V (module datasheet Table 6-2)"
      timeout_s: 300
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.0 2.0 0 1u 1u 1000 2000 ]
        alter @vio2b[pulse] = [ 1 0 0.9 1u 1u 1000 2000 ]
        alter @vconn[pulse] = [ 1 0 1 1m 1m 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.025 31 10u 10u 20m 1000 ]
        alter @vio2[pulse] = [ 0 1 31 1u 1u 20m 1000 ]
        alter @vio2h[pulse] = [ 0 1 0.9002 1u 1u 0.5m 30.12 ]
        tran 1m 62
      measures:
        - {name: v3v3_min_holdup, meas: "min v(U1.3) from=1 to=62", min: 3.0, unit: V, req: R24}
        - {name: dbg_vbatp_61s, meas: "find v(VBAT_P) at=61", unit: V}

    # ---------------------------------------------------------------- R6: sleep floor
    - name: sleep_floor_nopre_info
      realism: "information only (debug): firmware without the 20 ms recharge wait; deep sleep with the guard OFF, plus one 20 ms 25 mA control wake per 60 s with the guard ON and the ADC and NTC dividers on for 10 ms; third-minute average"
      monte_carlo: false
      timeout_s: 300
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.6 2.6 0 1u 1u 1000 2000 ]
        alter @vio2b[pulse] = [ 1 0 0.3 1u 1u 1000 2000 ]
        alter @iburst[pulse] = [ 0 0.025 0.5 10u 10u 20m 60 ]
        alter @vio2[pulse] = [ 0 1 0.5 1u 1u 20m 60 ]
        alter @vio2h[pulse] = [ 0 1 0.5202 1u 1u 0.5m 60 ]
        alter @vio4[pulse] = [ 0 1 0.505 1u 1u 10m 60 ]
        tran 1m 181
      measures:
        - {name: dbg_i_bat_floor_nopre_ua, meas: "avg i(vbat) from=120.6 to=180.6", scale: -1e6, unit: uA}
    - name: sleep_floor
      realism: "who: normal operation, every minute; R5 condition 2.6 V; deep sleep (ESP32 6 uA incl. 32 kHz crystal, MAX17227A IQ 350 nA OUT + 12 nA IN typ with the +2.7 % ULPM offset and 90 % light-load efficiency, 2 x DRV8837 sleep, C1+C2 leakage 2 uA assumed) with the guard OFF (R14 fail-safe for R35: C1+C2 carry the sleep and sag about 0.11 V per minute, below the body-diode drop); each 60 s wake: guard ON (IO2 low), 20 ms light sleep (130 uA) while C1+C2 recharge through the cells (tau 6.6 ms), then 20 ms 25 mA control work, then IO2 high (the guard is released before the conversions, PM D17); probes read every 5 min (PM D17, 2026-10-23): on every fifth wake SENS_EN is high for the real conversion time, 3 channels (REF, NTC1, NTC2) x 1/16 SPS = 187.5 ms (rule 12, 16 SPS), with the ESP32 in light sleep (130 uA, ILSLP2); average over one 5-min cycle (120.6-420.6 s: five wakes, one probe read) after the start-up deficit settles; limit R6 26 uA"
      monte_carlo: false
      timeout_s: 900
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.6 2.6 0 1u 1u 1000 2000 ]
        alter @vio2b[pulse] = [ 1 0 0.3 1u 1u 1000 2000 ]
        alter @ilslp[pulse] = [ 0 130u 0.5 10u 10u 20m 60 ]
        alter @iburst[pulse] = [ 0 0.025 0.52 10u 10u 20m 60 ]
        alter @vio2[pulse] = [ 0 1 0.5 1u 1u 40m 60 ]
        alter @vio2h[pulse] = [ 0 1 0.5402 1u 1u 0.5m 60 ]
        alter @vio4[pulse] = [ 0 1 0.541 1u 1u 187.5m 300 ]
        alter @ilslp2[pulse] = [ 0 130u 0.541 10u 10u 187.5m 300 ]
        tran 1m 421
      measures:
        - {name: i_bat_floor_ua, meas: "avg i(vbat) from=120.6 to=420.6", scale: -1e6, max: 26, unit: uA, req: R6}
        - {name: dbg_i_bat_sleep_ua, meas: "find i(vbat) at=150", scale: -1e6, unit: uA}
        - {name: dbg_vbatp_sag_end, meas: "find v(VBAT_P) at=180.49", unit: V}
    - name: sleep_floor_iqmax_info
      realism: "information only (recorded risk, PM decision 2026-10-22: R6 is verified at typical values): sleep_floor with the MAX17227A IQ into OUT at its data sheet maximum 660 nA (IQ_OUT max, 25 C, not switching)"
      monte_carlo: false
      timeout_s: 300
      cmd: |
        tran 1u 2u
        alter @vbat[pulse] = [ 2.6 2.6 0 1u 1u 1000 2000 ]
        alter @vio2b[pulse] = [ 1 0 0.3 1u 1u 1000 2000 ]
        alter @ilslp[pulse] = [ 0 130u 0.5 10u 10u 20m 60 ]
        alter @iburst[pulse] = [ 0 0.025 0.52 10u 10u 20m 60 ]
        alter @vio2[pulse] = [ 0 1 0.5 1u 1u 40m 60 ]
        alter @vio2h[pulse] = [ 0 1 0.5402 1u 1u 0.5m 60 ]
        alter @vio4[pulse] = [ 0 1 0.525 1u 1u 10m 60 ]
        alter @v.xu2.viq[dc] = 660n
        tran 1m 181
      measures:
        - {name: dbg_i_bat_floor_iqmax_ua, meas: "avg i(vbat) from=120.6 to=180.6", scale: -1e6, unit: uA}
    - name: sleep_floor_effl80_info
      realism: "information only (sensitivity): sleep_floor with the light-load efficiency at the old assumed 0.80 instead of the data sheet 90 % at 10 uA (Control Scheme section; test conditions not stated in the text)"
      monte_carlo: false
      timeout_s: 300
      cmd: |
        tran 1u 2u
