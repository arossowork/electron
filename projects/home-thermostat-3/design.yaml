    footprint: thermo:Fuse_Littelfuse_395Series_back
    pins: {"1": AC_L_IN, "2": AC_L}
    group: mains
    # back, between the K1 and J1 courtyards (gaps 0.15 / 0.22 mm). Layout round 8 (D15): x 14.0 -> 13.5, with K1
    # x 12.5 -> 13.5, opens the AC_ROOM1 corridor between F1.1 (between_mm 1.5) and the K1.A1 6 mm isolation from 0.34
    # to 1.73 mm (corridor proof). x >= 13.25 keeps F1.2 6 mm from notch_l by the layout check's pad-box metric
