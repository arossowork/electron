    # D8 option A: rot 90, pins at x 17.0, y 18.90 / 23.98 / 29.06, wire entry toward -x. Moved 0.60 mm down from the
    # PM position (y 18.30): the 0.60 mm interlock nubs sit at the pin-1 end and would touch the F1 body (y 15.25) and
    # overlap the F1 courtyard (y 15.5). Pad edges (d 3.0): 9.28 mm to the notch_l circle, 8.78 mm to K1.A1,
    # 7.18 mm to K2.A2 (6.0 needed); pad copper x <= 18.5
    placement: {x: 17.0, y: 18.90, rot: 90, fixed: true}
    spice: false
  F1:
    value: T3.15A 250V
    mpn: 2010T3.15A250V
    lcsc: C354904
    price_usd: 0.035
    datasheet: https://www.lcsc.com/datasheet/C354904.pdf
    symbol: Device:Fuse
