project: home_thermostat_3
revision: A
description: Battery Wi-Fi thermostat for a 503 box, 2 AAA -> MAX17227A 3.3 V, ESP32-C3, ADS1115 2x NTC, 2 latching 230 V relays

board:
  width_mm: 88                   # PM round 4 q1: 88 x 46 with two screw-post notches (R1 option 1)
  height_mm: 46
  layers: 4                      # PM decision 2026-10-21: 4 layers approved (inner GND and power), size fixed
  thickness_mm: 1.6
  antenna_clearance_mm: 15
  copper_oz: 1.0
  # Mains confinement (KiCad DRC enforces both; the router reads `disallow track/via` on a named rule area, see
  # footprint thermo:MainsRuleAreas): no mains track or via in the SELV region (x >= 21.5) on any layer, none on the
  # inner layers anywhere. Class iso_mains_SELV is the net class hwflow writes for the isolation group below.
  drc_rules:
    - '(rule fine_pitch (condition "A.memberOfFootprint(''U2'') || A.memberOfFootprint(''U5'')") (constraint clearance (min 0.15mm)))'
    - '(rule "mains_outer_only" (condition "A.intersectsArea(''NO_MAINS_INNER'') && A.NetClass == ''iso_mains_SELV''") (constraint disallow track via))'
  isolation:
    # between_mm: functional insulation between different AC nets (across F1 and the open relay contacts),
    # IEC 60664-1 Table F.4 250 V OVC II PD2 printed board (PM D11 2026-10-22, review 2b B1)
    - {name: mains-SELV, nets: [AC_L_IN, AC_L, AC_ROOM1, AC_ROOM2], clearance_mm: 6.0, creepage_mm: 6.0, between_mm: 1.5, req: R10}

libraries: [lib]

nets:
  GND: {class: ground}
  # VBAT_RAW / VBAT_P carry the R4 guard path (BT1.1 -> M1/M2 -> C1.1): their width comes from `budgets: guard_copper`
  # at the placement (no hand width). SW_BOOST and +3V3 use the class defaults; the router
  # necks wide nets down (max 3 mm) at the 0.5 mm-pitch U2 pads (MAX17227A TDFN-8: only LX, pin 3, needs a neck).
  VBAT_RAW: {class: power, current_a: 1.2, external_supply: true}
  VBAT_P: {class: power, current_a: 1.5, external_supply: true}
  # VIN_BST: U2 IN behind the R35 limiter M4 (AO3413, ON with the guard; body diode in sleep and on lithium)
  VIN_BST: {class: power, current_a: 1.5, external_supply: true}
  SW_BOOST: {class: switching, current_a: 1.5}
  +3V3: {class: power, current_a: 0.5}
  SENS_EN: {class: signal, current_a: 0.05, external_supply: true}
  K1_COIL_A: {current_a: 0.1}
  K1_COIL_B: {current_a: 0.1}
  K2_COIL_A: {current_a: 0.1}
  K2_COIL_B: {current_a: 0.1}
  # 230 V copper on B.Cu and F.Cu (conflicts.md D9, PM 2026-10-22, layout round 2): F.Cu is allowed only inside the
  # mains region (x <= 20), which on face A lies under the MP1 insulating sheet (R26); the mains region rule keeps it there
  # Layout round 4 (between_mm 1.5): one layer per net makes the AC routing planar. AC_ROOM1 (J1.2 -> K1.14) must
  # cross the J1.1-F1-K1.13 chain and AC_ROOM2 must cross AC_L (F1.2 -> K2.13), so the line nets use B.Cu and
  # the room nets F.Cu (both layers already approved, D9); crossings then need no vias.
  # min_width_mm 1.0 on every 230 V net (R13; D15 reverts D14): a neck under 1.0 mm melts before F1 opens (review 2c:
  # 0.15 mm neck 2.3 A2s, 1.0 mm 102 A2s, F1 T3.15A pre-arcing I2t 98 A2s, notes/parts-230v.md)
  AC_L_IN: {class: mains, current_a: 3, width_mm: 1.0, min_width_mm: 1.0, req: R13, layers: [B.Cu]}
  AC_L: {class: mains, current_a: 3, width_mm: 1.0, min_width_mm: 1.0, req: R13, layers: [B.Cu]}
  AC_ROOM1: {class: mains, current_a: 1.5, width_mm: 1.0, min_width_mm: 1.0, req: R13, layers: [F.Cu]}
  AC_ROOM2: {class: mains, current_a: 1.5, width_mm: 1.0, min_width_mm: 1.0, req: R13, layers: [F.Cu]}
  NTC1_A: {class: signal, sensitive: true}
  NTC2_A: {class: signal, sensitive: true}
  AIN_NTC1: {class: signal, sensitive: true}
  AIN_NTC2: {class: signal, sensitive: true}
  AIN_REF: {class: signal, sensitive: true}
  VBAT_ADC: {class: signal, sensitive: true}
  XTAL_P: {class: signal, sensitive: true}
  XTAL_N: {class: signal, sensitive: true}

# Floorplan (architecture.md 6.3, adapted 2026-10-22 to the MAX17227A board and the 11 mm battery distance of R15).
# Board mm, origin top left, y down. Front = face A (cells, module, SMD), back = face B (relays, J1, F1, C1/C2).
floorplan:
  construction: double
  depth:
    limit_mm: 30                       # R2
  regions:
    - {name: notch_l, kind: keepout, circle: [2.25, 23, 4], conductive: true, cut: true, source: "R1 503 frame screw boss (8 mm notch); the screw is accessible metal (R10)"}
    - {name: notch_r, kind: keepout, circle: [85.75, 23, 4], conductive: true, cut: true, source: "R1"}
    # 230 V zone x <= 20 (architecture 6.3); the AC_* pads (K1/K2 contacts, F1, J1) stay inside, 6 mm to every SELV region
    - {name: mains, kind: mains, rect: [0, 0, 20, 46], nets: ["AC_*"], isolation_mm: 6.0, source: "R10 reinforced 6.0 mm creepage"}
    # relay bodies and the back-side terminals bridge the 6 mm band (coil pads at x 22.25 are SELV)
    - {name: hv_parts, kind: barrier, rect: [0, 0, 26, 46], items: [relays, terminals], source: "K1/K2 courtyards x 0.25-24.75"}
    - {name: selv, kind: selv, rect: [26, 0, 88, 46], items: [selv_parts], source: "R10: every SELV part 6 mm from the 230 V zone"}
    # cells (BT2 y 0.25-12.55, BT1 y 13.35-25.65, x 28.25-76.75) and, below them on the left, room for the guard block
    # (9.2 x 5.1) between BT1 and the C1 through-hole pads (y 33-35), on the BT1.1 -> C1.1 path of the R4 budget
    - {name: battery, kind: battery, poly: [[26, -0.5], [80, -0.5], [80, 27], [42, 27], [42, 32.5], [26, 32.5]],
       items: [cells, guard], source: "MY-AAA-20-J/19-J clip-pair courtyards (2026-10-22); rev_guard_2pfet courtyard"}
    # U1 antenna keep-out from the module footprint (local x -6.6..6.6, y -8.3..-2.9 at 62, 37.5 rot 180), at the y = 46 edge
    - {name: antenna, kind: antenna, rect: [55.4, 40.4, 68.6, 46], allow: [module], isolation_mm: 15, from: [mains, hv_parts],
       source: "R15: 15 mm to the relays and 230 V copper; ESP32-C3-MINI-1 datasheet keep-out"}
    # same area, second distance: R15 asks 11 mm (not 15) to the cells and battery contacts (PM 2026-10-21)
    - {name: antenna_cells, kind: antenna, rect: [55.4, 40.4, 68.6, 46], allow: [module], isolation_mm: 11, from: [battery],
       source: "R15 battery distance 11 mm (conflicts.md 2026-10-21)"}
  items:
    - {name: relays, refs: [K1, K2], height_mm: 15.8, protrusion_mm: 1.0, source: "ADW1103HLW low profile 15.8 mm (notes/parts.md 3)"}
    - {name: terminals, refs: [J1, F1], height_mm: 15.8, source: "F1 8.1 mm (Walter 2010 datasheet 6-1); J1 KF128-5.08 14.1 mm above the board (Kefa drawing rev A)"}
    - {name: cells, refs: [BT1, BT2], height_mm: 12.0, source: "Myoung MY-AAA-19-J/20-J clip 10.46 +-0.5 high (WD-CP-0276/0277), LR03 10.5 cell in the clip: about 11 mm, 12.0 kept"}
    - {name: guard, refs: [M1, M2], height_mm: 1.1, source: "SOT-23"}
    - {name: bulk, refs: [C1, C2], height_mm: 11.0, source: "D10 can lying + lead bend about 1 (notes/parts.md 3)"}
    - {name: module, refs: [U1], height_mm: 2.4, source: "ESP32-C3-MINI-1 datasheet (notes/parts-mcu-sensing.md 6)"}
    - {name: probes, refs: [J2], height_mm: 3.8, source: "notes/parts.md 19 (recall)"}
    - {name: selv_parts, groups: [power, mcu, ui, sensing, relay], source: "every other low-voltage part"}

# R4 copper budget: the part of the forward-drop margin layout may spend on the guard path copper.
budgets:
  - name: guard_copper
    req: R4
    kind: copper_r
    # v(VBAT_RAW) - v(VBAT_P) post-layout: VBAT_RAW maps to BT1.1 (first part on the net), VBAT_P to C1.1;
    # M1/M2 (AO3401A symbol: 1 G, 2 S, 3 D) drain pin 3 on VBAT_RAW, source pin 2 on VBAT_P
    path: ["BT1.1 -> M1.3, M2.3", "M1.2, M2.2 -> C1.1"]
    current_a: 0.7
    max_mohm: 13.64
    source: "PM 2026-10-22: R4 relaxed to 55 mV and held at the AO3413 RDS(on) maximum (130 mOhm at -1.8 V = 1.53 x typ): 29.705 mV x 1.53 = 45.45 mV for the FETs, (55 - 45.45) mV / 0.7 A = 13.64 mOhm copper. Previous: R4 50 mV - 29.705 mV pre-layout worst case with AO3413 (guard_forward_drop @ 45C, build/status.json, 2026-10-22; was 38.99 mV with CJ2305) = 20.295 mV at 0.7 A = 28.99 mOhm. At the AO3413 RDS(on) maximum (130 mOhm at -1.8 V, x1.53 typ) the FETs alone drop about 45 mV: copper <= 7 mOhm would be needed for that corner (notes/circuit.md)"

# Layout blocks (blocks/<name>/block.yaml). tps61299_boost no longer applies (U2 is the MAX17227A).
blocks:
  # guard fixed at block rot 0 (FET drains toward BT1.1, sources toward C1.1): the placer's rot 180 (drains away
  # from BT1) doubled the path back and failed R4 (17.3 and 19.8 mOhm against 15.72; rot 0 attempts 10.9-12.5)
  guard: {use: rev_guard_2pfet, parts: {MA: M1, MB: M2}, at: {x: 33.85, y: 29.7, rot: 0, fixed: true}}   # y 29.7: courtyard 0.15 mm clear of the C1 THT pads (y 33)
  mcu: {use: esp32c3_mini_decoupling, parts: {U: U1, C100N: C7, C10U: C6},
        at: {x: 62, y: 37.5, rot: 180, fixed: true}}               # antenna at the y = 46 edge (R15)

components:
  # ------------------------------------------------------------ power: cells, reverse guard, bulk, boost
  # BT1, BT2: one AAA cell each in a pair of Myoung SMT clips, MY-AAA-20-J (+, C6937107) and MY-AAA-19-J (- with
  # spring, C6937104), review-2 round 2026-10-22: BH-AAA-B5AA001 is a 2-cell holder (62.2 mm, notes/footprints.md) that
  # does not fit. Footprint from Myoung drawings WD-CP-0277 / WD-CP-0276 (PCB layout: lands 9 x 5 min, 28 mm apart),
  # courtyard 48.5 x 12.3 mm. Price per cell = both clips at LCSC 5-49 pcs (0.0976 + 0.1503). The mpn/lcsc fields
  # name both clips (bag-packed, hand placed or JLCPCB extended).
  # floorplan: cells on the front, two rows on x 28.25-76.75 (8.25 mm from the 230 V zone x <= 20, 4.7 mm from the
  # notch_r keep-out); BT1 in the lower row (y 13.35-25.65) so BT1.1 (VBAT_RAW, left) sits 7 mm above the guard block
  # (R4 path), BT2 in the upper row (y 0.25-12.55) with GND on the left; BAT_MID pads on the right, one above the other.
  # The lower row is 14.75 mm from the U1 antenna keep-out (y 40.4; R15 asks 11).
  BT1:
    value: AAA
    mpn: MY-AAA-20-J + MY-AAA-19-J
    lcsc: C6937107 + C6937104
    price_usd: 0.2479
    datasheet: https://datasheet.lcsc.com/datasheet/pdf/79e836848861264c18b59c7e848332da.pdf
    symbol: Device:Battery_Cell
    footprint: thermo:Battery_AAA_Myoung_MY-AAA-20-J_19-J
    pins: {"1": VBAT_RAW, "2": BAT_MID}
    group: power
    placement: {x: 52.5, y: 19.5, rot: 0, fixed: true}     # pad 1 (+, VBAT_RAW) left at (33.75, 19.5)
    spice: false
  BT2:
    value: AAA
    mpn: MY-AAA-20-J + MY-AAA-19-J
    lcsc: C6937107 + C6937104
    price_usd: 0.2479
    datasheet: https://datasheet.lcsc.com/datasheet/pdf/b5953874350f465dec3e0fbc2666dcb4.pdf
    symbol: Device:Battery_Cell
    footprint: thermo:Battery_AAA_Myoung_MY-AAA-20-J_19-J
    pins: {"1": BAT_MID, "2": GND}
    group: power
    placement: {x: 52.5, y: 6.4, rot: 180, fixed: true}    # rot 180: BAT_MID pad right at (71.25, 6.4), above BT1.2; GND left
    spice: false
  # Reverse guard and R35 voltage limit (round 3): M1 || M2 gates on VBAT_EN (IO2), shared with M3 (divider).
  # R14 1 M pulls the gates to the source: the guard is OFF by default (sleep, reset, dead board, reversed
  # cells) and the cells reach VBAT_P through the body diodes, so VBAT_P <= VBAT_RAW - Vf (AO3413: 0.22-0.30 V at uA,
  # 0-45 C, data sheet Fig. 6); the boost input VIN_BST sits one more body diode lower (M4, below).
  # PM D4 (review-2 round, 2026-10-22): CJ2305 -> AO3413 (C86648): the dead-board insertion surge (about 4.1 A per FET for
  # a few ms) is inside the AO3413 single-pulse rating (Fig. 10, 10 ms), notes/parts.md 0c. Same SOT-23 pinout G1 S2 D3.
  # Firmware (notes/circuit.md rule 8) keeps the guard ON during a wake while the last guard-ON VBAT reading
  # is < 3.35 V (alkaline); lithium (3.6-3.7 V) stays OFF. VBAT_P(off) < 2.85 V is used only after a cold boot.
  # No added part; R1, Q1, R17, C20 removed (notes/circuit.md, R35).
  M1:
    value: AO3413
    mpn: AO3413
    lcsc: C86648
    price_usd: 0.092
    datasheet: https://www.aosmd.com/res/datasheets/AO3413.pdf
    symbol: Transistor_FET:AO3401A
    footprint: Package_TO_SOT_SMD:SOT-23
    pins: {"1": VBAT_EN, "2": VBAT_P, "3": VBAT_RAW}
    group: power
    spice: {lib: models/thermo.lib, subckt: AO3413, ports: ["3", "1", "2"], source: fit}
  M2:
    value: AO3413
    mpn: AO3413
    lcsc: C86648
    price_usd: 0.092
    datasheet: https://www.aosmd.com/res/datasheets/AO3413.pdf
    symbol: Transistor_FET:AO3401A
    footprint: Package_TO_SOT_SMD:SOT-23
    pins: {"1": VBAT_EN, "2": VBAT_P, "3": VBAT_RAW}
    group: power
    spice: {lib: models/thermo.lib, subckt: AO3413, ports: ["3", "1", "2"], source: fit}
  # C1/C2: 2 x 3300 uF 10 V (round 3 product decision: keep the small caps; the R3 corner is now at 2.0 V)
  C1:
    value: 3300u
    mpn: RL1A332MG250A00CE0
    lcsc: C240437
    price_usd: 0.148
    symbol: Device:C_Polarized
    footprint: thermo:CP_Radial_D10.0mm_P5.00mm_back
    pins: {"1": VBAT_P, "2": GND}
    voltage_rating_v: 10
    tolerance: 0.2
    group: power
    placement: {x: 36, y: 34, rot: 0, fixed: true}   # SELV, back side, outside the cell courtyards (THT pads)
    spice: {esr: 0.1}
  C2:
    value: 3300u
    mpn: RL1A332MG250A00CE0
    lcsc: C240437
    price_usd: 0.148
    symbol: Device:C_Polarized
    footprint: thermo:CP_Radial_D10.0mm_P5.00mm_back
    pins: {"1": VBAT_P, "2": GND}
    voltage_rating_v: 10
    tolerance: 0.2
    group: power
    placement: {x: 48, y: 34, rot: 0, fixed: true}
    spice: {esr: 0.1}
  # C3: 22 uF at U2 IN (MAX17227A datasheet: a standard 22 uF ceramic minimum at the input); on VIN_BST (after M4)
  C3:
    value: 22u
    mpn: CL21A226MAQNNNE
    lcsc: C45783
    price_usd: 0.1503
    symbol: Device:C
    footprint: Capacitor_SMD:C_0805_2012Metric
    pins: {"1": VIN_BST, "2": GND}
    voltage_rating_v: 25
    decouples: U2
    group: power
    placement: {x: 54.1, y: 39.6, rot: 90, fixed: true}     # boost cluster (stage 7, diagnosis): pad 1 at U2 pins 7-8
  L1:
    value: 1u
    mpn: DFE201610E-1R0M=P2
    lcsc: C161082
    price_usd: 0.205
    symbol: Device:L
    footprint: Inductor_SMD:L_Murata_DFE201610P
    pins: {"1": VIN_BST, "2": SW_BOOST}
    group: power
    placement: {x: 48.4, y: 41.7, rot: 0, fixed: true}      # boost cluster: pad 2 0.6 mm from U2 pin 3 (LX), short LX node
  # U2: MAX17227A replaces TPS61299 (2026-10-21, PM-approved package change): the SOT-563 walled in SW and VOUT at
  # 0.5 mm pitch (hwflow check `escape`, 2 pads). TDFN-8: OUT on pins 1-2 (row end), LX pin 3 is the only fine-pitch
  # neck. 2 A peak inductor limit (1.8 A min), 350 nA IQ into OUT. RSEL (R40) 191 k 1 % to GND = 3.3 V; EN tied to IN.
  # Numbers: notes/datasheets/MAX17227A.md; decision: notes/parts.md section 0b.
  U2:
    value: MAX17227A 3.3V
    mpn: MAX17227AATA+T
    lcsc: C7419179
    price_usd: 2.5275
    datasheet: https://www.analog.com/media/en/technical-documentation/data-sheets/max17227a.pdf
    symbol: thermo:MAX17227A
    footprint: Package_DFN_QFN:TDFN-8-1EP_2x2mm_P0.5mm_EP0.8x1.2mm
    pins: {"1": +3V3, "2": +3V3, "3": SW_BOOST, "4": GND, "5": GND, "6": BOOST_RSEL, "7": VIN_BST, "8": VIN_BST, "9": GND}
    thermal_vias: {pad: "9", count: 2}   # notes/layout-constraints.md 3: 2 EP vias to the inner GND plane (0.8 x 1.2 mm EP)
    group: power
    placement: {x: 51.4, y: 41.2, rot: 0, fixed: true}      # boost cluster: OUT/LX/GND column left, IN/RSEL right
    # averaged behavioral boost MAX17227A_AVG (ports vin sw en vout gnd), typical data sheet values: IPK 2.0 A peak
    # limit (average input limit = IPK - VIN x tON / 2L, tON fitted to 620 ns at 1.2 V and 300 ns at 3.0 V), ULPM offset
    # +2.7 %, IQ 350 nA OUT + 12 nA IN, EFFL 0.90 (90 % at 10 uA), EFFH 0.89 (conduction-loss calculation);
    # corners and sources in notes/models.md
    spice: {lib: models/thermo.lib, subckt: MAX17227A_AVG, ports: ["7", "3", "8", "1", "4"], source: behavioral,
            params: {VOUT: 3.3, EFFH: 0.89, EFFL: 0.90, IPK: 2.0, TONK: 1, LIND: 1, OFS: 0.027, IQ: 350n, IQIN: 12n, RREG: 0.05}}
  # R40: MAX17227A output select, 191 k 1 % to GND = 3.3 V (datasheet Table 1); read once at start-up (200 uA for
  # about 0.6 ms), no DC current afterwards; keep the RSEL node under 2 pF (short trace next to U2 pin 6)
  # Layout (notes/layout-constraints.md): R40 within 1-2 mm of U2 pad 6, no plane under R40 or the pad-6 trace (< 2 pF),
  # routed away from LX (SW_BOOST) and L1. `decouples: U2` makes the placer keep R40 at pad 6 (shared net BOOST_RSEL).
  R40:
    value: 191k
    mpn: 0402WGF1913TCE
    lcsc: C270632
    price_usd: 0.0012
    symbol: Device:R
    footprint: Resistor_SMD:R_0402_1005Metric
    tolerance: 0.01
    pins: {"1": BOOST_RSEL, "2": GND}
    decouples: U2
    group: power
    placement: {x: 53.6, y: 43.1, rot: 270, fixed: true}    # boost cluster: pad 1 about 1.6 mm of trace from U2 pad 6, away from LX/L1
  # C4, C5: U2 output, 2 x 47 uF 10 V X5R 1206 (2026-10-22 delta review + PM decision, was 2 x 10 uF 0805). MAX17227A data sheet
  # p.19: more output capacitance when VIN approaches VOUT (lithium, guard OFF: VBAT_P 3.19-3.31 V against the 3.389 V
  # ULPM level). Effective 26.3 uF each at 3.4 V (Samsung DC-bias curve, -44 %), 52.6 uF total; the switching testbench
  # (sw_ulpm_*) gives the ULPM peak at typical values (notes/circuit.md). X5R instead of the recommended X7R: 0-45 C ambient (R29)
  # is inside the X5R range (TCC -1.5 % at 0 C, Samsung curve). ESR 3 mOhm assumed. Next to U2 pins 1-2, ground to pin 4.
  C4:
    value: 47u
    mpn: CL31A476MPHNNNE
    lcsc: C96123
    price_usd: 0.168
    symbol: Device:C
    footprint: Capacitor_SMD:C_1206_3216Metric
    pins: {"1": +3V3, "2": GND}
    voltage_rating_v: 10
    tolerance: 0.2
    decouples: U2
    group: power
    placement: {x: 50.22, y: 38.7, rot: 0, fixed: true}    # boost cluster: pad 1 at U2 pins 1-2, GND pad over the EP
    spice: {esr: 3m}
  C5:
    value: 47u
    mpn: CL31A476MPHNNNE
    lcsc: C96123
    price_usd: 0.168
    symbol: Device:C
    footprint: Capacitor_SMD:C_1206_3216Metric
    pins: {"1": +3V3, "2": GND}
    voltage_rating_v: 10
    tolerance: 0.2
    decouples: U2
    group: power
    placement: {x: 50.22, y: 36.3, rot: 0, fixed: true}    # boost cluster: parallel to C4
    spice: {esr: 3m}
  # C22: third 47 uF output cap (PM decision D1, review-2 round 2026-10-22, conflicts.md): covers the LPM -> HPM
  # transition dip that the averaged U2 model does not show (R3). Same part as C4/C5. Next free spot on the C4/C5 column:
  # above C5 (courtyard y 32.75-35.05), pad 1 (+3V3) on the left like C4/C5, 0.95 mm from the C2 THT pad (48, 34).
  C22:
    value: 47u
    mpn: CL31A476MPHNNNE
    lcsc: C96123
    price_usd: 0.168
    symbol: Device:C
    footprint: Capacitor_SMD:C_1206_3216Metric
    pins: {"1": +3V3, "2": GND}
    voltage_rating_v: 10
    tolerance: 0.2
    decouples: U2
    group: power
    placement: {x: 52.0, y: 33.9, rot: 0, fixed: true}
    spice: {esr: 3m}
  # battery voltage divider, switched (R22)
  M3:
    value: CJ2305
    mpn: CJ2305
    lcsc: C8549
    price_usd: 0.042
    symbol: Transistor_FET:AO3401A
    footprint: Package_TO_SOT_SMD:SOT-23
    pins: {"1": VBAT_EN, "2": VBAT_P, "3": VDIV_TOP}
    group: power
    spice: {lib: models/thermo.lib, model: CJ2305, ports: ["3", "1", "2"], source: fit}
  # R14: fail-safe pull-up of the M1/M2/M3 gates to VBAT_P (guard OFF unless IO2 drives low)
  R14:
    value: 1meg
    symbol: Device:R
    footprint: Resistor_SMD:R_0402_1005Metric
    price_usd: 0.002
