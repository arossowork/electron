[project]
name = "hwplatform"
version = "0.1.0"
description = "Hosted multi-tenant hwflow platform: API, tenancy, auth (epic #21)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=43",
    "httpx>=0.27",
    "boto3>=1.43.118",
    "nats-py>=2.16.0",
]

[project.scripts]
hwplatform-api = "hwplatform.main:run"
hwplatform-migrate = "hwplatform.main:migrate"
hwplatform-relay = "hwplatform.main:relay"
hwplatform-rotate-master = "hwplatform.main:rotate_master"
hwplatform-purge = "hwplatform.main:purge"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the compose Postgres, SeaweedFS (S3) and NATS; skipped when they do not answer"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["hwplatform"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S608", "E501"]
# Identifiers in DDL come from code or a validated setting, never from a request.
"src/hwplatform/migrations/*" = ["S608", "E501"]
# Raw SQL strings (ADR 3.4 DDL and queries) are kept readable on one line each.
"src/hwplatform/runs.py" = ["E501", "S608"]
