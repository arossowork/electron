# /etc/nginx/apps.d/hwflow.conf: /hwflow/ -> Service hwflow in namespace hwflow, prefix stripped.
location = /hwflow { return 301 /hwflow/; }
location /hwflow/ {
    set $hwflow hwflow.hwflow.svc.cluster.local;
    rewrite ^/hwflow/(.*)$ /$1 break;
    proxy_pass http://$hwflow:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;           # Server-Sent Events: stream agent output as it arrives
    proxy_read_timeout 3600s;
    client_max_body_size 20m;
}
