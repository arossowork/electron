# /etc/nginx/sites-enabled/apps: the one entry point of the VPS. ngrok forwards its HTTPS domain to 127.0.0.1:80;
# nothing listens publicly. `/` is the app selector (/var/www/apps/index.html). An app is one file in
# /etc/nginx/apps.d/ that maps a path prefix to a k3s Service by its cluster DNS name. The basic-auth login below
# applies to every app unless its file says `auth_basic off` (apps with their own accounts, like singing).
server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    access_log /var/log/nginx/apps.access.log;
    error_log  /var/log/nginx/apps.error.log;

    resolver 10.43.0.10 valid=30s ipv6=off;  # k3s CoreDNS: Services resolve even after they are recreated
    auth_basic           "apps";
    auth_basic_user_file /etc/nginx/apps.htpasswd;

    location = / {
        auth_basic off;
        root /var/www/apps;
        try_files /index.html =404;
    }
    include /etc/nginx/apps.d/*.conf;
}
