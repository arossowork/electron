project: sensor_preamp
description: USB 5V powered, 3.3V LDO, x10 non-inverting preamp for a 0-100mV sensor, 1kHz bandwidth, status LED.
board: {width_mm: 40, height_mm: 30, layers: 2, optimize_area: true}
nets:
  VBUS: {class: power, current_a: 0.1, external_supply: true}
  +3V3: {class: power, current_a: 0.05}
  GND: {class: ground}
  SENS_IN: {class: signal, sensitive: true}
  AMP_OUT: {class: signal}
components:
  J1:
    value: Conn_01x04
    symbol: Connector_Generic:Conn_01x04
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
    pins: {"1": VBUS, "2": SENS_IN, "3": AMP_OUT, "4": GND}
    spice: false
    placement: {edge: left}
  U1:
    value: AP2112K-3.3
    mpn: AP2112K-3.3TRG1
    symbol: Regulator_Linear:AP2112K-3.3
    footprint: Package_TO_SOT_SMD:SOT-23-5
    pins: {"1": VBUS, "2": GND, "3": VBUS, "5": +3V3}
    nc: ["4"]
    spice: {subckt: LDO_GENERIC, ports: ["1", "5", "2"], params: {VOUT: 3.3, VDROP: 0.25, IQ: 55u, PSRR_DB: 65, ILIM: 0.6}}
    theta_ja: 250
    group: power
  C1: {value: 1u, symbol: Device:C, footprint: Capacitor_SMD:C_0603_1608Metric, voltage_rating_v: 16, pins: {"1": VBUS, "2": GND}, group: power, decouples: U1}
  C2: {value: 1u, symbol: Device:C, footprint: Capacitor_SMD:C_0603_1608Metric, voltage_rating_v: 16, pins: {"1": +3V3, "2": GND}, group: power, decouples: U1}
  U2:
    value: OPA333
    mpn: OPA333AIDBVR
    datasheet: https://www.ti.com/lit/ds/symlink/opa333.pdf
    symbol: Amplifier_Operational:OPA333xxDBV
    footprint: Package_TO_SOT_SMD:SOT-23-5
    pins: {"1": AMP_OUT, "2": GND, "3": SENS_IN, "4": FB, "5": +3V3}
    spice: {subckt: OPAMP_GENERIC, ports: ["3", "4", "1", "5", "2"], params: {GBW: 350k, AOL: 2meg, VOS: 10u, IQ: 25u, EN: 55n, VDROP: 30m, SR: 0.16meg}}
    group: amp
  C3: {value: 100n, symbol: Device:C, footprint: Capacitor_SMD:C_0603_1608Metric, voltage_rating_v: 16, pins: {"1": +3V3, "2": GND}, group: amp, decouples: U2}
  R1: {value: 90.9k, symbol: Device:R, footprint: Resistor_SMD:R_0603_1608Metric, pins: {"1": AMP_OUT, "2": FB}, group: amp}
  R2: {value: 10k, symbol: Device:R, footprint: Resistor_SMD:R_0603_1608Metric, pins: {"1": FB, "2": GND}, group: amp}
  C4: {value: 1.5n, symbol: Device:C, footprint: Capacitor_SMD:C_0603_1608Metric, voltage_rating_v: 16, pins: {"1": AMP_OUT, "2": FB}, group: amp}
  R3: {value: 1k, symbol: Device:R, footprint: Resistor_SMD:R_0603_1608Metric, pins: {"1": +3V3, "2": LED_A}, group: power}
  D1: {value: green, symbol: Device:LED, footprint: LED_SMD:LED_0603_1608Metric, pins: {"1": GND, "2": LED_A}, spice: {model: LED_GREEN}, group: power}
sim:
  ambient_c: 40
  sources:
    - {name: VBUS_SRC, p: J1.1, n: J1.4, value: "DC 5 AC 0 PULSE(4.5 5.25 2m 10u 10u 2m 4m)"}
    - {name: VSIG, p: J1.2, n: J1.4, value: "DC 0.05 AC 1 SIN(0.05 0.05 100)"}
    - {name: RLOAD, p: J1.3, n: J1.4, value: "100k"}
  analyses:
    - name: dc_op
      cmd: op
      measures:
        - {name: v3v3, expr: "v(+3V3)", min: 3.25, max: 3.35, unit: V, req: R2}
        - {name: vout_dc, expr: "v(AMP_OUT)", min: 0.48, max: 0.55, unit: V, req: R3}
        - {name: i_supply, expr: "-i(VBUS_SRC)*1000", max: 5, unit: mA, req: "R1,R5"}
    - name: ac_gain
      cmd: ac dec 50 1 1meg
      measures:
        - {name: gain_db, meas: "find vdb(AMP_OUT) at=100", min: 19.8, max: 20.2, unit: dB, req: R3}
        - {name: f3db, meas: "when vdb(AMP_OUT)=17 fall=1", min: 900, max: 1500, unit: Hz, req: R4}
    - name: noise
      cmd: noise v(AMP_OUT) VSIG dec 20 1 100k
      scope: {nets: [AMP_OUT], boundary: [+3V3]}   # the amplifier alone; validated against the full board
      measures:
        - {name: out_noise_uv, plot: noise2, expr: "onoise_total*1e6", max: 60, unit: uVrms, req: R6}
      monte_carlo: false
    - name: line_transient
      cmd: tran 20u 40m
      measures:
        - {name: ripple_3v3_mv, meas: "pp v(+3V3) from=1m to=40m", scale: 1000, max: 20, unit: mV, req: R2}
        - {name: sig_pp, meas: "pp v(AMP_OUT) from=10m to=40m", min: 0.95, max: 1.05, unit: V, req: R3}
