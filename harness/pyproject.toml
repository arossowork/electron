[project]
name = "hwharness"
version = "0.1.0"
description = "Agent harness around the hwflow engine: claude -p sessions, the product-person protocol and the evaluation scorer."
requires-python = ">=3.11"
dependencies = ["hwflow", "pyyaml>=6"]

[project.entry-points."hwflow.hooks"]
harness = "hwharness.hooks:register"

[tool.uv.sources]
hwflow = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
