floorplan:
  construction: double
  depth:
    limit_mm: 11.1
    source: 'R24: tallest front part 7.5 mm above PCB top (knob shaft excluded) + 1.6 mm board (R34) + 2.0 mm back allowance
      = hot-swap socket height (assumption: nothing on the back taller than the sockets, case bottom sees one flat level)'
  regions:
  - name: key_matrix
    kind: other
    items: []
    isolation_mm: 5
    from: []
    source: 'ANSI 104 at 19.05 mm pitch: 22.5 u x 6.5 u = 428.6 x 123.8 mm; R35 no matrix trace within 5 mm of the audio region'
    rect:
    - 0.0
    - 0.0
    - 54.5
    - 7.0
  - name: ui
    kind: other
    items: []
    source: R28 knob on the front strip, next to the audio corner (not inside it); 255 mm2 in 440 (58 %)
    rect:
    - 0.0
    - 7.0
    - 5.25
    - 29.0
  - name: audio_dig
    kind: other
    items:
    - audio_bridge
    - mcu
    source: 'USB audio bridge and keyboard MCU: 539 mm2 in 880 (61 %); USB traces stay >= 24 mm from the audio region (R35
      asks 5 mm)'
    rect:
    - 7.25
    - 7.0
    - 47.25
    - 29.0
  - name: power_a
    kind: other
    items: []
    source: '5 V buck (USB-A + internal), 3.3 V / 0.9 V bucks, +-5.5 V audio pre-regulator: 785 mm2 in 1232 (64 %), 66 mm
      from audio (R35 30)'
    rect:
    - 49.25
    - 7.0
    - 54.5
    - 29.0
  items:
  - name: audio_bridge
    groups:
    - audio_bridge
    side: front
    height_mm: 1.2
    source: 'pass C real parts: XU316 QFN-60 7x7, W25Q64 SOIC-8, 24 MHz crystal, 2 MCLK oscillators, decoupling, JTAG pads'
  - name: mcu
    groups:
    - mcu
    height_mm: 1.0
    source: RP2040 QFN-56 + W25Q16 SOIC-8 + 12 MHz crystal, buttons, SWD pads
