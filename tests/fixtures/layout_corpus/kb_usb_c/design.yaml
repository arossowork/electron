floorplan:
  construction: double
  depth:
    limit_mm: 11.1
    source: 'R24: tallest front part 7.5 mm above PCB top (knob shaft excluded) + 1.6 mm board (R34) + 2.0 mm back allowance
      = hot-swap socket height (assumption: nothing on the back taller than the sockets, case bottom sees one flat level)'
  regions:
  - name: key_matrix
    kind: other
    items: []
    isolation_mm: 5
    from: []
    source: 'ANSI 104 at 19.05 mm pitch: 22.5 u x 6.5 u = 428.6 x 123.8 mm; R35 no matrix trace within 5 mm of the audio region'
    rect:
    - 0.0
    - 0.0
    - 36.0
    - 5.15
  - name: hub
    kind: other
    items: []
    source: hub between the USB-A and USB-C ports; upstream SuperSpeed pairs come down the nav/numpad channel (x ~356); 428
      mm2 in 836 (51 %)
    rect:
    - 0.0
    - 5.15
    - 3.0
    - 27.15
  - name: usb_c
    kind: other
    items:
    - usbc1
    - usbc2
    - usbc_mux
    source: R3, R14; 273 mm2 in 572 (48 %); USB-C charge ports 209 mm from the audio region
    rect:
    - 5.0
    - 5.15
    - 31.0
    - 27.15
  - name: power_b
    kind: other
    items: []
    source: 'two PD source bucks next to the C ports with the stage-5 LMV339 / 2N7002 logic: 75 % of 1694 mm2 front (floorplan
      check 2026-10-24, limit 85 %); 20 V arrives from back_conn down the right edge on L3'
    rect:
    - 33.0
    - 5.15
    - 36.0
    - 27.15
  items:
  - name: usbc1
    refs:
    - J311
    height_mm: 3.3
    source: HCTL USB-C 24P mid-mount (provisional footprint, B1)
  - name: usbc2
    refs:
    - J312
    height_mm: 3.3
    source: same
  - name: usbc_mux
    groups:
