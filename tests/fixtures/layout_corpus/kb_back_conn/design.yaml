floorplan:
  construction: double
  depth:
    limit_mm: 11.1
    source: 'R24: tallest front part 7.5 mm above PCB top (knob shaft excluded) + 1.6 mm board (R34) + 2.0 mm back allowance
      = hot-swap socket height (assumption: nothing on the back taller than the sockets, case bottom sees one flat level)'
  regions:
  - name: key_matrix
    kind: other
    items: []
    isolation_mm: 5
    from: []
    source: 'ANSI 104 at 19.05 mm pitch: 22.5 u x 6.5 u = 428.6 x 123.8 mm; R35 no matrix trace within 5 mm of the audio region'
    poly:
    - - 82.25
      - 26.0
    - - 3.25
      - 26.0
    - - 3.25
      - 4.0
    - - 0.0
      - 4.0
    - - 0.0
      - 29.2
    - - 82.25
      - 29.2
  - name: back_conn
    kind: other
    items:
    - usbc_host
    - host_mux
    - usbc_pdin
    - pd_sink
    - vbus_path
    source: 'R9, R20: host and PD input on the back edge, in the blank 4 u x 1 u above the numpad (no switch there)'
    rect:
    - 5.25
    - 0.0
    - 82.25
    - 24.0
  items:
  - name: usbc_host
    refs:
    - J301
    height_mm: 3.3
    source: HCTL USB-C 24P mid-mount (provisional footprint, B1); under the plate gap 3.5 mm (C7)
  - name: host_mux
    groups:
    - usb_host
    height_mm: 1.0
    source: HD3SS3220 + host SS/D ESD arrays at the host connector
  - name: usbc_pdin
    refs:
    - J600
    at:
    - 43.25
    - 3.8
    side: front
    height_mm: 3.3
    source: USB-C power receptacle; centre 20 mm from the host socket (R20 <= 25)
  - name: pd_sink
    groups:
    - pd_sink
    - pwr_ctl
    side: front
    height_mm: 1.2
    source: 'pass B real parts: CH224D sink + AO4407A back-to-back + TVS, and the PD/bus mode logic (pwr_ctl)'
