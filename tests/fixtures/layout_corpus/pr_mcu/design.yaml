floorplan:
  construction: single
  wall_mm:
    left: 0.5
    right: 0.5
    top: 0.5
    bottom: 0.5
  depth:
    limit_mm: 2.9
    extra:
    - name: enclosure walls 2 x 0.5
      mm: 1.0
      source: R1, conflicts.md C1
    - name: assembly clearance over tallest part
      mm: 0.3
      source: R24 derivation
  regions:
  - name: antenna_keepout
    kind: antenna
    allow:
    - ble_module
    copper_keepout:
      layers:
      - F.Cu
      - In1.Cu
      - In2.Cu
      - B.Cu
      forbids:
      - tracks
      - vias
      - copperpour
    isolation_mm: 0
    source: 'ISP1807 datasheet: no metal between antenna end and board edge (notes/datasheets/isp1807.md); stage 4: DS1807
      R19 4.3 p14 keep-out zone 18.0 mm min along the board edge x 4.0 mm deep at the antenna end (the NC-pad half, pads 65-78,
      opposite pin 1; text positions read with pdftotext -bbox); module antenna end on the y = 0 edge'
    rect:
    - 2.25
    - 0.0
    - 20.25
    - 4.4
  - name: pogo_edge
    kind: other
    items: []
    source: 'R27: pogo pads within 3 mm of the device short edge; R17 TVS within 5 mm'
    rect:
    - 15.25
    - 20.0
    - 20.25
    - 23.0
  items:
  - name: ble_module
    footprint: pocket:ISP1807LR
    side: front
    at:
    - 16.25
    - 8.5
    rot: 180
    height_mm: 1.0
    refs:
    - U1
    source: 'ISP1807-LR 8 x 8 x 1.0 LGA, footprint pocket:ISP1807LR (SamacSys 1526419, 78 pads); rot 180 puts pads 65-78 (NC,
      antenna half: OUT_ANT pin 20 sits at its border, DS1807 p14 keep-out opposite pin 1) at board y 0.8-4.0 on the y = 0
      edge; signal pads 1-48 face the board interior'
  - name: swd_pads
    refs:
    - TP1
    - TP2
    - TP3
    - TP4
    side: front
    height_mm: 0.05
    source: 'SWDIO, SWDCLK, VDD, GND test pads (RESET pin 13 not brought out: inner pad, SWD works without it)'
  - name: storage_block
    refs:
    - U3
    - C8
    - C9
    - R10
    - R11
    - R12
    - R13
    - R14
    side: front
    height_mm: 1.0
    source: FLSD04GHFLT LGA-8 9.2 x 7.2 x 1.0 max (datasheet p7-8) + caps + pull-ups
  - name: module_support
    refs:
    - C15
    - C16
    - C11
    - C12
    - D2
    side: front
    height_mm: 0.6
    source: module and mic decoupling, button TVS
