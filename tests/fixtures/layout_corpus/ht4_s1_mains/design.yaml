floorplan:
  construction: double
  depth:
    limit_mm: 30
  regions:
  - name: notch_l
    kind: keepout
    circle:
    - 2.25
    - 23.0
    - 4.0
    conductive: true
    cut: true
    source: R1 503 frame screw boss (8 mm notch); the screw is accessible metal (R10)
  - name: mains
    kind: mains
    nets:
    - AC_*
    isolation_mm: 6.0
    source: R10 reinforced 6.0 mm creepage
    rect:
    - 0.0
    - 0.0
    - 20.0
    - 46.0
  - name: hv_parts
    kind: barrier
    items:
    - relays
    - terminals
    source: K1/K2 courtyards x 0.25-24.75
    rect:
    - 0.0
    - 0.0
    - 26.0
    - 46.0
  - name: selv
    kind: selv
    items:
    - selv_parts
    source: 'R10: every SELV part 6 mm from the 230 V zone'
    rect:
    - 26.0
    - 0.0
    - 33.0
    - 46.0
  - name: battery
    kind: battery
    items: []
    source: MY-AAA-20-J/19-J clip-pair courtyards (2026-10-22); rev_guard_2pfet courtyard
    rect:
    - 26.0
    - 0.0
    - 33.0
    - 32.5
  items:
  - name: relays
    refs:
    - K1
    - K2
    height_mm: 15.8
    protrusion_mm: 1.0
    source: ADW1103HLW low profile 15.8 mm (notes/parts.md 3)
  - name: terminals
    refs:
    - J1
    - F1
    height_mm: 15.8
    source: F1 8.1 mm (Walter 2010 datasheet 6-1); J1 KF128-5.08 14.1 mm above the board (Kefa drawing rev A)
  - name: selv_parts
    groups:
    - power
    - mcu
    - ui
    - sensing
    - relay
    source: every other low-voltage part
