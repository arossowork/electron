project: home_thermostat_4_cut_ht4_s1_mains
revision: A
description: layout cutout of home_thermostat_4 (ht4_s1_mains)
board:
  width_mm: 33.0
  height_mm: 46.0
  layers: 4
  thickness_mm: 1.6
  antenna_clearance_mm: 15
  copper_oz: 1.0
  drc_rules:
  - (rule fine_pitch (condition "A.memberOfFootprint('U2') || A.memberOfFootprint('U5')") (constraint clearance (min 0.15mm)))
  - (rule "mains_outer_only" (condition "A.intersectsArea('NO_MAINS_INNER') && A.NetClass == 'iso_mains_SELV'") (constraint
    disallow track via))
  isolation:
  - name: mains-SELV
    nets:
    - AC_L_IN
    - AC_L
    - AC_ROOM1
    - AC_ROOM2
    clearance_mm: 6.0
    creepage_mm: 6.0
    between_mm: 1.5
    req: R10
