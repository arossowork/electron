floorplan:
  construction: single
  wall_mm:
    left: 0.5
    right: 0.5
    top: 0.5
    bottom: 0.5
  depth:
    limit_mm: 2.9
    extra:
    - name: enclosure walls 2 x 0.5
      mm: 1.0
      source: R1, conflicts.md C1
    - name: assembly clearance over tallest part
      mm: 0.3
      source: R24 derivation
  regions:
  - name: pogo_edge
    kind: other
    items:
    - input_protection
    source: 'R27: pogo pads within 3 mm of the device short edge; R17 TVS within 5 mm'
    rect:
    - 17.0
    - 4.4
    - 21.65
    - 18.4
  items:
  - name: input_protection
    refs:
    - D1
    - M1
    - R8
    - D3
    side: front
    height_mm: 0.5
    source: TVS X1SON-2 + PMZ350UPE SOT883 + 100 k gate resistor + 6.2 V gate Zener SOD-882 (R17, R31)
  - name: led
    refs:
    - D4
    side: front
    at:
    - 19.0
    - 29.4
    height_mm: 0.5
    source: 0402 red LED under the light pipe, R13
  - name: cell_tabs
    refs:
    - J3
    - J4
    side: front
    height_mm: 0.3
    source: two nickel-tab solder pads of the VTC LP103053 cell 30 x 53 x 1.0 (hand solder, R22); cell beside the board at
      x = 0
  - name: pmic_block
    refs:
    - U2
    - L1
    - C1
    - C2
    - C3
    - C4
    - C5
    - C6
    - R1
    - R2
    - R3
    - R4
    - TH1
    side: front
    height_mm: 1.0
    source: nPM1300 QFN32 5x5 config 2 (one buck, PS v1.1 9.3) + L1 2016 1.0 mm + caps
  - name: storage_block
    refs:
    - U3
    - C8
    - C9
    - R10
    - R11
    - R12
    - R13
    - R14
    side: front
    height_mm: 1.0
    source: FLSD04GHFLT LGA-8 9.2 x 7.2 x 1.0 max (datasheet p7-8) + caps + pull-ups
  - name: protection_block
    refs:
    - U4
    - C10
    side: front
    height_mm: 0.8
    source: XB6166IS DFN-6 2x2 0.8 max + VDD cap
