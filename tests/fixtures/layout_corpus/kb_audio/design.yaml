floorplan:
  construction: double
  depth:
    limit_mm: 11.1
    source: 'R24: tallest front part 7.5 mm above PCB top (knob shaft excluded) + 1.6 mm board (R34) + 2.0 mm back allowance
      = hot-swap socket height (assumption: nothing on the back taller than the sockets, case bottom sees one flat level)'
  regions:
  - name: audio
    kind: other
    items:
    - hp_jack
    - mic_jack
    - audio_top
    isolation_mm: 30
    from: []
    source: 'R35 / C11: audio analog parts and jacks >= 30 mm from switching inductors and USB-C charge ports; 120 x 16.5
      = 1980 mm2; floorplan check 2026-10-24 after the stage-5 audio fixes: 71 % front (limit 85 %)'
    rect:
    - 3.0
    - 5.25
    - 123.0
    - 21.75
  - name: ui
    kind: other
    items: []
    source: R28 knob on the front strip, next to the audio corner (not inside it); 255 mm2 in 440 (58 %)
    rect:
    - 125.0
    - 0.0
    - 128.25
    - 21.75
  items:
  - name: hp_jack
    refs:
    - J930
    at:
    - 12.0
    - 14.75
    side: front
    height_mm: 5.37
    source: SJ-3524-SMT headphone jack (pass C), 5.37 mm high
  - name: mic_jack
    refs:
    - J980
    at:
    - 27.0
    - 14.75
    side: front
    height_mm: 5.37
    source: SJ-3524-SMT mic jack (pass C)
  - name: audio_top
    groups:
    - audio_dac
    - audio_hp
    - audio_ldo
    - audio_mic
    side: front
    height_mm: 2.8
    source: 'pass C real parts: DAC + ADC QFN, 4 OPA1612 SOIC-8, OPA1622 VSON, 4 LDOs, 4 x 330 uF tantalum B (2.1 mm), passives;
      all front (hwflow places every part on the front)'
