floorplan:
  construction: double
  depth:
    limit_mm: 30
  regions:
  - name: notch_r
    kind: keepout
    circle:
    - 33.8
    - 13.8
    - 4.0
    conductive: true
    cut: true
    source: R1
  - name: selv
    kind: selv
    items:
    - selv_parts
    source: 'R10: every SELV part 6 mm from the 230 V zone'
    rect:
    - 0.0
    - 0.0
    - 36.05
    - 36.8
  - name: battery
    kind: battery
    items: []
    source: MY-AAA-20-J/19-J clip-pair courtyards (2026-10-22); rev_guard_2pfet courtyard
    rect:
    - 0.0
    - 0.0
    - 28.05
    - 17.8
  - name: antenna
    kind: antenna
    allow:
    - module
    isolation_mm: 15
    from:
    - mains
    source: 'R15: 15 mm to the relays and 230 V copper; ESP32-C3-MINI-1 datasheet keep-out'
    rect:
    - 3.45
    - 31.2
    - 16.65
    - 36.8
  - name: antenna_cells
    kind: antenna
    allow:
    - module
    isolation_mm: 11
    from:
    - battery
    source: R15 battery distance 11 mm (conflicts.md 2026-10-21)
    rect:
    - 3.45
    - 31.2
    - 16.65
    - 36.8
  items:
  - name: module
    refs:
    - U1
    height_mm: 2.4
    source: ESP32-C3-MINI-1 datasheet (notes/parts-mcu-sensing.md 6)
  - name: probes
    refs:
    - J2
    height_mm: 3.8
    source: notes/parts.md 19 (recall)
  - name: selv_parts
    groups:
    - power
    - mcu
    - ui
    - sensing
    - relay
    source: every other low-voltage part
