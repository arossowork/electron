# Reduced profile (M1): the 2 vCPU / 4 GB VPS shared with other apps (docker/k8s/cluster.yaml).
#   helm upgrade --install hwp deploy/helm/hwflow-platform -n hwflow-platform --create-namespace \
#     -f deploy/helm/hwflow-platform/values-reduced.yaml
# Requests of the components running at rest (worker not counted) add up to about 0.9 GiB; with the worker 1.3 GiB.
# Limits are caps, not reservations: they may add up to more than the node, the kernel and kubelet arbitrate
# (priority classes: platform core = apps-high, evicted after the apps-low apps).
#
# Disk budget (VPS with about 8 GB free): PVCs 2 + 2 + 0.5 = 4.5 GiB (postgres, seaweedfs, nats) plus 1 GiB worker
# scratch (emptyDir on the node disk) = 5.5 GiB, leaving about 2.5 GB for images and logs. The earlier 8 + 10 + 1 GiB
# did not fit. local-path does not enforce the size, so watch `df`; raise postgres/seaweedfs when the VPS has room.
# Postgres connections: max_connections=60 is shared by Temporal (<= 32, values.yaml temporal.sqlMaxConns), api
# (pool 5 + relay), migrate and backup, which leaves headroom for admin sessions and the backup.

global:
  priorityClassName: apps-high

api:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: "1", memory: 320Mi}

web:
  enabled: true     # set false until the web image exists
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {cpu: 100m, memory: 48Mi}

worker:
  enabled: true     # set false until the worker image (#10) and entrypoint (#9) exist
  # Workers run long builds: apps-high by default so they are evicted last; set apps-low to let singing win.
  priorityClassName: apps-high
  replicas: 1
  scratchSize: 1Gi
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {cpu: "2", memory: 1536Mi}
  perQueue: {enabled: false}
  keda: {enabled: false}

# The design agent (#15) does not share the worker pod: measured in the agent image, the worker process idles at
# about 112 MiB and a Claude Code session starts at about 200 MiB (more as its context grows). A second pod costs
# the 112 MiB, and keeps the session out of the build worker's file system, tools and wider egress. Requests with
# the agent: about 1.7 GiB. Set enabled false to run builds only.
agent:
  enabled: true
  priorityClassName: apps-high
  # Operator tenants only (empty = none; every tenant brings its own API key). To run your own tenant on your
  # Claude subscription, copy the Secret into the release namespace and list the tenant:
  #   kubectl -n hwflow get secret hwflow-claude -o yaml | sed '/namespace:/d;/uid:/d;/resourceVersion:/d;/creationTimestamp:/d' \
  #     | kubectl -n <release-ns> apply -f -
  #   subscriptionTenantIds: "<your tenant UUID>"
  #   operatorCredential: {secretName: hwflow-claude, key: token, type: subscription_token}
  subscriptionTenantIds: ""
  scratchSize: 1Gi
  resources:
    requests: {cpu: 50m, memory: 320Mi}
    limits: {cpu: "1", memory: 1Gi}

postgres:
  persistence: {size: 2Gi}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 384Mi}

temporal:
  numHistoryShards: 4
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  ui: {enabled: false}   # enable and port-forward when you need it: +32 MiB

seaweedfs:
  persistence: {size: 2Gi}
  resources:
    requests: {cpu: 30m, memory: 192Mi}
    limits: {cpu: "1", memory: 384Mi}

nats:
  persistence: {size: 512Mi}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

# Metrics store + dashboard: off, enable with --set observability.enabled=true (docs/runbook.md has the memory).
observability:
  enabled: false

backup:
  retentionDays: 7
