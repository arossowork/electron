{{- if .Values.ingress.enabled }}
{{- /* Optional Traefik Ingress. On the VPS the host nginx forwards to the Services instead (docs/platform-k8s.md). */ -}}
{{- $c := dict "root" . "c" "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hwp.name" $c }}
  labels: {{- include "hwp.labels" $c | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      {{- with .Values.ingress.host }}
      hosts: [{{ . }}]
      {{- end }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service: {name: {{ include "hwp.name" (dict "root" . "c" "api") }}, port: {number: 8080}}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "hwp.name" (dict "root" . "c" "web") }}, port: {number: 80}}
          {{- end }}
{{- end }}
