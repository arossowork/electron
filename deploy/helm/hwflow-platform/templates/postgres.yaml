{{- $c := dict "root" . "c" "postgres" }}
{{- $name := include "hwp.name" $c }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels: {{- include "hwp.labels" $c | nindent 4 }}
data:
  # Same as deploy/compose/postgres-init.sh. Runs once, on the first start of an empty data volume.
  10-init.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres <<SQL
    CREATE ROLE hwflow LOGIN PASSWORD '${HWFLOW_DB_PASSWORD}';
    -- hwplatform API: owns nothing, so row-level security applies (services/platform/README.md).
    CREATE ROLE hwflow_app LOGIN PASSWORD '${HWFLOW_APP_DB_PASSWORD}';
    -- hwplatform outbox relay: sees every tenant's outbox rows (policy relay_all), nothing else.
    CREATE ROLE hwflow_relay LOGIN PASSWORD '${HWFLOW_RELAY_DB_PASSWORD}';
    CREATE ROLE temporal LOGIN PASSWORD '${TEMPORAL_DB_PASSWORD}';
    CREATE DATABASE hwflow OWNER hwflow;
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "hwp.labels" $c | nindent 4 }}
spec:
  selector: {{- include "hwp.selector" $c | nindent 4 }}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "hwp.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "hwp.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hwp.labels" $c | nindent 8 }}
    spec:
      {{- include "hwp.priority" (dict "root" . "v" .Values.postgres) | nindent 6 }}
      {{- include "hwp.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ include "hwp.image" .Values.images.postgres }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - postgres
            {{- range $k, $v := .Values.postgres.config }}
            - -c
            - {{ printf "%s=%s" $k (toString $v) }}
            {{- end }}
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- include "hwp.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- include "hwp.secretEnv" (dict "root" . "name" "HWFLOW_DB_PASSWORD" "key" "hwflow-db-password") | nindent 12 }}
            {{- include "hwp.secretEnv" (dict "root" . "name" "HWFLOW_APP_DB_PASSWORD" "key" "hwflow-app-db-password") | nindent 12 }}
            {{- include "hwp.secretEnv" (dict "root" . "name" "HWFLOW_RELAY_DB_PASSWORD" "key" "hwflow-relay-db-password") | nindent 12 }}
            {{- include "hwp.secretEnv" (dict "root" . "name" "TEMPORAL_DB_PASSWORD" "key" "temporal-db-password") | nindent 12 }}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, hwflow]}
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 20
            initialDelaySeconds: 30
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: init, configMap: {name: {{ $name }}-init}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.persistence.size }}}}
