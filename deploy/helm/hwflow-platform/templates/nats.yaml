{{- $c := dict "root" . "c" "nats" }}
{{- $name := include "hwp.name" $c }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "hwp.labels" $c | nindent 4 }}
spec:
  selector: {{- include "hwp.selector" $c | nindent 4 }}
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "hwp.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "hwp.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hwp.labels" $c | nindent 8 }}
    spec:
      {{- include "hwp.priority" (dict "root" . "v" .Values.nats) | nindent 6 }}
      {{- include "hwp.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: nats
          image: {{ include "hwp.image" .Values.images.nats }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["-js", "-sd", "/data", "-m", "8222"]
          env:
            - {name: GOMEMLIMIT, value: {{ .Values.nats.goMemLimit | quote }}}
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 20
            initialDelaySeconds: 10
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.nats.persistence.size }}}}
