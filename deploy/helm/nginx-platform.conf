# /etc/nginx/apps.d/hwplatform.conf: the hwflow platform behind the host nginx of the VPS (docker/k8s/nginx-apps.conf).
# Release "hwp" in namespace "hwflow-platform" (docs/platform-k8s.md): Services hwp-web (80) and hwp-api (8080).
# The platform has its own accounts, so the shared basic-auth login of the apps is switched off for it.
# TLS is terminated before this nginx (ngrok today), so this file only routes.

location = /platform { return 301 /platform/; }

# API: /platform/api/v1/... -> hwp-api /api/v1/... ; Server-Sent Events (run and project event streams) need
# buffering off and a long read timeout. Uploads of design versions are up to 50 MiB.
location /platform/api/ {
    auth_basic off;
    set $hwp_api hwp-api.hwflow-platform.svc.cluster.local;
    rewrite ^/platform/(api/.*)$ /$1 break;
    proxy_pass http://$hwp_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 64m;
}

location = /platform/healthz {
    auth_basic off;
    set $hwp_api hwp-api.hwflow-platform.svc.cluster.local;
    rewrite ^/platform/(healthz)$ /$1 break;
    proxy_pass http://$hwp_api:8080;
}

# SPA (only when web.enabled): static files, prefix stripped. The SPA must be built with base path /platform/.
location /platform/ {
    auth_basic off;
    set $hwp_web hwp-web.hwflow-platform.svc.cluster.local;
    rewrite ^/platform/(.*)$ /$1 break;
    proxy_pass http://$hwp_web:80;
    proxy_set_header Host $host;
}
