name: drv8837_hbridge
description: >-
  DRV8837 WSON-8 H-bridge with a 100 nF bypass on VM and on VCC, both within 1.5 mm of copper of their pin; one per
  latching-relay coil or small DC motor.
source: >-
  Hand layout from the TI DRV8837 data sheet SLVSBA4 (https://www.ti.com/lit/ds/symlink/drv8837.pdf): pin table (1 VM,
  2 OUT1, 3 OUT2, 4 GND, 5 IN2, 6 IN1, 7 nSLEEP, 8 VCC, EP = GND; `hwflow lib show Driver_Motor:DRV8837`), Power
  Supply Recommendations and Layout Guidelines (0.1 uF ceramic bypass from VM and from VCC to GND, as close to the
  pins as possible, low-impedance GND to the thermal pad). The round-8 board of home-thermostat-3 is not used: its
  U5 bypass caps C18 / C19 sit 9.2 / 6.5 mm from the part, against the 4 mm decoupling limit.
layers_min: 2
rules: {clearance_mm: 0.2, via_dia_mm: 0.6, via_drill_mm: 0.3}
# VM and VCC are separate ports, so a design may tie them (home-thermostat-3: both +3V3; both are ports, so check
# accepts the two block nets on one design net) or feed VM from a motor rail.
ports: [VM, VCC, GND, OUT1, OUT2, IN1, IN2, NSLEEP]
roles:
  U: {ref: U4, symbol: Driver_Motor:DRV8837, footprint: Package_SON:WSON-8-1EP_2x2mm_P0.5mm_EP0.9x1.6mm, value: DRV8837,
      pins: {'1': VM, '2': OUT1, '3': OUT2, '4': GND, '5': IN2, '6': IN1, '7': NSLEEP, '8': VCC, '9': GND}}
  CVM: {ref: C16, symbol: Device:C, footprint: Capacitor_SMD:C_0402_1005Metric, value_min: 100n, pins: {'1': VM, '2': GND}}
  CVCC: {ref: C17, symbol: Device:C, footprint: Capacitor_SMD:C_0402_1005Metric, value_min: 100n, pins: {'1': VCC, '2': GND}}
# Pads from `hwflow lib pads`: WSON-8 pins 1-4 at x = -0.95, 5-8 at x = 0.95 (pin 1 top left, y -0.75 .. 0.75 by
# 0.5; 0.5 x 0.25, pad ends x = -/+1.2, inner ends -/+0.7), EP 0.9 x 1.6 at the origin (x +-0.45, y +-0.8),
# courtyard +-1.6 x +-1.25. C 0402 pads +-0.48 (0.56 x 0.62), courtyard +-0.91 x +-0.46.
# CVM rot 0 at (-0.95, -2.0): pad 1 (VM) (-1.43, -2.0), pad 2 (GND) (-0.47, -2.0); CVCC rot 180 at (0.95, -2.0):
# pad 1 (VCC) (1.43, -2.0), pad 2 (GND) (0.47, -2.0). Courtyards x -1.86..-0.04 and 0.04..1.86 (0.08 mm apart),
# y -2.46..-1.54, 0.29 mm above U's (-1.25).
# Decoupling distance: pin 1 (-0.95, -0.75) to CVM pad 1 (-1.43, -2.0) is sqrt(0.48^2 + 1.25^2) = 1.34 mm centre to
# centre and 0.61 + 0.82 = 1.43 mm of track; the same for pin 8 and CVCC. Cap centres are sqrt(0.95^2 + 2.0^2) = 2.21 mm
# from the U centre (limit 4 mm).
placement:
  U: {x: 0, y: 0, rot: 0, side: front}
  CVM: {x: -0.95, y: -2.0, rot: 0, side: front}
  CVCC: {x: 0.95, y: -2.0, rot: 180, side: front}
copper:
  tracks:
  # VM: pin 1 out at 45 deg (away from pin 2) at the pad width 0.25 (0.25 mm from pin 2 and the OUT1 track), then
  # 0.4 mm up into CVM pad 1; port end at x = -2.4
  - {net: VM, layer: F.Cu, w: 0.25, pts: [[-1.0, -0.75], [-1.43, -1.18]]}
  - {net: VM, layer: F.Cu, w: 0.4, pts: [[-1.43, -1.18], [-1.43, -2.0]]}
  - {net: VM, layer: F.Cu, w: 0.4, pts: [[-1.43, -2.0], [-2.4, -2.0]]}
  # VCC: the mirror on the right
  - {net: VCC, layer: F.Cu, w: 0.25, pts: [[1.0, -0.75], [1.43, -1.18]]}
  - {net: VCC, layer: F.Cu, w: 0.3, pts: [[1.43, -1.18], [1.43, -2.0]]}
  - {net: VCC, layer: F.Cu, w: 0.3, pts: [[1.43, -2.0], [2.4, -2.0]]}
  # GND: both cap pads 2 joined, down x = 0 into the EP (0.4 mm, 0.5 mm clear of the pin 1 / pin 8 inner ends at
  # -/+0.7), up to a plane via at (0, -2.9) (0.32 mm clear of the cap pads); pin 4 into the EP along y = 0.75
  # (0.25 mm from pin 3)
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[-0.47, -2.0], [0.0, -2.0], [0.47, -2.0]]}
  - {net: GND, layer: F.Cu, w: 0.4, pts: [[0.0, -2.9], [0.0, -2.0], [0.0, -0.4]]}
  - {net: GND, layer: F.Cu, w: 0.25, pts: [[-0.95, 0.75], [0.0, 0.75]]}
  # signal ports, 0.25 mm at the 0.5 mm pin pitch (0.25 mm apart), ends at x = -/+2.4
  - {net: OUT1, layer: F.Cu, w: 0.25, pts: [[-0.95, -0.25], [-2.4, -0.25]]}
  - {net: OUT2, layer: F.Cu, w: 0.25, pts: [[-0.95, 0.25], [-2.4, 0.25]]}
  - {net: NSLEEP, layer: F.Cu, w: 0.25, pts: [[0.95, -0.25], [2.4, -0.25]]}
  - {net: IN1, layer: F.Cu, w: 0.25, pts: [[0.95, 0.25], [2.4, 0.25]]}
  - {net: IN2, layer: F.Cu, w: 0.25, pts: [[0.95, 0.75], [2.4, 0.75]]}
  vias:
  - {net: GND, x: 0.0, y: -2.9}
# x -/+2.55 (port ends 2.4 + 0.15), y from -3.25 (via edge -3.2) to 1.25 (U courtyard)
courtyard: [-2.55, -3.25, 2.55, 1.25]
notes: >-
  5.1 x 4.5 mm. The OUT tracks carry the coil pulse (about 0.1 A for a 3 V latching relay coil); widen them outside the
  block if the load needs it. No thermal vias in the EP: a pulsed relay coil dissipates well under 10 mW; for a
  continuous motor load add EP vias (thermal_vias on the component). Bind the block once per bridge (two blocks:
  entries, one per DRV8837).
