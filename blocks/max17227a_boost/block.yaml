  # Hand additions (block coordinates, U centre = origin; pads from `hwflow lib pads`):
  # COUT1 pad 2 (GND) is (0.30, -2.5), 1.15 x 1.8; a 0.4 mm track at x = 0 from inside it into the EP
  # (0.8 x 1.2 at the origin): 0.40 mm clear of pin 1 / pin 8 (inner pad edges x = -/+0.6025).
  - {net: GND, layer: F.Cu, w: 0.4, pts: [[0.0, -2.5], [0.0, 0.0]]}
  # COUT2 pad 2 (0.30, -4.9) to COUT1 pad 2 (0.30, -2.5): 0.6 mm, 0.6 mm clear of the VIN riser at x = 1.4.
  - {net: GND, layer: F.Cu, w: 0.6, pts: [[0.3, -4.9], [0.3, -2.5]]}
  # Pins 4 (GND) and 5 (AGND) to the EP under the part: y = 0.75, 0.25 mm wide, 0.25 mm clear of pins 3
  # and 6 (pad edge y = 0.375); a stub at x = 0 into the EP (EP edge y = 0.6 does not reach the track).
  - {net: GND, layer: F.Cu, w: 0.25, pts: [[-0.99, 0.75], [0.0, 0.75], [0.99, 0.75]]}
  - {net: GND, layer: F.Cu, w: 0.3, pts: [[0.0, 0.75], [0.0, 0.0]]}
  # RSEL pad 2 (GND, (2.2, 2.41)) back to pin 5 on top: 0.43 mm clear of the RSEL trace, 0.6 mm of RSEL pad 1.
  - {net: GND, layer: F.Cu, w: 0.25, pts: [[0.99, 0.75], [0.99, 2.41], [2.2, 2.41]]}
  # CIN pad 2 (GND, (2.7, -2.55), pad y -3.05..-2.05) down to a plane via at (2.7, -3.6): via 0.25 mm below
  # the pad, 0.64 mm from the VIN via (1.5, -3.3), 0.8 mm above the In2 +3V3 port track (y = -4.9).
  - {net: GND, layer: F.Cu, w: 0.4, pts: [[2.7, -2.55], [2.7, -3.6]]}
  vias:
  - {net: +3V3, x: -3.8, y: -3.7}
  - {net: GND, x: 0.0, y: 0.0}
  - {net: VIN_BST, x: 1.5, y: -3.3}
  - {net: VIN_BST, x: -4.5, y: -0.6}
  - {net: GND, x: 2.7, y: -3.6}
courtyard: [-5.55, -7.25, 4.88, 2.83]
# No plane under RSEL and the pad-6 trace on the inner layers (data sheet: < 2 pF on RSEL; about
# 0.1 pF/mm of 0.2 mm trace over 0.2 mm to a plane). Rect: x from 0.6 (0.3 mm right of the EP via
# edge at x = 0.3) to 2.8 (RSEL pad edge 2.52 + 0.28), y from 0 (pad-6 trace starts at y = 0.125) to
# 2.8 (RSEL pad 2 edge 2.68 + 0.12).
keepouts:
- {rect: [0.6, 0.0, 2.8, 2.8], layers: [In1.Cu, In2.Cu], forbids: [tracks, vias, copperpour]}
notes: 'Judged against the data sheet: LX (pin 3) to L1 pad 2 is 1.0 mm of 0.25 mm track (min. LX area); COUT1 +3V3 pad
  is 2.5 mm of 0.4 mm track from pins 1-2 and its GND pad 2.5 mm from the EP on top; CIN pad 1 is 1.0 mm from pins 7-8;
  RSEL is 1.5 mm from pad 6, away from LX and L1. Pins 1-2 and 7-8 are entered with 0.15 mm necks (0.3 mm long) between
  the 0.5 mm-pitch pads. L1 pad 1 joins CIN through two vias and In2.Cu (the boost input current is continuous, so this
  is not the switching loop). CIN GND returns to the EP through the plane via and the F.Cu pour around the VIN via; a design
  without a top GND pour still has the COUT loop on explicit top copper. One GND via in the EP (tent or plug it: via-in-pad);
  the part dissipates mW, so no thermal vias are needed. The port copper (VIN_BST at (-5.25, -1.25), +3V3 at (-0.9, -7.05)
  on F.Cu and (4.68, -4.9) on In2.Cu) is the round-8 route clipped at the block edge.'
