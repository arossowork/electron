name: max17227a_boost
description: MAX17227A TDFN-8 boost (RSEL sets VOUT; 191k = 3.3 V in home-thermostat-3), 1 uH DFE201610P, CIN 0805, 2 x
  COUT 1206, RSEL 0402; RSEL kept off the inner planes.
source: 'home-thermostat-3 round 8, 2026-10-23: placement and routed copper extracted from projects/home-thermostat-3/build/home_thermostat_3.kicad_pcb
  (U2, L1, C3, C4, C5, R40), then hand additions against the MAX17227A data sheet 19-100743 Rev 1, PCB Layout Guidelines
  p.19-20 (projects/home-thermostat-3/notes/datasheets/MAX17227A.md, notes/layout-constraints.md): explicit top-layer GND
  returns (the round-8 board had them only through the F.Cu pour), a CIN ground via, and an inner-layer keep-out under RSEL
  and the pad-6 trace (round 8 had the In1 GND plane under R40).'
layers_min: 4
rules: {clearance_mm: 0.2, via_dia_mm: 0.6, via_drill_mm: 0.3}
ports: [+3V3, GND, VIN_BST]
roles:
  U: {ref: U2, symbol: 'hw:MAX17227A', footprint: 'Package_DFN_QFN:TDFN-8-1EP_2x2mm_P0.5mm_EP0.8x1.2mm', value: MAX17227A, pins: {'1': +3V3, '2': +3V3, '3': SW_BOOST, '4': GND, '5': GND, '6': BOOST_RSEL, '7': VIN_BST, '8': VIN_BST, '9': GND}}
  L: {ref: L1, symbol: 'Device:L', footprint: 'Inductor_SMD:L_Murata_DFE201610P', value: 1u, pins: {'1': VIN_BST, '2': SW_BOOST}}
  CIN: {ref: C3, symbol: 'Device:C', footprint: 'Capacitor_SMD:C_0805_2012Metric', pins: {'1': VIN_BST, '2': GND}, value_min: 22u}
  COUT1: {ref: C4, symbol: 'Device:C', footprint: 'Capacitor_SMD:C_1206_3216Metric', pins: {'1': +3V3, '2': GND}, value_min: 47u}
  COUT2: {ref: C5, symbol: 'Device:C', footprint: 'Capacitor_SMD:C_1206_3216Metric', pins: {'1': +3V3, '2': GND}, value_min: 47u}
  RSEL: {ref: R40, symbol: 'Device:R', footprint: 'Resistor_SMD:R_0402_1005Metric', value: 191k, pins: {'1': BOOST_RSEL, '2': GND}}
# Round-8 placement relative to U2 (51.4, 41.2). Pads (rot 90 maps (x, y) to (y, -x); rot 270 to (-y, x)):
# L pad 2 (SW) (-2.28, 0.5); CIN pad 1 (VIN) (2.7, -0.65), pad 2 (2.7, -2.55); COUT1 pads
# (-2.66, -2.5) / (0.30, -2.5); COUT2 (-2.66, -4.9) / (0.30, -4.9); RSEL pad 1 (2.2, 1.39), pad 2 (2.2, 2.41).
placement:
  U: {x: 0.0, y: 0.0, rot: 0.0, side: front}
  L: {x: -3.0, y: 0.5, rot: 0.0, side: front}
  CIN: {x: 2.7, y: -1.6, rot: 90.0, side: front}
  COUT1: {x: -1.18, y: -2.5, rot: 0.0, side: front}
  COUT2: {x: -1.18, y: -4.9, rot: 0.0, side: front}
  RSEL: {x: 2.2, y: 1.9, rot: 270.0, side: front}
