  - {net: VIN_BST, layer: F.Cu, w: 0.6, pts: [[-5.25, -1.25], [-4.9, -0.9]]}
  - {net: VIN_BST, layer: F.Cu, w: 0.15, pts: [[1.4, -2.0], [1.6, -1.8]]}
